raw_quote: The predawn light painted the peaks in shades of bone and ash. Geralt stood
  ready beside Jorik. The scout wore layered furs, his longbow slung and a quiver
  of heavy arrows on his back. His jaw was set tight. Sella clasped Geralt's forearm
  once more. "Safe passage, Commander. Find your army." She nodded curtly at Jorik.
  "Watch his back." The ascent began immediately, steep and silent. The air grew thinner,
  sharper. They traversed scree slopes and knife-edge ridges. Jorik moved with uncanny
  silence, his eyes constantly scanning the rocks above. Geralt felt the Giants' gaze
  intensify – a chilling pressure, like glaciers grinding against his mind. It wasn't
  anger, but profound disinterest bordering on disdain. They saw the armor, the applicator,
  the stolen fire. They saw a trespasser. The Neferati's subtle influence felt like
  thin oil on turbulent water, barely holding the Giants' outright rejection at bay.
  As they approached a massive, weathered monolith etched with faint, swirling symbols
  – the Whispering Stone – Jorik stopped. "This is it," he breathed, unease thick
  in his voice. The Stone hummed faintly, resonating with the mountain's disapproval.
  Beyond it, the path vanished into sheer cliffs and swirling mist. Jorik looked at
  Geralt, conflict stark in his eyes. "Commander... beyond here..." His hand tightened
  on his bow.
