raw_quote: Vale remembered what Granite had told him, months ago, about the swamp
  giants' sight. They see movement and heat. Details escape them. They read the world
  through pressure, through vibration, through the null that connects them to the
  stone. Up close, the limitation was obvious. The swamp lead's eyes were milky, unfocused,
  tracking Zephyr's approach more by the shift of his weight on the stone than by
  any visual clarity.
