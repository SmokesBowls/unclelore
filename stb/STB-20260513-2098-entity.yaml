raw_quote: 'Geralt stood apart, his back against cold basalt, the Dragon Mail a second
  skin humming with dormant energy. He ran through the final checks in his mind, guided
  by the faint, precise whisper of Luminaire in the bond. Access tunnel integrity:
  92%. Defense patrol patterns predictable. Timer cascade is set. Thirty minutes from
  signal. He avoided looking directly at Kael’s people. He knew the math. These thirteen
  would not emerge. He had argued. They had refused. Their logic was impeccable: they
  were already dead. This way, their deaths would matter. To stop them would be to
  dishonor the only thing they had left.'
