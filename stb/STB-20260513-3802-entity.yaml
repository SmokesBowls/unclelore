raw_quote: 'From that day, the exchanges became more frequent. Not just Sera, but
  others: Kael, who could feel the pulse; Renn, whose scouts had learned to read the
  land; even some of the crafters, who found that the giants watched their work with
  something like fascination. Words accumulated slowly – not language yet, but the
  foundations of one. The giants learned the Nephoretti words for needle, wall, grow,
  help. The Nephoretti learned the giant sounds for stone, water, sky, war.'
