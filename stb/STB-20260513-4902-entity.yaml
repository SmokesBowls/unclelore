raw_quote: He passed the dock. The giants were still there. Not pushing. Not yet.
  They stood around the cracked slab, hands resting lightly on its edges. The lead
  grove giant had its palm flat against the wet basalt. It wasn’t humming—not yet.
  But its null was quiet. Its crystal patterns pulsed in slow, uneven rhythms. Trying.
  Listening. Vale didn’t stop. He just felt the shift in the current—a fraction less
  friction, a fraction more space.
