raw_quote: Keen looked around the chamber, taking in the faces and presences that
  surrounded her as she contemplated the most significant decision of her life. At
  Isla, whose face showed support despite obvious concern about the magnitude of transformation
  her friend was being asked to accept. At Ulric, who watched with the protective
  instincts of a father but the wisdom to recognize that this was beyond his authority
  to influence or control. At Lyra, whose young face shone with certainty and joy
  at being part of something larger than herself. At the translucent figure of the
  Aeon Keeper, ancient beyond measure but somehow radiating compassion and understanding
  that transcended the vast gulf of experience and development that separated their
  kinds.
