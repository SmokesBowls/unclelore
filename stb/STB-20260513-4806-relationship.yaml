raw_quote: They stopped as he passed. Not in fear, not in awe—but in recognition.
  They had grown accustomed to him in the weeks before he left, had learned to see
  him as part of the city's rhythm. But now they looked at him differently. They saw
  the change. The pauses between his steps. The way he moved through the world like
  someone who was listening to something they could not hear.
