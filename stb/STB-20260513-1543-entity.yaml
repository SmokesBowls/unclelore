raw_quote: 'Mika met Zypher''s gaze through the impossible glass. "Where is he?" Her
  voice, amplified by the chamber, boomed like thunder. Zypher didn''t flinch. He
  simply pointed upwards, towards the bruised sky in the mirrored courtyard. Not towards
  chambers holding bodies, but towards the roiling heavens themselves. The implication
  was chillingly clear: Geralt wasn''t trapped in a room. He was trapped *in the storm*.
  Oreck hissed beside her, lenses clicking furiously. "The temporal currents... He''s
  *holding* the door open. Still. From *then*." Mika stared at the sky beyond Zypher,
  her hope hardening into cold resolve. "Then we go *there*." She raised her hand
  towards the mirror''s surface.'
