raw_quote: Keen felt the shadow's approach as a physical pressure against her consciousness,
  as if some vast intelligence were pressing down on the world from above. But where
  Tran's instinctive response was to resist, to meet the darkness with the fire that
  sang in his veins, Keen found herself drawn toward stillness, toward a state of
  being that existed between worlds. Her breathing slowed without conscious thought,
  her awareness expanding beyond the confines of her physical form, as if some deeper
  part of her mind recognized that the approaching shadow represented not just danger,
  but opportunity.
