raw_quote: the Keeper did not speak. It was not a being that used words in any way
  the Nephoretti understood. But it was there, a presence in the stone, a rhythm beneath
  the work. When Sera sang, it answered with a pulse that steadied her voice. When
  the grove giants gathered at the needle’s base, it sent light through the crystal
  veins that made their wounds close faster. It was not a master. It was not a tool.
  It was a partner, waking slowly to a world it had been absent from for too long.
