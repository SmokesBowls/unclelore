raw_quote: Tran felt his chest ignite with heat that should have killed him. The sensation
  was like having a branding iron pressed against his heart from the inside, white-hot
  metal searing through flesh and bone to etch patterns into his soul itself. He bit
  down hard enough to crack a tooth, refusing to scream as crimson fire carved the
  Scythe-Bearer's sigil into his sternum. When the burning finally faded, he could
  feel the mark pulsing in rhythm with his heartbeat—a second heart made of living
  flame.
