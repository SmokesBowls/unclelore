raw_quote: The crossing point revealed itself not as a bridge or ford, but as a fracture
  in the air—a vertical slit where the iridescent river bent upward like a ribbon
  caught mid-flutter. Kyh stepped through first, her shadow elongating into a needle-thin
  line before snapping back with a sound like a wet parchment tear. Geralt followed,
  the Dragon Mail's gyroscopes whining as gravity inverted itself for three nauseating
  heartbeats. Behind them, Kulla paused to press his barnacle-crusted palm against
  the liquid threshold, murmuring approval at whatever harmonics he detected in its
  molecular structure.
