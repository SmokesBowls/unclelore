raw_quote: Through her dual connection, she could perceive the emotional cost of the
  separation that had been imposed when the Moon Kingdom fell. Earth's planetary consciousness
  had been cut off from the cosmic community it had been part of for millions of years,
  forced to develop in isolation without the broader perspective that contact with
  other worlds could provide. The Moon's intelligence had been traumatized by the
  destruction of the civilization it had partnered with, left to grieve alone for
  the connections and possibilities that had been severed.
