raw_quote: Mika seized the moment. "Shieldbearers—cyclonic pattern! Cover the Commander!"
  Legionnaires formed overlapping arcs, sparking lances pointed outward. Lyra scrambled
  backward, rig spitting diagnostics. "The resonance... shifting. It’s rejecting the
  corruption!" Her voice trembled with awe. Above, chroniton crystals fractured. Droplets
  fell like molten lead, searing water into toxic steam. Oreck hauled Torren onto
  a petrified root-island, the warrior’s leg weeping phosphorescent ichor. Halvar
  stood guard, blade singing as he severed another questing tendril. The cavern groaned—a
  sound of tectonic agony. Geralt remained waist-deep, Zaron’s light fighting the
  encroaching shadow. Integration. Not control. The Luminaire wasn’t a tool. It was
  a wounded god.
