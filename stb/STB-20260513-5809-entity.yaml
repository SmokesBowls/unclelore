raw_quote: Zephyr walked beside him, his sandals scraping the stone, his breathing
  even. The old Igigi had said little since they left the courtyard. He was watching—not
  the terrain, but Vale. The way he moved. The way he paused before stepping, not
  because the ground might shift, but because he had learned to feel it before he
  committed his weight. The way his presence no longer pressed against the world,
  but simply accompanied it.
