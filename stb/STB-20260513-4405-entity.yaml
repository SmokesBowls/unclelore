raw_quote: The sound came next. Not music. Not voice. A harmonic that vibrated in
  his bones, in the stone beneath him, in the water at his feet. It was the sound
  of a connection being made, of a thread being woven that had never existed before.
  It rose and fell, and in its rhythm Vale heard the pulse of the needle, the pulse
  of his own heart, and something else—something vast and patient that had been waiting
  for this moment for longer than he could imagine.
