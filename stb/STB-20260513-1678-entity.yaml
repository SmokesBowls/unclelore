raw_quote: 'Oreck slammed his cleaver into the glass. Green fire traced Mars’ coordinates.
  "She holds the gateway. We walk it." Geralt flexed his new hand. Zaron’s presence
  lingered—dimmer, fused. Dragon and keeper. Anchor and storm. Luminara’s final warning
  echoed: *"They hunt keepers. They hunt me."* The dunes shimmered. Not with heat.
  With transit signatures. Mika loaded her lance. "Then we hunt first." Five hundred
  souls readied weapons. Above, Earth’s spire pulsed gold. The Dragon Nebula watched.
  Judgment had come.'
