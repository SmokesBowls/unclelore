raw_quote: It stood at the edge of the old eastern terraces, a single-story dwelling
  of First Shore masonry, its roof long gone, its walls pocked where vrill-glass windows
  had been pried out by the occupation's salvage crews. The door was a gap. The floor
  was silt and broken tile. But the walls were standing, and the corner that faced
  the grove was sheltered from the patrol roads, and the chimney stone—cut from the
  same marsh granite the giants were piling at the wall—still held the faintest trace
  of old heat, six thousand years of hearth fires pressed into its grain.
