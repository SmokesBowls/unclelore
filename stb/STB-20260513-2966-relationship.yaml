raw_quote: Unlike Rongtai, whose heritage was defined by loss and exile, Thang's bloodline
  connected him to an unbroken tradition of solar guardianship that reached back to
  the earliest days of the Moon Kingdom's founding. He was the Phoenix Host, inheritor
  of abilities that allowed him to channel the raw power of stars themselves, to purify
  corruption through flame that burned away impurity while leaving truth and beauty
  untouched. His magic was not merely destructive—it was transformative, capable of
  reducing the most complex problems to their essential elements and rebuilding them
  in forms that served the greater harmony of existence.
