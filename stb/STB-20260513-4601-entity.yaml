raw_quote: Vale didn't rush. He stepped forward—but not into the space he had been
  watching. He stepped between. A narrow gap where nothing had appeared yet. The air
  held. He moved again. Another distortion formed—behind him this time. Not ahead.
  Tracking. The Igigi didn't interrupt. Didn't guide. But his posture had changed.
  Still. Focused. Like he recognized this.
