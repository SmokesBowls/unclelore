raw_quote: 'A harsh cry shattered the tense silence. Geralt flinched, eyes snapping
  upward. A falcon circled high overhead, its silhouette stark against the bruised
  sky. Its cry echoed again, sharp and demanding. Geralt’s gaze flicked to Kaelen.
  Her expression hadn''t changed, yet he caught it – a fleeting micro-expression,
  a flicker of recognition directed skyward. Memory slammed into him: the desperate
  climb onto the airship’s deck, the falcon’s piercing cry moments before the impact,
  its wings catching the last light as darkness swallowed him. *That falcon*. His
  eyes narrowed, locking onto Kaelen’s impassive face. "Yours?" he rasped, suspicion
  hardening his voice. "How long have you been watching? Since before the crash?"'
