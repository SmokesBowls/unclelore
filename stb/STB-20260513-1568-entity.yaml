raw_quote: 'Light stabbed their eyes. The obsidian Void Spire plunged downward into
  the Lucid Storm—an underground lake burning with captured energy, teal and blinding.
  Static crackled across Geralt’s vambrace, shorting displays. Legionnaire shields
  flickered, failing. Lyra cursed as her medicae rig sparked, injectors dropping inert.
  Bioluminescent horrors—eel-things woven from lightning—snaked through the water,
  drawn to kinetic fields. Mika glanced left. Torren’s reflection shimmered on the
  lake surface—not his scarred face, but a sneering warlord draped in Anunnaki sigils.
  Halvar recoiled from his own reflection: a skeletal husk bleeding shadow. Geralt
  saw Zaren’s dragon form fractured, scales edged in violet rot. The Luminaire’s light
  didn’t illuminate. It judged.'
