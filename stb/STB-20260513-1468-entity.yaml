raw_quote: As Geralt descended the slope, every head turned. Weapons didn’t rise,
  but hands drifted towards blades and spear shafts. Postures shifted subtly—ready,
  assessing. He kept his own hands visible, away from his sword. The Star Needle emblem
  pulsed faintly on his vambrace. By the time he reached the perimeter stakes, only
  two figures remained visible outside the tents—a broad-shouldered man sharpening
  a spearhead, and a woman with grey streaking her dark braids, tending the fire.
  The others had melted into the shadows, watchful ghosts. Geralt stopped ten paces
  out.
