raw_quote: The sound was not a song. The Igigi had not sung since Zephyr's thread
  was severed, since the Gruulith learned to hunt, since the occupation broke their
  resonance into something useful. What Igigi-Three produced was not a melody. It
  was a tone. Low. Steady. Half a beat slower than the occupation's monitoring hum.
