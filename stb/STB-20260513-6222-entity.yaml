raw_quote: The Igigi did not know the delay had doubled. She only knew that the command
  had reached her and her body had paused—not in resistance, not in refusal, but in
  processing, as if the signal had to travel through more medium than it once had.
  The saturation was thickening the stone. The thickening was slowing the propagation
  of everything that moved through it—sound, warmth, command, fragment. The network
  was accumulating, and the accumulation was creating drag.
