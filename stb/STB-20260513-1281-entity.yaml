raw_quote: Geralt tore his focus from Elara’s retreating form. He felt it now – the
  chroniton weave tightening, snapping threads whipping dangerously. The vortex wasn't
  just showing the past; it was becoming a temporal sinkhole. "How?" he gasped, the
  effort of maintaining his ghostly presence immense. "Anchor to *me*," Kaelen instructed,
  her galactic eyes blazing with focused intensity. "My temporal signature is stable.
  Push your awareness *through* mine, like a lens focusing light. See the exit point
  – the moment *before* you touched the Star Needle." Geralt visualized the canyon,
  the cold obsidian spire, his own broken body stumbling towards it. He latched onto
  Kaelen’s presence, a beacon in the chroniton storm. He pushed his will through hers,
  aiming for that precise instant of arrival. The applicator shrieked incoherent warnings.
  The dragon armor roared its approval, lending raw power. Reality lurched violently.
  The screams of battle faded abruptly, replaced by the harsh rasp of his own breath
  and the gritty crunch of scree beneath his boots. He stood before the Star Needle,
  hand outstretched but not yet touching it. Kaelen stood beside him, solid and present.
  The shimmering vortex near the wreckage pulsed once, violently, and collapsed inwards
  with a sound like tearing silk, leaving only undisturbed canyon floor.
