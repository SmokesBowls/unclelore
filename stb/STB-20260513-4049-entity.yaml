raw_quote: “I do not know.” Vale’s hands—shifting, uncertain—opened at his sides.
  “I first think destruction .. I think that I was made to destroy. Did I cause my
  own imprisonment to prevent that destruction. Or was I forced into confinement?
  And I know that for six thousand years, your songs affected me. I do not know what
  I am now. But I know after destruction passes... that when I look at this city,
  at your people, at the light that has finally returned—I do not want to destroy
  it.”
