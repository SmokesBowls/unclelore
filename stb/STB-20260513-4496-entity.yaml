raw_quote: When the light began to fade, Vale made a decision. "We stay one more night,"
  he said. "You need the rest. Tomorrow we start walking west." The Igigi nodded—a
  small dip of the head. Vale pulled the robe higher over the Igigi's shoulders, then
  sat beside him, back against the log. The cold crept in, but they had each other's
  warmth. The stars came out. The water was dark. No shimmer. No pressure. Just the
  two of them on the shore. Vale did not sleep. He watched the stranger breathe, and
  waited for the morning.
