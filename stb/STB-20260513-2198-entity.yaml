raw_quote: When Geralt finished, Oreck was silent for a full minute. Then he laughed,
  a short, bitter sound. “A debt. For stories.” He leaned forward, and his voice dropped
  to a sub-audible growl the children couldn’t hear. “I buried my story with my wife
  on a hill overlooking this canyon, Geralt. I poured it into the foundations of this
  home. I let my children chew on its bones. It is done.”
