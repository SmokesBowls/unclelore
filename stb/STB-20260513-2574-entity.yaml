raw_quote: But Geralt saw the flaw. The Vasthril moved as one perfect instrument—and
  perfect instruments have no immunity to dissonance. "Kulla!" he barked. The clay
  golem, clinging to the tawny dragon's mane, grinned as he slammed his fist into
  his own chest. A chunk of lunar regolith-mixed clay broke free, and with a grunt,
  he hurled it into the Vasthril's formation. The clay wasn't a weapon. It was a structural
  flaw. The moment it lodged between the serpent's segments, their harmonic unity
  fractured—just enough for the sapphire dragon to snap its jaws shut, shearing through
  three Vasthril at once.
