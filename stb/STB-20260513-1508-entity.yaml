raw_quote: '"The way down," Geralt finished, his voice rough. Below that Akashic library
  lay the path not just to answers, but to *her*. To the Legion pulled back from the
  brink by the force of Mika’s faith and his own indomitable will. The stairs solidified,
  leading unmistakly towards the archway. Through it, Geralt glimpsed flickering torchlight
  on rough-hewn stone – the entrance hall of the Echo Tower. He could almost hear
  the muffled tread of boots, the low hum of displaced warriors grounding themselves.
  He felt Mika’s presence there, a fierce, familiar warmth cutting through the Tower’s
  psychic chill. She was close. Real. Waiting.'
