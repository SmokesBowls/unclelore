raw_quote: The bottom rose. Mud, then stone, then wet sand. Vale dragged the body
  out of the water, up the slope, away from the tide. His legs gave out when he reached
  dry ground. He knelt in the sand, breathing hard, his hands still gripping the Igigi's
  robe. The body did not move. Vale turned him over—gently, carefully. The face was
  pale, the eyes closed. The elongated skull was bare, no crystal patterns, no markings.
  The robes were torn in places, stained with salt and something darker. He pressed
  two fingers to the neck. A pulse. Weak, but there. Not dead.
