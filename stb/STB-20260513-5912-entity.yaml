raw_quote: First Shore felt it in the marrow. The loss of the western anchor was a
  physical blow. The water in the lower terraces reversed. The vrill threads woven
  into the workshop walls went taut, then slack, then taut again. Torren, Brak’s successor,
  stood at the western gate, his forty-foot frame braced not in anger, but in weary
  readiness. “They are not advancing,” he reported, voice low. “They are holding.
  But their grip is shaking.”
