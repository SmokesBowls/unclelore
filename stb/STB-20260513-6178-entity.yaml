raw_quote: She did not speak. The slaves did not speak. But her jaw was unclenched,
  and her breath was slow, and the fragment in her chest—the same fragment that pulsed
  in the Igigi's throat, in the old woman's ribs, in the singer's larynx—pressed against
  her with a new rhythm. It was not louder. It was not clearer. It was different,
  as if the taking of the cloth and the eating of the tuber had changed its shape.
  The fragment was learning. The child was learning. Neither understood what they
  were learning, but the learning continued.
