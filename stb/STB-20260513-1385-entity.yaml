raw_quote: 'The tunnel twisted sharply downward, slick ice underfoot. Kaelen moved
  ahead like a shadow, silent. Geralt’s boots skidded. The applicator mapped thermal
  gradients: *Ambient temperature dropping rapidly. Ice structure unstable.* Ahead,
  Kaelen stopped abruptly. The tunnel ended at a sheer drop, opening into a vast,
  subterranean canyon. Below, bathed in an eerie bio-luminescent glow from colossal
  fungi, sprawled the ruins of a forgotten city. Crumbling towers clawed towards the
  cavern roof, draped in thick ice vines. The air tasted metallic, thick with millennia
  of dust. "Where?" Geralt rasped, scanning the desolation.'
