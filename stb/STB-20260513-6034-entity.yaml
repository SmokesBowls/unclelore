raw_quote: She walked the ribs. The water dropped to her ankles, then rose again.
  The reeds brushed her shoulders. Somewhere above her, a resonance chime—one of the
  old ones, woven from hollow reed and vrill-glass, left behind in the evacuation—tapped
  against its mooring. The strike was late. The echo held too long. She paused. The
  chime had not rung in a year.
