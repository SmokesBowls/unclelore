raw_quote: Kyh's shadow-form quivered at the treeline, her silver threads vibrating
  with stolen resonance. "The Echo was her first lie," she murmured, more to herself
  than Geralt. "A tower built to cast no shadow." Kulla grunted, slapping fresh clay
  onto a suddenly-unstable section of earth. "Bad acoustics," he agreed, though his
  tone suggested he understood the deeper heresy—a place designed to swallow sound,
  memory, defiance.
