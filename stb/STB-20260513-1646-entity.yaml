raw_quote: The ground betrayed them. Steps that felt solid crumbled into sucking mud
  without warning. Sweat plastered hair to necks, no longer evaporating but soaking
  into grit-stained fatigues. Ahead, the Breathing Pyramid rose—a scarred monument
  of volcanic rock and sagging sandstone, its lower half dissolving into the shimmering
  haze of swamp breath. Stagnant ponds festered; alkali rims glowed poisonous white
  beneath twin moons. Mosquitoes whined incessantly, a maddening chorus Lyra silenced
  near Halvar with targeted micro-pulses from her rig. "Pulse… stronger here," Oreck
  rumbled, cleaver tip pointing downward. Beneath their feet, the faintest tremor
  resonated—sub-audible, felt through bone. The Void Spire’s dormant song. Geralt
  halted the column before the pyramid’s shadowed entrance, a collapsed archway channeling
  dark water inward. His claw traced the air before the eroded stone. A shimmering
  resonance field flickered—dry volcanic stone resisting humid decay. "The threshold,"
  he stated. His armored palm pressed against the stone. Scales flared bright azure.
  The stone groaned… shifted… revealing a slick descent into cloying darkness smelling
  of wet earth and ozone. The Buried Luminaire awaited. Its trapped lightning would
  be their guide… or their grave. Mika tightened her grip on her shock-lance. "Single
  file. Shields synced. Watch for voids." The descent began. The stairway breathed
  beneath them.
