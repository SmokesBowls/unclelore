raw_quote: 'Aboveground, Geralt felt the shockwave through his boots. The jungle convulsed.
  Vines retracted like whipped tentacles. Lyra’s scanner shrieked. "Nexus destabilization!
  Cascade effect—all local nodes failing!" Halvar grinned, teeth bloody in twilight.
  Mika slammed her lance down, shield-wall flaring silver. Reptilian guards stumbled,
  their control collars sparking. Igigi prisoners surged against cages. Freedom’s
  first breath tasted electric. Geralt raised Luminara. Her light spluttered, then
  flared—gold bleeding through jungle gloom. "Push!" he roared. Legionnaires charged,
  blades singing. Yet Geralt knew: Oreck’s strike was a scalpel, not a cure. Roots
  ran deeper.'
