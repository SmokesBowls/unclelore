raw_quote: 'He had been wading the same circuit for a year: the deep channel between
  the western root columns, the shallows where the Nephoretti gathered reed-fiber,
  the return loop past the submerged terrace stones that marked the old boundary.
  The circuit was efficient. It distributed his weight where the marsh floor could
  bear it. It kept him visible to the watchers in the high branches. It was safe.'
