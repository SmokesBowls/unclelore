raw_quote: Geralt faced him squarely. "The Spire isn't just *my* path, Jorik. its
  where i find my answers, Where the Harbinger filed the Five." Geralt gestured towards
  the mist-shrouded peaks, doubt for the first time crossed his mind.. what does any
  of thos have to do with Mika? She was by the crashsite and not seen from since then...
  And the five.. they were on that ship with me when it crashed.. when did they get
  filed away? Shaking the thoughts away he continued. "Knowledge buried there can
  break chains far heavier than ours. Knowledge the Giants hoard, while others suffer,
  but giants in general.. they are stewards of this land.. at all costs we need them
  on our side as much as they will need us" He tapped the Star Needle emblem on his
  vambrace. "This resonance pulls north. It’s our compass. Yours feels it too, deeper
  than fear. Trust that." Jorik stared at the mist, then down at his bow. He remembered
  the raiders, the stolen Legionaries, the helplessness. He remembered crafting this
  weapon from necessity. His jaw clenched. "They'll see us," he muttered, not looking
  at Geralt. "They'll feel us climbing." "Then let them see determination," Geralt
  countered softly. "And let them add humanity to the first page in their archives."
  Jorik met Geralt’s gaze. The fear didn't vanish, but resolve hardened beneath it.
  He gave a single, sharp nod, adjusted his quiver, and stepped deliberately past
  the Whispering Stone into the mist. The mountain's disapproval sharpened instantly,
  a psychic wind threatening to push them back.
