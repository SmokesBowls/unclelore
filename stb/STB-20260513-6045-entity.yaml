raw_quote: The stone beneath the marsh remembered that song. The ribs in the channel
  remembered it. The wall at the eastern boundary, cold and scarred and silent, remembered
  it. And the warmth that traveled through the stone without needing the vrill channels—the
  warmth the occupation could not measure—carried the memory outward, toward the lost
  city, toward the Needle's heart.
