raw_quote: They stopped on a low ridge, where the rock flattened and a few stunted
  bushes offered shade. Vale sat on a block of basalt, his legs stretched out, his
  eyes on the horizon. The Igigi sat a few paces away, his back against a boulder,
  his feet raw but not bleeding. Vale passed him the  leafbowl. The Igigi drank. Passed
  it back. They sat in silence. The wind was light, carrying the smell of salt and
  dry stone. A bird circled far above, too distant to name. Vale did not speak. The
  Igigi did not ask.
