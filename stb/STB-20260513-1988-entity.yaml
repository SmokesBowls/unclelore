raw_quote: The wireframe glimmered, a last faint echo of structured Sound. Then it
  unraveled, the silver lines dissolving into the cold air like mist burning off.
  The dark-blue Anchor sigil pulsed once, brightly, and then retracted. Geralt felt
  it not as a loss, but as a final, deep click, as of a vault door closing in the
  core of his being. The world seemed louder, sharper, harsher without the buffer
  of her external presence. He was alone in his senses for the first time in months.
