raw_quote: 'The junior analyst flagged it and appended a note: Possible sensor degradation.
  Recommend replacement at next maintenance cycle. The note was reasonable. The note
  was wrong. The instrument was not degraded. The instrument was registering a thermal
  bleed that the dampeners could not account for—a seepage of warmth through stone
  that had no vrill channels to carry it, no resonance to measure, no mechanism to
  classify. The warmth was traveling through something older than the occupation''s
  physics, and the instruments, honest and precise, were beginning to stutter in its
  presence.'
