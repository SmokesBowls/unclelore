raw_quote: In the drainage channel, the handler issued a command—lift—and the Igigi's
  body responded before the command completed. The half-second delay that had been
  steady for months inverted itself. She moved at the first syllable, her arms lifting
  before the final consonant reached her ears, as if her muscles had received the
  instruction through the stone before the air carried it.
