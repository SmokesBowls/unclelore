raw_quote: 'Above, the canopy writhed. Violet light pulsed through veins in the leaves—Anunnaki
  tech feeding on doubt. Lyra’s scanner flared crimson. "Cognitive resonance intensifying!
  Shield integrity at 65%." Mika’s lance dug deeper into the earth, silver light fraying
  at the edges. Oreck pressed his palm against a glyph-carved obelisk. Emerald energy
