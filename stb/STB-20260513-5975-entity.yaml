raw_quote: They live now in the old grove territory—the deep, ancient canopy where
  the water below runs too deep for the Nephoretti and Igigi to stand. The giants
  have become the ground. Swamp giants and cliff giants alike wade chest-deep in the
  marsh, their shoulders and raised palms forming the platforms where the smaller
  survivors sleep, eat, whisper plans. The trees themselves, shaped by centuries of
  resonance and careful tending, offer their branches as shelter.
