raw_quote: Around them, the others were experiencing similar struggles. Bodies sprawled
  across the beach in various states of functionality. Some had managed to sit up,
  staring at their hands with expressions of wonder and horror. Others were still
  mostly translucent, their forms solidifying in slow waves as the last traces of
  vrill-energy crystallized into flesh. One Nephoretti—the consciousness-pattern that
  would eventually call itself Elyraen—had landed in the shallows and now lay half-submerged,
  coughing water from lungs that didn't quite understand breathing yet.
