raw_quote: As they worked, Syreth found herself reaching back through memory—those
  archives of sensation and experience that even ethereal existence could not erase.
  She remembered Tiamat. The mountain cities built into cliff faces, where dwarven-style
  stonework met elven grace in structures that seemed to grow from the landscape itself.
  The Pelagor colonies scattered along coastlines, their territorial disputes with
  land-venturing octopi more nuisance than threat. The Nephoretti moving through it
  all like living embodiments of vrill itself—thought made flesh, consciousness given
  form through the friction between ethereal and physical.
