raw_quote: She was not the child's mother. She was the other one—the one who should
  have been in the labor camps, the one the family hid in the lower room when the
  patrols passed, the one whose hands had not shaped stone but had shaped nothing
  at all since the fall. She had been a weaver before the occupation. The vrill-looms
  were silent now, their threads salvaged by the ship's resource crews, their frames
  broken down for scrap. She had not woven in a year. Her hands were idle, and the
  idleness was a different kind of cold.
