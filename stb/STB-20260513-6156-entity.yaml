raw_quote: She did not weep. The slaves did not weep. But her jaw unclenched, and
  her breath caught, and the fragment that the child had murmured and the old woman
  shaped and the Igigi carried through the channels passed through her without sound.
  She did not speak it. She did not know it existed. But the weight of it settled
  against her ribs for a moment, and the corridor registered her presence, and the
  warmth deepened by another fraction.
