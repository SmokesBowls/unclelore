raw_quote: The Igigi working beside him—a younger female, one of the ones who had
  hummed during the quarantine, one of the ones whose jaw had unclenched while the
  dampeners cycled and the humming stopped and resumed—heard it. Not through the air.
  Through the water. Through the silt. Through the same channel that carried the warmth
  from somewhere east, somewhere sealed, somewhere the occupation had declared contained.
