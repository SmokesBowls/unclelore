raw_quote: She felt the second woman arrive at the entrance. Not through communication—the
  Igigi did not communicate. Through the stone. The warmth in the chimney stone deepened
  by a fraction when the weaver's palms pressed against the corridor entrance, and
  the old woman felt the deepening the way she felt her own pulse. The network was
  not just spreading. It was resonating. A touch anywhere was a touch everywhere,
  and the warmth was the carrier.
