raw_quote: The Scorch lived up to its name at dawn. Heat shimmered off the dunes like
  liquid gold, warping the horizon into a wavering mirage. Sweat evaporated before
  it could bead, stolen by the parched air. Legionnaires shuffled forward, cloaks
  pulled high against the glare, boots sinking ankle-deep in scalding sand. Pack-lizards
  snorted plumes of steam, their scaled hides darkened by dust. Even Zaron’s hum within
  Geralt’s armor felt muffled, dampened by the oppressive stillness. Only Oreck moved
  with unbroken vigilance, his chroniton-flecked gaze scanning the blinding expanse.
  He felt it first – a low-frequency tremor transmitted through the sand, a vibration
  felt more than heard, prickling the skin beneath his scales. Not the wind. Something
  heavier. Deeper.
