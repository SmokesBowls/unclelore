raw_quote: The intensity of her embrace, the desperate grip of her fingers digging
  into the seams of his armor, momentarily shattered the dark weight crushing Geralt’s
  chest. He felt Mika’s heartbeat hammering against his own, a frantic counterpoint
  to the fading hum of the Star Needle applicator. But as the initial wave of euphoria
  receded, the horror flooded back – the temporal storm tearing through his grasp,
  the faces of his soldiers vanishing into the rip, the crushing certainty of *failure*.
  He pulled back slightly, just enough to see Mika’s tear-streaked face gazing up
  at him, radiant with relief. His own face twisted. "Mika... the Legion..." he choked
  out, the words thick with anguish. "The Eddy... I had them... I *felt* them... and
  then... gone. Torn away. I failed them. Again." He tried to pull back further, the
  burden unbearable. Mika instantly tightened her grip, her hand flying up to cup
  his scarred cheek. "No!" she commanded, her voice raw but fierce. "Look at me! Don't!
  Don't you *dare* go back there!" Her eyes blazed, anchoring him in the present moment,
  in the press of her body against his.
