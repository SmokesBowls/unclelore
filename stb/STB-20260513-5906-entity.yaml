raw_quote: Guard rotations were set. Not with spears, but with presence. Brak at the
  western gate. Keth on the eastern terraces. Mora’s song weaving through the needle’s
  threshold at dusk. Enlil’s slate shifted from convergence ratios to decay mapping—anticipation
  over correction. Nammu planted vrill-seeds in the tired soil, weeping not from grief,
  but from devotion. The stone, tired as it was, began to recognize the consistency.
  It did not snap into place. It settled. Slowly. Layer by layer.
