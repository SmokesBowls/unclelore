raw_quote: She did not cross the shadow. She marked it. She knelt and turned a single
  tile—the old First Shore kind, fired with vrill-ash, its glaze still holding a faint
  pattern of the grove's leaf-work. She turned it to its pale side and pressed her
  palm to the stone beneath. The warmth was there. Fainter. Further from the center.
  But there.
