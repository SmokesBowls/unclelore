raw_quote: The quarantine pens were not designed for the Igigi. They had been built
  for human slaves—smaller frames, shorter reach, lower tolerance for the marsh damp.
  The Igigi assigned to observation were housed four to a pen meant for eight, their
  long limbs folded against the reed-matting, their hollow eyes tracking movement
  that wasn't there.
