raw_quote: 'Lyaris turned her awareness toward the southern hemisphere. The first
  thousand had landed cleanly—their descent guided by the steady pulse of the northern
  void needle, which had survived the shattering intact. But the south… she extended
  her perception through the vrill currents and felt it immediately: a wound in the
  dimensional fabric. The southern void needle, ancient and immense, had cracked during
  Tiamat’s destruction. Its pulse was erratic, sending shockwaves through the Veil
  that made the friction between realms jagged and unpredictable.'
