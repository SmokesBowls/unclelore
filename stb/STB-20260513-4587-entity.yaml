raw_quote: As the sun dropped lower, Vale noticed it. Not ahead. Not on the horizon.
  Closer. A brief distortion along the ground—like heat over stone, but wrong. It
  flickered once, close enough to touch… then was gone. He stopped. Looked at where
  it had been. Waited. Nothing. He moved again.
