raw_quote: 'They stopped on a flat shelf of rock, the sun low and orange. Vale sat
  with his back to a stone. The Igigi sat across from him, the leafbowl between them.
  They drank. They rested. Then Vale asked: "What did you find that wasn''t gone?"
  The Igigi looked at him. His face was still, but something behind his eyes shifted.
  "Brajor." He let the word sit. "Supposed to be gone after the Sundering."'
