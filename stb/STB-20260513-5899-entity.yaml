raw_quote: At the southern survey table, Enlil’s slate was a storm of crossed lines.
  Load vectors spiraled into dead ends. Harmonic convergence ratios fractured at the
  third decimal. He tapped the abacus beads until his knuckles whitened. *“The math
  doesn’t breathe anymore,”* he muttered, voice tight. *“Without the Keeper’s chamber
  occupied, the vrill redirects away from the surface channels. The convergence is
  failing.”* Anu watched him from the shade of a woven reed canopy, slow-eyed, patient.
  *“You are trying to hold a river with a cup,”* he said gently. *“Let it find its
  bed.”* Nammu sat nearby, her hands pressed to a fractured monolith. Tears tracked
  clean lines through the dust on her cheeks. She had been the first to hear six thousand
  years of love in the stone’s veins. Now, the stone only hummed a waiting note. *“We
  forgot the second lesson,”* she whispered to the wind. *“Zephyr taught us to speak
  back. Without him, we’re only listening to our own fear.”*
