raw_quote: The stillness lasted only a heartbeat. A low, guttural snarl echoed from
  the canyon rim above them. Geralt's head snapped up. Three hulking shapes silhouetted
  against the bruised sky—scavenger drakes, drawn by the temporal bleed. Their slit-pupiled
  eyes glowed with primal hunger, fixed on the Star Needle... and them. Kaelen didn't
  move. "Lesson concluded," she said flatly. "Practical application begins. Defend
  the Needle. Use what you've woven." The largest drake launched itself from the ledge,
  leathery wings spread, diving straight for Geralt. The applicator screamed combat
  protocols. The armor roared its readiness. Geralt braced, the stabilized chroniton
  weave humming beneath his feet, his own forged harmony thrumming in his veins. Hands-on,
  indeed.
