raw_quote: In the drainage channel, the Igigi hummed a single note. No stutter. No
  double-tone. No phase ghost. The fundamental frequency emerged clean and undivided,
  and she did not notice it as a change because the note felt exactly like what she
  had always been trying to produce. She had been humming a doubled tone for so long—the
  fundamental and its offset, beating against each other—that she had forgotten what
  a single tone felt like. Now the single tone was here, and it felt natural, and
  she continued dredging silt without registering that anything had altered. The handler's
  instruments logged a sub-auditory vocalization of standard frequency and dismissed
  it. The stone hummed back, one tone, steady.
