raw_quote: 'The jungle exhaled decay-sweet breath. Halvar’s shoulders tensed beside
  him—not at Reptilian claws scraping stone, but at the whispers threading through
  dripping fronds. Private Ren’s blade trembled near a pulsing vine. "They’re slowing
  down for *me*," the Legionnaire choked. The vine answered in Ren’s own voice, colder:
  "Just like Mars." Ren’s knuckles whitened. He knew the source—the grafted vrill
  was a parasite in the air—yet the shame felt bone-deep. *His* failing. *His* abandonment.'
