raw_quote: The Keeper of Umbrageous was a ghost of possibilities. One moment, Geralt
  saw the outline of a great, draconic head; the next, the facet of a crystal; then
  the elegant, sorrowful features of a Solantri elder. His form refused to settle,
  trapped between what he was, what he could be, and what he had been made to guard.
  His eyes, when they focused on Geralt, were pools of swirling nebula, wide with
  a terror that was 10,000 years deep.
