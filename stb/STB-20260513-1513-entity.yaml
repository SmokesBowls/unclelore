raw_quote: The silence stretched, profound but comfortable, heavy with shared understanding
  and unspoken grief transmuting into shared strength. Geralt finally loosened his
  grasp slightly, though he kept Mika firmly within the circle of his arms, his hand
  resting possessively on the small of her back. He looked towards Oreck, whose impassive
  lenses betrayed nothing, yet conveyed volumes. A nod passed between them – acknowledgment,
  respect, shared burden. Geralt's gaze then swept across the ranks, meeting the eyes
  of soldiers he had led into oblivion and Mika had dragged back into existence. He
  saw their confusion still, the lingering horror of non-being, but also a dawning
  certainty. They were *here*. Because he hadn't yielded completely, and because she
  hadn't stopped believing. The impossible had been achieved. Not by one, but by two
  wills fused in purpose across the fractured timelines. The air still hummed faintly
  with the Tower’s psychic residue, but it was overshadowed by the tangible pulse
  of two hundred and fifty hearts beating strong. Geralt straightened his shoulders,
  the weariness still present but now channeled into a renewed resolve. He met Mika’s
  eyes again, a flicker of the old fire returning to his own. "The Sage?" he asked,
  his voice steadier now, grounding them both in the next step.
