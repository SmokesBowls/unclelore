raw_quote: Blood remembers? Geralt's cryptic tales flooded back – stories whispered
  in the dark about Nephoretti, beings woven from forgotten histories, who saw the
  world as layers of echoes. They spoke in riddles of 'blood memories,' ancestral
  imprints carried beyond death. Mika never understood it; it sounded like battlefield
  delirium. Yet here they were, pointing the way. Was Geralt's blood calling out?
  Her own pulse hammered against her ribs, a drumbeat of dread and desperate hope.
  She plunged into the fissure, the Nephoretti dissolving into the fractured light
  behind her.
