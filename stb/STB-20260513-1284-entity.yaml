raw_quote: '"Reinforce the anchor points," Kaelen commanded, her voice crisp. "Not
  the fraying threads themselves—the *causal anchors* holding this moment to the timeline.
  Find the strongest junctions radiating from the Needle." Geralt focused. Three pulsing
  nexus points flared in his awareness: the spire''s base fused to bedrock, the twisted
  prow of the crashed airship embedded in scree, and... himself. His own presence,
  amplified by the Needle''s resonance. The applicator shrieked: *Self-designation
  as temporal anchor violates Directive Prime!* The armor growled louder, flooding
  him with stubborn certainty. He poured his will into the bedrock anchor first, visualizing
  its deep roots strengthening. The unstable vibrations near the vortex site dampened
  slightly. "Good," Kaelen acknowledged. "Now the airship wreck. Its mass is a lodestone
  for instability."'
