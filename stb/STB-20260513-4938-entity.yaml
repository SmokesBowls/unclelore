raw_quote: Vale watched the grove giants. They were communicating—quick flickers of
  crystal light, subtle shifts in stance. Coordinating. But their coordination was
  with each other, not with the stone. They moved like a hunting pack circling prey,
  but the prey was a fracture in bedrock that had been spreading for three hundred
  years. It did not care about their formations.
