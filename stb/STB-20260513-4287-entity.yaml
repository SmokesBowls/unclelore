raw_quote: The southern basin had been low ground for as long as anyone remembered.
  Swamp giants had hunted there, before the war. Nephoretti had sung there, before
  the cold. The channels that fed it had been reliable, predictable — water flowing
  down, always down, toward the sea that was not yet a threat.
