raw_quote: The Igigi who had learned to listen were listening. Enlil's students—those
  who had remained in First Shore while he walked the labyrinth—had taken his translations
  of the division and begun to apply them. Vale saw them at the needle's base, their
  crystalline patterns soft and open, their hands pressed to the stone. They were
  not calculating. They were feeling. Letting the resonance speak to them in its own
  language, and learning to translate it into forms the others could understand.
