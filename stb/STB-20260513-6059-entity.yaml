raw_quote: The erasure did not reverse. It did not recoil. It did not fail in the
  way the dampeners had failed, or the counter-frequency, or the quarantine. It simply
  did not resolve. The Gruulith's presence pressed against Vale's edges, and the edges
  held, and the holding was not resistance. It was incompatibility. Two ontologies
  occupying the same coordinate. One invalidated existence. The other was existence
  that had already been invalidated and remained anyway.
