raw_quote: Luminaire's voice surfaced like a bubble in tar. *Emergency protocol activated.
  Seed jump primed.* That was his one way trip into the inferno. The words tasted
  of Violet Mika's blade and the clone's crooked smile. Geralt exhaled through his
  teeth, watching his breath fog in air that shouldn't have been cold. The cabin's
  emptiness wasn't spatial—it was the void where a story should have been. Somewhere
  beyond the petrified trees, Oreck's child was probably explaining to his warriors
  that Metal Man had become Math again. The thought almost made him smile.
