raw_quote: 'The group was smaller than Vale had expected. Zephyr walked at the front,
  his sandals scraping the packed ash, his eyes on the terrain ahead. Sera walked
  beside him, her hands loose at her sides, her breathing already synced to the rhythm
  of the land. Behind them came three giants: the swamp lead from the work bed—its
  name, Vale had learned, was Brak—and two grove giants, the young one who had tried
  to listen and an older female named Tessik, whose crystal patterns were faded with
  age but whose eyes missed nothing.'
