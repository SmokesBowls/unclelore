raw_quote: They moved through the outer complex with a silence that seemed impossible
  for creatures their size, their feet finding the ancient stones without sound, their
  hands touching the walls with a reverence that bordered on worship. They did not
  build shelters – the old workshops served them well enough, their high ceilings
  and wide doorways made for beings larger than Nephoretti – but they added to them.
  Stones were shifted, crystal fragments set into walls, patterns formed that echoed
  the geometries of the needle.
