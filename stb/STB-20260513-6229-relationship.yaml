raw_quote: In the drainage channel, the Igigi's trace hum faltered again—not from
  depletion this time, but from interruption. The stone beneath the water had hummed
  with a familiar tone, a frequency that matched the corridor's template, and her
  throat had opened to match it, and for a moment the hum had been strong and clear.
  Then the template had shifted—the corridor's anticipation had not been met by the
  lightning, and the stone's hum had wavered, and her own hum had wavered with it,
  a sympathetic instability that she could not control because she did not know she
  was part of it.
