raw_quote: The 200th year broke the Shadow. The sun returned—copper-bright, exactly
  as Ember had dreamed—and for a few days the silence was not oppression but relief.
  The stone warmed. The vrill stirred. First Shore did not celebrate; two centuries
  of patience had taught them that relief is not the same as reprieve. But the children
  who had never seen light lifted their faces to it.
