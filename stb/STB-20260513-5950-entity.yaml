raw_quote: The cliff giants, in their exile, became something new. They had arrived
  as victims. Over decades, they became fierce defenders, their basalt armor reforged
  with vrill-seeds and marsh iron. They learned the Deep Tongue from the swamp giants,
  haltingly at first, then with conviction. They could not undo what the dregans and
  the Gruulith had done, but they could guard the perimeter. They could stand between
  the town and the erasure.
