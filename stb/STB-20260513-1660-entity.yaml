raw_quote: 'The stairs opened into a cavern dome—a hollowed cathedral of fused basalt.
  Stalactites hung like shattered chandeliers, draped in crystalline filaments humming
  with trapped resonance. Water pooled ankle-deep, hiding razor-edged mineral ridges.
  Geralt raised a fist: halt. Sound here betrayed. Corporal Vess whispered, *"Watch
  the—"*—her own caution echoed back seconds later, overlapping. Auditory ghosts.
  Hallucinations hissed commands Mika never gave. Legionnaire Ren spun, shock-lance
  aimed at empty dark. "Who’s there?" Oreck’s amber gaze scanned the vault. Translucent
  shapes clung above—blind choral fauna, spider-limbed and paper-thin. Harmonic pulses
  rippled across their bodies. A power-cell slipped from Bren’s belt. *Clang.* The
  creatures *stirred*. Legs unfolding in liquid silence. They flowed down stalactites
  toward the sound. Mika’s hand sliced air: *Absolute silence.* Survival demanded
  it. Move slow. Step careful. Trust nothing your ears say. The fauna settled. Waiting.
  Every scrape of boot risked awakening the choir.'
