raw_quote: '"You returned from the Eddy," Geralt’s voice cut through the air, resonant
  and sure. "You endured oblivion. You stand here because defiance is your core. Mika’s
  beacon called you home." He paused, letting the acknowledgment sink in – a testament
  to their resilience. "We are hunted. The Queen felt our strike against Xal’Zirith.
  She felt Mika’s pull. She knows we gather." He scanned their faces. "We do not cower.
  We hunt *back*. Our objective: the final occupancy. Our path: north, through the
  Crescent Mountains." He gestured sharply. "Across the sands of time... Beyond the
  deep north spindlewood Forrest... Sergeant Halvar! Perimeter watch doubled. Rest
  rotations enforced. Lieutenant Mika oversees final inventory." His gaze swept the
  chamber. "We move at first light. Sleep well. Tomorrow, we shatter her expectations."'
