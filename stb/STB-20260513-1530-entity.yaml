raw_quote: 'The tendrils reacted to the light. With a collective, psychic shriek that
  bypassed his ears and rattled his teeth, they recoiled from the ship’s spine and
  writhed towards him. The air thickened with remembered anguish – the phantom screams
  of his legionnaires consumed by the crash-fire, the despair of the Anunnaki captives
  he’d doomed alongside his enemies. The applicator overloaded with sensory feedback:
  *Psychic resonance overload! Trauma imprint saturation!* Geralt staggered, the sheer
  weight of the Heart’s absorbed suffering threatening to crush his mind. Zaron’s
  spirit within the armor roared back, not with violence, but with a profound, shared
  sorrow. *We did this. We share this burden.* The armor’s light shifted, dimming
  its defiance, radiating a deep, resonant empathy instead. It pulsed in time with
  the groaning earth. The lashing tendrils hesitated, their movements becoming less
  furious, more confused. The green light within them flickered, revealing glimpses
  of trapped moments – a soldier’s final salute, a child’s terrified face pressed
  against a viewport. The desert wasn’t just attacking; it was *bleeding*.'
