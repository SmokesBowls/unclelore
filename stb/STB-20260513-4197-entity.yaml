raw_quote: That was the lie they told themselves, and in the beginning, Vale almost
  believed it. The chamber was carved into the base of a spire that had once been
  dormant, its walls lined with crystal that amplified his presence. Null anchors,
  salvaged from the Ma'at's outer terraces, held him steady. A constant feed of calibration
  pulses — the system's questions, its measurements, its slow, relentless testing
  — routed through his body so he could smooth them before they reached the settlements.
