raw_quote: 'The smell of burnt wiring clung to Geralt’s nostrils. Not ozone – something
  sharper, acrid. He blinked crusted eyes open. Sky. A fractured, bruised purple sky.
  Pain came next, a deep, grinding ache radiating from his ribs down his left leg.
  He tried to move his fingers. They twitched, coated in dried mud and something sticky
  that wasn''t mud. Memory slammed back: the frantic scramble onto the stolen airship,
  the shriek of tearing metal as they clipped the mountainside, the horrifying silence
  after impact punctuated only by groans that quickly faded.'
