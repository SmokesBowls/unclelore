raw_quote: It rose from the floor—not built, but grown. A ring of the same dark stone,
  perhaps three feet across, its surface smooth and unadorned. But it was not complete.
  A section was missing—a gap at its top, where the circle failed to close. And within
  that gap, a faint indentation. A shape Vale could not quite name. Tear-like. Asymmetrical.
  Waiting.
