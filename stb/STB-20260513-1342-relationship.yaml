raw_quote: '"Precisely," Kaelen said. "Navigating this requires anchoring your *internal*
  chroniton flow against the external drag. Fail, and you slow… stop… become part
  of the stagnation." She pointed towards the city’s center, where a colossal, vine-choked
  structure pulsed with a faint, sickly green light – another corrupted Spire, dwarfing
  the previous one. "That Spire amplifies the sinkhole effect. Our path lies beneath
  it. To reach it, you must move *against* the temporal current without fighting it.
  Flow *with* the drag, but faster." She stepped off the ledge, landing silently on
  a crumbling buttress far below. "Your turn. Anchor your signature *before* you jump."'
