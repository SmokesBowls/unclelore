raw_quote: With the mountain collapsing, Geralt’s path wasn’t out; it was through.
  He followed Zaron’s primal sense for weak stone and Luminaire’s last, fading echo
  of structural data, a ghost in the machine of his mind. He ran, jumped, and fell
  through disintegrating corridors. He was buried twice, digging himself free with
  breaking hands. He rode a cascade of rubble down a sheer internal shaft, the Dragon
  Mail saving him from being flayed alive.
