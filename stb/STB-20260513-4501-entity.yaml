raw_quote: The Igigi nodded. He pushed up slowly, using the driftwood log for support.
  His legs held. He swayed once, then steadied. His breathing was shallow but even.
  Vale picked up his leafbowl, slung it over his shoulder. He did not offer help.
  He simply waited. The Igigi took a step. Then another. His feet were bare—his sandals
  had been lost in the water. The cold sand pressed between his toes.
