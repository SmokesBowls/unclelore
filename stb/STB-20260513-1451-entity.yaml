raw_quote: The tendrils slowly retracted, sinking back into the fused glass like weary
  mourners returning to a grave. The obsidian plain settled, the violent heaving ceasing.
  Where they retreated, the sickly green veins dimmed, replaced by a faint, steady
  silver luminescence – the Heart’s own essence, cleansed, however briefly, of the
  corrupted grief. A profound silence fell, deeper and older than before, filled not
  with rage, but with a weary, ancient sorrow. The applicator’s warning flickered
  out. The armor’s empathetic glow faded, leaving Geralt standing alone in the glassy
  scar, the weight of three thousand years pressing down with a crushing, quiet understanding.
  This was the price. This silence was the echo of his victory. He turned north, towards
  the chasm’s edge, the Star Needle’s pull guiding him away from the Heart’s wounded
  memory. He walked lighter, not from absolution, but from shared burden. The desert
  watched him go, its gaze still heavy, but no longer holding him at bay.
