raw_quote: Kyh's shadow-form coalesced beside him, her edges frayed but eyes sharp.
  "Don't look directly at the walls," she warned. "They're not just walls." Geralt
  obeyed, catching glimpses from his periphery—the surfaces weren't static. They pulsed
  with slow, rhythmic expansions and contractions, like the throat of a sleeping beast.
  The Wise Ones didn't inhabit this place. They *were* this place. Every arch, every
  shimmering curve was a dragon who had folded itself into the nebula's heart, becoming
  both sanctuary and sentinel.
