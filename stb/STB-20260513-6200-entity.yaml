raw_quote: For three cycles, the stillness stopped. Keth-var did not pause at the
  collapsed workshop. The Igigi did not hum during the strike. The singer's silence
  was filled by a patrol that passed closer than usual, its dregan screaming on schedule.
  The learned rhythms were broken—not destroyed, but disrupted, forced underground,
  held in bodies that had learned to hold but had not yet learned to hold against
  pressure.
