raw_quote: Then, a sharp cry pierced the heavy silence. Above, against the bruised
  expanse, a falcon circled. It screamed again, a piercing sound that cut through
  the oppressive hum. Another joined it, then another. Falcons. Three of them, riding
  the thermals rising from the heated rocks. They wheeled, then dipped sharply, skimming
  low over the ridge Mika had been heading towards. They vanished beyond its crest.
  Water? Prey? Or… Geralt? Hope, fragile and fierce, surged. She pushed herself up,
  her legs protesting, the bloody cloth clutched tight. She scrambled up the treacherous
  slope, fingers scraping raw on sharp rock, following the falcons’ path. Maybe they’d
  lead her to water. Maybe, just maybe, to him. She crested the ridge, gasping.
