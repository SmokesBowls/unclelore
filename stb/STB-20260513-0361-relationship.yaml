raw_quote: 'Further on, suspended in luminous aquatic tanks, the third generation—the
  Brajor—drifted in silent neutrality. They were an answer to a question not yet fully
  asked, designed to pressure the Tidecallers. Their base programming lacked the aggressive
  drive of the others; they would require constant, direct oversight. But they served
  the broader strategy: to demonstrate that no biome, from the highest peak to the
  deepest trench, was beyond the Anunnaki''s reach.'
