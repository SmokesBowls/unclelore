raw_quote: These sensations troubled him, not because they were unpleasant—quite the
  opposite—but because they felt so utterly foreign to the life he had built, the
  life he understood. Tran was a farmer, son of farmers, heir to nothing more exotic
  than fertile soil and the knowledge passed down through generations of those who
  worked it. The strange stirring in his blood, the warmth that had nothing to do
  with the morning sun, the dreams of dragon fire—these things belonged to stories
  told around winter hearths, not to the practical reality of grain and harvest and
  the honest work of hands in soil.
