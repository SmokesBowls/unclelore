raw_quote: Vale listened. He told Korr of his own imprisonment, of the songs that
  had fed him, of the centuries of becoming. He spoke of the Nephoretti and the grove
  giants, of the war that had ended and the peace that had followed. He spoke of the
  Annunaki ships that were even now approaching, and of the thread that connected
  the needle to the Ma'at—a thread that should not exist, that had been waiting for
  seven thousand years.
