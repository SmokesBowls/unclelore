raw_quote: She had been humming the doubled tone for days—the fundamental and its
  phase ghost, the two frequencies beating against each other. Now they merged, and
  the merger was involuntary, and the note that emerged was so pure it hurt. Her throat
  vibrated with a precision she had never achieved, and the precision was not her
  own. The stone beneath the channel water hummed the same note. The handler's instruments
  registered a sub-auditory vocalization of impossible clarity and flagged it as an
  anomaly. The handler ignored the flag. The Igigi could not stop humming, and the
  humming was draining her, and the draining was visible in the tremor of her hands,
  the shallowness of her breath, the slow blink of eyes that were focusing on something
  very far away.
