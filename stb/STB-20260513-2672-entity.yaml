raw_quote: The black dragon's labored breaths sent tremors through the lunar dust,
  each exhale flecked with molten gold—the color of dying stars. Around it, the four
  others stood sentinel, their wings forming a living barrier against the spreading
  white sky. Kyh's shadow-form flickered with recognition. "Pyrocast," she whispered.
  The crimson dragon's massive head swung toward them, its eyes twin supernovae contained
  in obsidian. A memory unfolded—flames licking at Geralt's armor, the scent of charred
  Anunnaki biotech, the moment this same beast had spared them when it could have
  turned them to ash.
