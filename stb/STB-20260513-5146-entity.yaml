raw_quote: Zephyr was quiet for a long moment. His fingers pressed together—once,
  twice. "When Torrhen started teachin' me the Deep Tongue, somethin' like this happened.
  Not the same. But close." He looked at Vale. "I'd learned to listen. But I hadn't
  learned what it meant to be heard. The world wasn't just talkin' to me anymore.
  It was... watchin'. Waitin' to see what I'd do with what I knew."
