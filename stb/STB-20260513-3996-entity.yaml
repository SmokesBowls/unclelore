raw_quote: Sera watched them work, day after day, and marveled at the difference between
  their labor and the work of the Nephoretti. When a Nephoretti shaped stone, they
  sang to it, felt it, coaxed it into form. When the Igigi shaped stone, they measured
  it, calculated the angles, applied force at exactly the right point. Neither way
  was better. Neither way was worse. They were simply different—two languages speaking
  the same truth.
