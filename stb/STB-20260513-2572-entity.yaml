raw_quote: 'The sky above the lunar plain wasn''t empty—it was a warzone of vanishing
  subtlety. To human eyes, it might have looked like atmospheric distortions, but
  through the Dragon Mail''s enhanced optics, Geralt saw the truth: vast serpentine
  shapes—Vasthril—coiled through the void like silver razors, their segmented bodies
  flexing in perfect sync with the Queen''s white frequency. Against them, dragons
  of every hue banked and spiraled, their wingbeats carving jagged rents in the Vasthril''s
  harmonic unity. A sapphire dragon bled liquid nitrogen from a gash in its flank,
  its frost-breath faltering against a Vasthril''s thermal-dampening scales.'
