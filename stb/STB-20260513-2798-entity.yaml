raw_quote: 'The first sage emerged from the darkness not as a man, but as the absence
  where darkness conceded to something older. His robe was woven from the same iridescent
  threads Kyh’s shadow recoiled from, its hem dissolving into the floor like ink bleeding
  through parchment. His eyes—if they were eyes—were twin vortices spinning lazily
  in their sockets, consuming light and exhaling whispers of the Deep Tongue. Geralt
  had seen madness before, but Zypher’s was different: a razor-edged clarity that
  cut through delusion by embracing it wholly.'
