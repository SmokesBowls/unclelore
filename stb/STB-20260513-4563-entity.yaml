raw_quote: Vale did not ask what it taught him. He did not ask how. The Igigi leaned
  back against the rock, his eyes on the darkening sky. He picked up the leafbowl,
  drank, and set it down. "Get some rest." The fire burned low. The stars came out.
  Vale sat in silence, turning the word over in his mind. Brajor. He did not know
  what it meant. But he knew now that the Igigi had walked through something he did
  not understand—and that something had walked with him. He closed his eyes. Tomorrow,
  they would walk again.
