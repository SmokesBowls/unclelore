raw_quote: '"You aren’t meant to," Kaelen stated flatly, her voice cutting through
  his despair. "You’re learning *control*, not omnipotence. Feel the *ripple* of your
  change. See how Varik’s survival altered the Harbinger’s focus?" Indeed, the towering
  shadow had shifted its attack vector slightly, drawn by Varik’s unexpected resilience.
  A new fracture point blossomed – Captain Elara, exposed while rallying troops drawn
  by Varik’s stand. "Now," Kaelen commanded, her tone urgent. "Elara’s thread. The
  instability is the loose power cell on her belt, jarred by her sudden movement.
  Stabilize *it* before the Harbinger’s stray beam ignites it." Geralt locked onto
  the cell, a tiny point of imminent detonation. He poured his will into dampening
  its volatile core, the applicator’s protests a shrill backdrop to the dragon armor’s
  resonant hum. The cell flickered, stabilized. Elara lived, barking orders. The vortex
  pulsed violently. Geralt felt reality fraying at the edges of his perception. Kaelen’s
  hand clamped on his shoulder – a surprisingly solid anchor. "Enough! Pull back!
  You grasp the *principle*. Now feel the vortex destabilizing. We must exit *before*
  it collapses and traps us within this echo."'
