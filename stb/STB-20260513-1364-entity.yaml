raw_quote: '"Your symbiosis grows," Kaelen stated flatly as Geralt rejoined her on
  the plateau. Her galactic eyes scanned the valley below, pinpointing a ripple of
  unnatural stillness near a collapsed obsidian archway. "The locus fracture we sealed
  was minor. That," she gestured towards the arch, "is a major arterial wound. Xal''Zirith’s
  passage scarred reality itself. Its echo resonates there, weak but persistent. It
  draws power from the lingering instability." Geralt frowned. "An echo? Like the
  unmade?" Kaelen shook her head sharply. "No. This is a psychic imprint, a stain
  left by its presence. But even stains can fester. Left unchecked, it could seed
  new paradoxes or attract worse scavengers." She turned to him. "You must purge it.
  Not with force, but with resonance. Your tripartite harmony – applicator, armor,
  will – must resonate *against* its frequency. Cancel it out."'
