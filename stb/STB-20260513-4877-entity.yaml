raw_quote: Anu came next. The eldest Igigi moved slowly, his body carrying the weight
  of three hundred years on a world that was not his own. He did not ask what they
  were doing. He simply looked at Zephyr—at the way he sat, the way he breathed, the
  way his consciousness seemed to have softened at the edges—and something shifted
  in his ancient eyes.
