raw_quote: Not the seeds of plants — those had drowned generations ago. Seeds of change.
  The water, in its testing, in its remembering, had picked up fragments of the old
  world and carried them to new places. Crystal veins that had belonged to giants
  who had cracked under the pressure. Resonance stones that had fallen from Nephoretti
  circles. Igigi maps, waterlogged but still legible.
