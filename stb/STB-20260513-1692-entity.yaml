raw_quote: 'Corruption shrieked—a physical sound tearing at reality. Violet energy
  lashed viciously upwards. Then—implosion. Silence absolute. The Mars Spire flared
  blinding gold. Luminaire’s song—whole, triumphant, harmonious—exploded outward.
  The fracture sealed. Gleaming obsidian replaced weeping wounds. Above, the cosmic
  battle faltered as pure resonance washed over Martian dunes. Geralt’s gauntlet cooled.
  Luminara’s voice rang crystalline: *"Anchor secured. Pathway stabilized."* Silver
  light engulfed the Legion—not mist this time, but a promise. The Dragon Nebula shimmered—approval?—as
  Mars dissolved. Earth awaited.'
