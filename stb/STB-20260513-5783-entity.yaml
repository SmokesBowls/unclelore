raw_quote: The Nephoretti gathered at the ring's edge. Their voices rose—not in the
  work-songs of the city, but in something older. A weaving of vrill that had been
  learned in the grey, in the long centuries of the First Shadow, when survival depended
  on making the stone remember it was alive. The vrill pooled beneath their song,
  gold-blue and patient, waiting to be given shape.
