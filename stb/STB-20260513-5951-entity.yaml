raw_quote: The war did not end. It became a condition. The Gruulith remained at large,
  a ghost in the deadlands, hunting anything that strayed too far. The dregans occasionally
  tested the perimeter, screaming at the walls, their hatred undimmed. The reptilians
  were seen less and less, as if they had no further business with a city that refused
  to die. The enslaved Igigi were never seen again after the last Nexus fell. Their
  fate was unknown.
