raw_quote: '"Enough," Kaelen’s voice drifted back, disembodied. "Focus on weaving
  stability *while* moving. Anchor your own signature *to* the mountain’s chroniton
  flow." Running while stabilizing? Madness. The applicator screamed impossibility.
  The armor pulsed fiercely: *Adapt. Flow.* Geralt poured his will inward as he ran,
  forcing his tripartite harmony to resonate *with* the mountain’s deep, slow pulse,
  not against it. He visualized himself as a leaf caught in a vast river’s current.
  The screeching intensified, vibrating his teeth. Glancing back, he saw them – three
  obsidian constructs shaped like skeletal hounds, phasing *through* solid rock, their
  eyes burning voids of corrupted chroniton energy. They gained fast.'
