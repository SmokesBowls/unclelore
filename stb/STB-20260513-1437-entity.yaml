raw_quote: The fall was short. They landed hard in frigid, knee-deep water flowing
  through a narrow, pitch-black tunnel carved in ancient ice. The roar of the collapsing
  sinkhole faded above them. Only the soft rush of water and their ragged breaths
  remained. Kaelen ignited a pale temporal light in her palm. The ice walls glittered
  like fractured stars. Ahead, the tunnel curved sharply. "We’ve crossed the sinkhole
  boundary," she stated, her voice echoing strangely. "This conduit flows towards
  the locus fracture. Chroniton readings... fluctuate wildly." Geralt felt it too
  – a prickling instability in the air, like static before a storm. "What now?" he
  rasped. Kaelen’s galactic eyes scanned the darkness ahead. "Now," she murmured,
  "we walk into paradox." She started forward, the water swirling around her boots.
  Geralt followed, the applicator silent for once, the armor humming with wary anticipation.
  The path to the fracture had begun.
