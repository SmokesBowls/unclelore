raw_quote: 'The sun was high when the Igigi opened his eyes. Vale saw it happen: a
  slow parting of the lids, the pupils contracting against the light. The eyes were
  dark—deep, almost black—and for a long moment they focused on nothing. Then they
  found Vale. The Igigi did not speak. He did not try to move. He simply looked, his
  breathing shallow but steady.'
