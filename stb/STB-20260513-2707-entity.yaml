raw_quote: Zypher snapped his fingers—a sound like vertebrae popping—and the chamber's
  floor vanished. They stood suddenly suspended above an abyss where time coiled upon
  itself in spirals, each loop a noose waiting for weight. "The Queen's erasure is
  meticulous," the sage murmured. "But even she cannot unmake what was never *made*."
  His vortex eyes fixed on Geralt's chest. "Your fractures are paradoxes. Wounds that
  remember being whole."
