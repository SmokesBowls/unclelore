raw_quote: 'Light stabbed their eyes. The obsidian Spire plunged into the Lucid Storm—an
  underground lake burning teal with captured energy. Static crackled across Geralt’s
  vambrace, shorting displays. Legionnaire shields flickered, dying. Lyra cursed as
  her medicae rig sparked, injectors falling inert. Bioluminescent horrors—eel-things
  woven from lightning—snaked through the water, drawn to kinetic fields. Mika glanced
  left. Torren’s reflection shimmered on the lake: not his scarred face, but a sneering
  warlord draped in Anunnaki sigils. Halvar recoiled from his own—a skeletal husk
  bleeding shadow. Geralt saw Zaren’s dragon form fractured, scales edged in violet
  rot. The Luminaire’s light didn’t illuminate. It judged.'
