raw_quote: 'Ren’s Death: A young soldier who had survived the Forest and the Plains.
  Part of a “killer squad” that had just shattered its third Gruulith. As the construct
  fell, he cheered, lowering his guard for a second. The collapsing mass of stone
  landed on him. There was no scream. Just a terrible, soft crunch, and then he was
  gone, a red stain beneath three tons of rock.'
