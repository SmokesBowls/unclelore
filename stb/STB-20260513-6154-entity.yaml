raw_quote: She walked east. The mason had walked east. She did not know this. She
  walked east because the cold was behind her and the warmth was ahead, and her body
  followed the gradient the way thread follows tension. She passed the chimney house
  without seeing it—the old Igigi woman was a shadow within a shadow, her palm pressed
  to the stone, her chest heavy with the fragment that would not yet fall. She passed
  the shadow line without marking it—Ember had turned a tile, but the tile was only
  a marker for those who knew to look. She did not know to look. She was walking.
