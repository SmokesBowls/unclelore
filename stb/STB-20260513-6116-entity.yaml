raw_quote: Ember did not know how she understood this. The Igigi did not speak. The
  Igigi had never spoken to her. But the warmth was a language, and she had been learning
  it for weeks—through the water, through the stone, through the white lines that
  no longer looked random. She stepped inside. The boy followed. The old woman lowered
  her palm and resumed her soundless shaping of the syllable that would not yet complete.
