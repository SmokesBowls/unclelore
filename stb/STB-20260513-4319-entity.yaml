raw_quote: The grove giants shared their knowledge of stone — how to shape it, how
  to seal it, how to make it hold against the cold. The swamp giants shared their
  null — how to carry it, how to filter it, how to stand in the system's pulses without
  breaking. The Nephoretti shared their memory — songs that stretched back to the
  first anomalies, records of every calibration event, every death, every narrow escape.
  The Igigi shared their maps — not of places, but of paths. Routes through the frozen
  channels, the collapsing passes, the places where the crystals fell less frequently.
