raw_quote: They walked the path together. He did not speak. The Igigi did not speak.
  But his breathing changed when they reached the wall. His palm, pressed to the warm
  stone, trembled. She did not ask him what he felt. She knew. The same warmth. The
  same direction. The same thing the white lines had been pointing at for two centuries.
