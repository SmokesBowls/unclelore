raw_quote: Geralt secured the skin, met their gazes. No farewells. Only purpose. He
  turned his back on the nascent sanctuary, the hopeful faces, the echoes of Mika’s
  presence. The Star Needle’s resonance tugged him northward, towards the foothills
  already baking under a harsh sun. The pamphlet crinkled in his grip – a fragile
  map for a journey through hell. Survival wasn’t guaranteed. But standing still meant
  losing her forever. He strode into the scrubland, the dragon armor flaring briefly
  against the sudden heat, a defiant spark against the vast, argus-eyed desert waiting
  to swallow him whole. The hunt for anchors, for answers, for Mika, plunged into
  the furnace.
