raw_quote: She pressed her palm to the stone in the corner of the lower room, away
  from the door, away from the vrill-glass shard, away from the watchful eyes of her
  mother and the mason and the two women of fighting age. She pressed her palm flat
  against the cold tile. She waited. The warmth came—fainter than it came to Ember,
  slower, but it came. She felt it rise through the stone and settle into her fingers
  and travel up her wrist. She did not speak. The slaves did not speak unless commanded.
  But her jaw unclenched.
