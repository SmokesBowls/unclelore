raw_quote: Mika shifted, the faint scent of ozone clinging to her worn leathers. Her
  elbow nudged Geralt’s pauldron, deliberate. "Commander," she murmured, voice cutting
  through the Tower’s low thrum. Her brow furrowed slightly. "Luminaire. Before we
  step onto those sands... what exactly anchors it? What did the Akashic Records *show*
  you that demands this risk?" Her gaze held his, searching. "You were just there.
  Piecing it together. Before you descended those stairs to us." The question hung,
  sharp. Why *this* path? Why *now*? Not doubt, but necessity—knowing the target down
  to its marrow.
