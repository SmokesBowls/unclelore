raw_quote: Geralt exhaled, the memory sharp as shrapnel. "Retractor fields," he rasped.
  "Boarded her flank during a stabilization pulse. The Five…" His hand clenched. "Held
  the breach while I fought to the pilot core." He tapped his temple. "The Applicator…
  it sang to the ship’s helm. Seized navigation, life support, weapons. For twenty-seven
  seconds." A ghost of a grim smile touched his lips. "Then the Sentinels flooded
  the command spire. My shields… they knew." His voice thickened. "Dragged the fight
  out into the umbilical corridor. Bought me time to lock the core chamber." He fell
  silent, the image of Oreck roaring defiance as blast doors sealed burning behind
  his eyes. "Lights out. Woke… alone. Ash and twisted metal. Walked." The desolation
  pressed down again—endless dunes, cracked sky, the taste of copper and defeat. "Saw
  a falcon. Circling. Knew it wasn’t real. Walked until my legs gave." He shuddered.
  "Then… nothing. Woke to a chroniton storm tearing the sky. Temporal Guardian pulled
  me from the sands." Four months vanished in a blur of fractured time-streams, agony
  sculpting mastery over temporal bleed. Training that felt like dying anew each dawn.
