raw_quote: They crossed a stretch of black sand, the sun high and white. A few birds
  circled overhead, too distant to name. The wind was light, carrying the smell of
  dry stone and salt. Vale stopped once to drink from the leafbowl, passed it back
  to the Igigi, then continued. No words. No events. The Igigi's pace matched Vale's
  now. The sandals had done their work.
