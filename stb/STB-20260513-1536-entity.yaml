raw_quote: The processor core lay paralysed on the ground. She grabbed Dren’s arm—icy
  cold, trembling. "Look at me, Dren! You’re here! *Now!*" Aldrin seized Judson, shouting
  names, grounding them in the present. Soldiers locked eyes with comrades they’d
  mourned, shouting reassurances, anchoring them in shared reality. The vibrating
  hum subsided. The phantom dunes faded. Two hundred and fifty warriors stood solid,
  bewildered, but *real*, blinking in the harsh noon light. The flats were silent
  except for ragged breaths. The Tower loomed closer, its impossible shadow stretching
  long across the fractured salt. Mika met Oreck’s impassive lenses. "Geralt?" she
  demanded. Oreck shook his head. Their was a silence that overwhelmed the crowd..
  500 soldiers to tribute Geralt sacrifice Oreck spoke "Deeper.. The Sage… awaits."
  And the army continued its march to the Tower.
