raw_quote: The almost-word had given the network a template. The template was accurate—the
  stone knew what coherence felt like, and it was preparing for it, biasing warmth
  and humming readiness and shaping the space for convergence. But the template was
  also active, and its activity was causing the network to respond to its own expectations.
  The corridor anticipated the child before she arrived. The mason's fragment tightened
  in sympathy with an event that had not occurred. The singer paused too early. The
  Igigi's hum wavered when the anticipated signal did not come.
