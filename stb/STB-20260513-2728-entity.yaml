raw_quote: The ringing silence after the third ring's shattering was its own kind
  of violence. Geralt watched the guild's sovereigns—twelve faces carved from various
  species' ideals of wisdom—blink in staggered unison, their pupils dilating against
  the afterimage of harmonic disruption. One, a Threnody singer whose throat-sacs
  pulsed with muted distress, reached instinctively for the ledger at her bench. Her
  fingers passed through it as though it were mist. Ink-stained documentation didn't
  just dissolve; it *unwrote itself*, lines of text retreating into the vellum like
  startled eels.
