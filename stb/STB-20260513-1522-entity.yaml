raw_quote: The transition from foothills to the Scorch’s embrace was brutal. One moment,
  sparse grass clung stubbornly to rocky slopes; the next, the world dropped away
  into an ochre sea of dunes and cracked salt flats. Heat shimmered like a living
  thing, distorting the horizon. The air itself tasted of ash and ancient dust, scraping
  Geralt’s throat. He pulled the scarf Celly had given him tighter, squinting against
  the glare. The Star Needle’s resonance was a steady, insistent pull beneath the
  skin, guiding him true north, but the land fought him. Shifting sands sucked at
  his boots. Razor-edged salt crusts sliced his hands when he scrambled over ridges.
  He felt the desert’s gaze – not hostile, but vast, indifferent, remembering things
  he couldn’t fathom. It was a landscape steeped in an old, deep ache. He pushed harder,
  the applicator humming faintly as it mapped thermals and potential hazards, the
  armor radiating cool defiance against the sun’s hammer blows.
