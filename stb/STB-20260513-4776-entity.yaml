raw_quote: The terraces stepped down toward the water, each level green with crops
  that had not been there two months ago. The channels that had been carved by the
  flood had been shaped into gardens, their banks lined with stone that held the vrill
  and let it flow where it was needed. The marsh that had been grey for three hundred
  years was green now, alive with reeds and birds and the slow movement of water.
