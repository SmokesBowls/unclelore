raw_quote: The tile was still there. The rind was still there. The cloth was still
  wrapped around the Igigi's hand in the drainage channel two hundred meters away,
  and the hand was still warm, and the warmth was no longer a burden. The corridor
  held the memory of the shape without straining to recreate it. The system had learned
  something in the venting—not how to complete the name, but how to rest after reaching
  for it. The resting was not regression. It was consolidation, and the consolidation
  was a new kind of strength.
