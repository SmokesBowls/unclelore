raw_quote: Around Senareth, the others fell in a cascade of half-formed bodies. Some
  solidified faster, their vrill-frameworks crystallizing into coherent physical form
  while still hundreds of feet above the surface. Others trailed longer, consciousness
  still fighting the compression, bodies forming unevenly—legs before arms, torso
  twisting into shape while the head remained translucent energy. One thought-seed
  near Senareth seemed to fragment entirely, their framework shattering like glass,
  but then the pieces remembered their purpose and snapped back together with a sound
  like thunder compressed into a whisper.
