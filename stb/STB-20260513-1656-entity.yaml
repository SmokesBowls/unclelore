raw_quote: 'Oreck moved first. Boots struck water—and the storm ignited. Arcs of raw
  electricity spiderwebbed outward, seeking conduits. Gear sparked. Shields died.
  Torren screamed as an eel-thing latched onto his greave, bioelectricity seizing
  his muscles. Halvar hacked it free, blade sizzling. Mika’s reflection leered: *Weakness
  costs lives*. She fired her shock-lance point-blank into the water. Mist rose, stinging
  ozone. Geralt waded deeper, Zaron’s spirit warring with the storm’s pull. Azure
  scales flared brighter, repelling arcs. But the reflections... they whispered. Zaren’s
  dragon-shadow coiled in the ripples: *Accept her power. Let them burn.* Truth’s
  weight crushed his ribs. Each step sank him deeper into liquid light.'
