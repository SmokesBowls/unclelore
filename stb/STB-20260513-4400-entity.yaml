raw_quote: Vale looked at the city below—the islands that had been mountains, the
  shelters rising from the stone, the survivors who had learned to live with water
  instead of land. He thought of Korr, standing on the drowned Ma'at , waiting. He
  thought of Granite, old and dying, teaching the young ones to sing. He thought of
  the cliff giants, broken by their silence, learning to trust.
