raw_quote: He gestured towards the five open doorways. Within the shadows, Mika could
  just discern still forms lying on biers of shimmering energy. "The Echo Chamber
  facilitates resurrection," Zypher continued. "But it demands choice. They battle
  oblivion now, deciding whether to return. If they choose life, they will emerge...
  themselves. Wholly. Loyal to Geralt unto death, just as they were. Geralt himself?
  He hasn't passed. I cannot verify it, but I *know* it. He endures. And I expect
  him to find his own way back." Zypher's gaze swept over Mika, Oreck, Dren, and Kael.
  "Your army is free to depart or stay. They are welcome here. But Geralt... he will
  come. He always finds the path." His eyes returned to the writhing sky. "Even if
  he must forge it himself."
