raw_quote: The Igigi elder stepped into the center of the circle, his mathematical
  consciousness processing probabilities across millennia of observation. "I carry
  weapons I don't remember receiving. Thoughts that feel like mine but taste like
  implanted poison. For three thousand years, I've been whispering doubts between
  your tribes—sometimes consciously resisting, sometimes unable to recognize the programming
  until words were already spoken. Every suspicion you feel toward each other? I helped
  plant it. We Igigi did. Because she made us."
