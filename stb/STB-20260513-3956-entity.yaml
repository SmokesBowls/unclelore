raw_quote: It was not the linear, measured time of the Aeon Keepers, or the folded,
  layered time of the Ethereal Realm. It was the slow, patient time of stone and root,
  of seasons turning, of walls rising and being rebuilt, of children – not children,
  not really, but thought‑seeds that had manifested with something like youth – growing
  into adults who had never known the landing.
