raw_quote: Behind him, the Igigi moved differently. His steps were heavier. He placed
  each foot with care, testing the ground before committing his weight. The lava rock
  was not like the shores he knew—not the smooth sand of his homeland, not the worn
  stone of the deep channels. It was sharp, uneven, unpredictable. A ridge cut into
  his heel. He winced, shifted, kept moving. He did not complain. He simply adapted—slowly,
  deliberately, his breathing a little faster than it should have been. Vale did not
  look back. But he heard the difference. The heavier footfalls. The hesitation. He
  did not slow.
