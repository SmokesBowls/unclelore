raw_quote: 'The scout, Jorik, stepped forward quietly. He wasn''t imposing like the
  others, wiry and sharp-eyed. Without a word, he untied a long, dark bundle from
  his back. Unwrapping cured hides, he revealed a weapon unlike any Geralt had seen:
  a bow taller than Jorik himself, crafted from layers of horn and sinew laminated
  onto a core of dark, resilient wood. It gleamed faintly under the firelight. "Found
  the wood higher up," Jorik muttered, his voice rough. "Near a place where the Giants
  left offerings. Horn from a mountain beast that tried to eat me." He strung it with
  startling ease, the thick sinew singing taut. "No metal. No pulleys. Just... leverage."
  He handed Geralt an arrow – thick shaft, obsidian head shaped like a leaf. "Draws
  heavier than any Legion bow. Shoots farther." Geralt hefted the arrow. The craftsmanship
  was primal, lethal. "First of its kind?" Jorik nodded curtly. "Call it necessity.
  Raiders shoot farther." Geralt sensed the raw potential. "You climb with me." It
  wasn''t a question. Jorik hesitated, glancing at Sella. She gave a single, sharp
  nod. "To the Stone," she confirmed. The scout met Geralt''s gaze, a flicker of unease
  beneath his resolve. "Beyond the Stone... the Giants *see*. They feel trespass."
  Geralt understood the fear. "We face it together."'
