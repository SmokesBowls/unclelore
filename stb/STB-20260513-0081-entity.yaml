raw_quote: Understanding crashed through Senareth like revelation. The fear wasn't
  random. It was trauma, written into biology, carried forward through evolutionary
  transformation. The Pelagor who had once ventured onto Tiamat's shores—curious,
  vulnerable, occasionally territorial—had been chased away by Neferati ancestors.
  By beings who threw rocks and sticks, who defended their mountain cities from what
  they saw as invasive aquatic pests.
