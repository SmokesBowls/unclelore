raw_quote: “They fight it,” Zephyr finished. “They push ‘cause that’s what kept ‘em
  alive through the freeze. Through the flood. You don’t ask a glacier to soften.
  You brace against it.” He finally looked at Vale. “But the South ain’t ice. It’s
  cracked earth. And cracked earth don’t hold weight if you keep poundin’ on it. You
  gotta learn to let it settle.”
