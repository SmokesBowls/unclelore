raw_quote: Miral stopped often. Not to rest. To listen. She would press her palm to
  a boulder, close her eyes, breathe once, twice, then continue or change direction.
  She never explained her choices. The other Nephoretti followed without question,
  their presence a quiet web of attention that Vale could feel but not name.
