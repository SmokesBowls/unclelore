raw_quote: In the grove, the Nephoretti sharpened their tones another fraction. The
  binding tones held. The shield held. The dregans' screams were further away now,
  and the singers did not know why, and they did not stop to ask. They were inside
  the song, and the song was returning to itself, quarter-step by quarter-step, toward
  the old First Shore baseline that had been silent for a year and was silent no longer.
