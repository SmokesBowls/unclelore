raw_quote: He was nothing. He was the nameless one spat out by oblivion. He was Geralt,
  forged in defiance. He was Ragnarok, shattering chains and physics alike. But defiance
  wasn't solitary. It echoed. The 250 unmade, ripped from existence by the Harbinger’s
  cold light. Mika, fierce and loyal, riding into that same annihilation. The Five
  – reptilian scales gleaming under alien suns, shields locked around him until the
  end. They’d bled for him. Vanished for him. This slog through temporal tar, this
  brutal carving of control from chaos, wasn’t just survival. It was the only coin
  he had to buy their way back. He owed them this anchor. This focus. This relentless
  push *through*.
