raw_quote: Kaelen appeared beside him, untouched by the rain. "The vortex leads to
  the unmaking point – Xal'Zirith’s scar. Within lies the echo of the 250. But entering
  requires more than navigation." She fixed him with her galactic eyes. "To pull them
  out, you must resonate *against* the scar itself. Not gently. Violently. Channel
  your grief, your rage, your defiance – the armor’s fire, the applicator’s precision
  – into a temporal shockwave. Rip them free." Geralt stared into the swirling chaos.
  He saw Mika falling. The Five dissolving. The 250 erased. Fury ignited, cold and
  pure. The applicator’s logic fused with Zaron’s primal defiance. "No gentle pull,"
  he growled, power coiling within him. "A rip." Kaelen nodded once. "Make the scar
  bleed time. Go." Geralt stepped into the vortex. Light swallowed him. The retrieval
  began.
