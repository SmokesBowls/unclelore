raw_quote: Mora found him at dawn, standing on the eastern wall, watching the sun
  rise over the marsh. She was young—by Nephoretti measure—her hair dark, her eyes
  sharp, her hands callused from the work of rebuilding. She was the granddaughter
  of Sephra, the great-granddaughter of Teryn, the inheritor of a city that had survived
  two shadows and was learning to hope again.
