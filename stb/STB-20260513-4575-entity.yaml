raw_quote: No strategy. No exchange. Just movement. Vale kept distance, forcing it
  to turn. The thing didn't track cleanly—its movements slightly delayed, like it
  didn't fully align with its own weight. Each step left a faint shimmer in the air,
  a ripple that faded too slowly. The Igigi stepped in once—too close—then adjusted
  instantly, avoiding a downward swing that split rock where he'd stood. The split
  didn't hold; the edges of the crack seemed to soften, as if the stone was unsure
  what shape to remember. No words. No plan. Just survival.
