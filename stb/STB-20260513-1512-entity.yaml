raw_quote: He stopped, swallowing hard, forcing his gaze to stay locked with hers.
  The visceral memory of loss battled the undeniable press of her against him. He
  took a shuddering breath, trying to obey, to stay *here*. As the internal storm
  subsided enough for him to truly focus, his gaze shifted past Mika’s shoulder. He
  saw Dren standing nearby, alive, whole, staring at him with bewildered eyes. Geralt
  froze. Utterly still. His breath caught. He stared, comprehension dawning slowly,
  impossibly. He looked back at Mika, his brow furrowed in profound confusion. She
  understood instantly. A slow, compassionate smile touched her lips, fierce pride
  mixing with shared sorrow. "You saved them, Geralt," she said softly, her voice
  thick with emotion. Her hand slid down to grip his armored forearm. "You fought
  the storm. You held the door open... long enough. And *we*," she gestured slightly
  towards the gathered warriors, "we pulled them back. Through the bleed. Your fury
  tore the scar, but your strength held the path. Hers pulled them through. Together.
  Your fight, my anchor." Dren stepped forward hesitantly. "Commander? Sir... we felt
  you. Pushing us out... before the door slammed shut." Understanding washed over
  Geralt in a wave – the agonizing push he’d made, the despair of letting go... and
  Mika intercepting, pulling them from the brink. Failure and salvation intertwined.
  He looked from Dren back to Mika, the crushing weight lifting, replaced by a staggering
  awe. He pulled Mika fiercely back into his arms, burying his face in her neck, no
  words needed, just the shared, shuddering breath of impossible reunion. Relief,
  profound exhaustion, and a burgeoning, fierce joy vibrated between them. The army
  remained hushed, bearing witness to the quiet storm of their leaders' embrace.
