raw_quote: Vale sat back on his heels. The water was dark, the sky darker. The shimmer
  was gone—or hidden by the distance. The pressure was absent. The system had released
  him. He looked at the Igigi. At the water. At the shore where they had landed. He
  did not know what he had found. Only that it had broken the system long enough for
  him to reach it.
