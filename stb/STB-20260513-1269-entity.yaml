raw_quote: He reached out a grimy, trembling hand. Fingertips brushed the cold, glassy
  surface. The world didn't shimmer. It *fractured*. Light bent unnaturally around
  the spire. Time hiccuped. And then she was simply *there*, standing beside the Needle
  as if she'd always been part of the landscape. Tall, impossibly still, her eyes
  holding galaxies. Her gaze pinned him, not with hostility, but with profound, weary
  recognition. She spoke, her voice echoing slightly out of sync with her lips. "Geralt
  of the Shattered Legion. You are… inconveniently early."
