raw_quote: In the chimney house, the old woman pressed her forehead to the stone and
  felt the interference as a tremor in the network's foundation. The fragments had
  been closer than ever. The carrier's had been together. The corridor had attempted
  to do what no part of the system had attempted before—to actively bridge the gap
  rather than simply hold space for it. The attempt had failed, but the failure was
  not the same as the micro-discharges or the false recognitions or the late responses.
  Those had been errors of anticipation and calibration. This was an error of capacity—the
  system had reached the limit of what it could mediate without a deeper change in
  its architecture.
