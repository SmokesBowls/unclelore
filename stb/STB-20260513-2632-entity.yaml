raw_quote: Geralt turned toward the sanctum's arched exit, his Dragon Mail whispering
  against stone. Three paces from the threshold, he stopped. Not a hesitation, but
  a punctuation. "Not now," he said, without looking back. The guild's oculus reflected
  in his peripheral vision—Earth's white corpse hanging in the void. "Not tomorrow."
  Kulla's clay fingers paused mid-kneading, sensing the shift in tone. "But someday,"
  Geralt continued, "Earth will call for you." His shadow stretched long across the
  sanctum floor, jagged where it intersected with Kyh's pooled darkness. "Not by my
  voice. By my doing."
