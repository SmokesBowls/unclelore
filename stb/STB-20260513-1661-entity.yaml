raw_quote: Oreck didn’t flinch. His arrow’s chroniton tip hummed with stolen time—the
  spark before impact. He aimed low, beneath the root’s armored segments, toward threads
  binding it to the deeper network. "Feeding tube," he hissed. Geralt nodded, blood
  dripping from his temple onto Luminara’s haft. The relic drank it greedily, light
  wavering between white and sickly gold-green imitation. Parasite logic adapted.
  Patience wore thin.
