raw_quote: First Shore had grown outward and upward, not in defiance of the marsh,
  but with it. New terraces climbed the eastern and southern ridges, layered with
  drought-resistant tubers, deep-rooted grains, and vrill-fed legumes that thrived
  in the damp soil. The channels were no longer just waterways; they were reinforced
  with interlocking stone ribs, sung into place by three generations of Nephoretti,
  weighted by patient giants who had long ago traded force for friction. The walls
  were not built to keep the world out. They were grown to hold the city in. Fortified
  terraces. Reinforced gates. Resonance-dampening canopies woven from ironwood and
  vrill-glass. The town was prepared. Not for peace. For endurance.
