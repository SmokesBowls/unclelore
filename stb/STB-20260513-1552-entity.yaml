raw_quote: The desert heat hit like a physical blow once they descended onto the dunes.
  Radiant waves shimmered off bleached salt flats. Dragon-armor plates grew uncomfortably
  warm against Geralt’s skin, Zaron’s hum a low thrum of warning against the oppressive
  stillness. Legionnaires draped cloaks over helmets, conserving water. Pack-lizards
  plodded stoically, tongues lolling. Camp was made at dusk within a sheltered ring
  of wind-carved sandstone monoliths – refuge from biting sandstorms. Exhaustion settled
  thickly. Sentries were posted, shield generators humming softly at perimeter points.
  Mika checked the water ration logs, her frown deepening. Jorik inspected bowstrings
  rendered brittle by the dry air. As the twin moons rose, casting long, skeletal
  shadows, Oreck’s low growl echoed from the camp’s eastern edge. His cleaver wasn’t
  drawn, but his massive form barred passage towards the water sleds. His amber eyes,
  flecked with chroniton green, were locked on a shifting patch of deeper shadow behind
  stacked supply crates. Something small, trying desperately to stay silent.
