raw_quote: 'The one who had stepped forward—designation Igigi-Three—stood at the center
  of her pen. She had not sat since returning from the chamber. Not from agitation.
  From something else. Her weight was distributed evenly. Her hands rested at her
  sides. Her jaw was unclenched. The handlers noted the posture and filed it under
  behavioral anomaly: reduced compliance indicators. They did not file what the posture
  actually was. They had no classification for ease.'
