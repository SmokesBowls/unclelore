raw_quote: His leg ached. The warmth eased it, as it always had, but the easing was
  less complete now. The cold that lived in his twisted bones had found new purchase
  in the spaces where the warmth was stretched thin—where the corridor's constant
  hum was drawing energy that had once been available for his body, where the Igigi's
  trace hum and the singer's unstrained vigil and the child's sustained fragment were
  all drawing from the same finite reservoir.
