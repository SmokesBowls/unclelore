raw_quote: Year 3. Zephyr became a regular visitor, though never a resident. He and
  Mika would spend hours in the archive, her writing, him offering corrections that
  felt less like instruction and more like reminders. "The word for 'binding' has
  a secondary resonance for 'healing,' but only if your heart- tone is in the minor
  key," he'd say, and she would nod, scribbling in the margin. Geralt learned by osmosis,
  the concepts weaving into his understanding of the dragon armor's power.
