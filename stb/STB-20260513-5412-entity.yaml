raw_quote: 'The old Nephoretti woman—her name was Miral—led them east along the shore,
  then south, into terrain Vale had not walked. The land here was transitional: the
  packed ash and broken lava of the northern approach giving way to something older,
  more weathered. Stone that had been shaped by wind and water for millennia, its
  surfaces smooth in places, sharp in others, carrying the memory of forces that predated
  the city.'
