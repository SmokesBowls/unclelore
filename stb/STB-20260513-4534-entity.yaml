raw_quote: They were already walking when the light turned gold. The terrain had shifted
  again—less jagged rock, more packed ash and low scrub. The Igigi's new sandals held
  against the ground, his steps quieter now, more confident. Vale led as he had for
  days, his eyes forward, his pace steady. He still glanced east occasionally. Less
  often now. The habit was fading. The Igigi walked behind him, saying nothing. The
  silence between them had become ordinary—not awkward, not heavy. Just the rhythm
  of two people moving the same direction.
