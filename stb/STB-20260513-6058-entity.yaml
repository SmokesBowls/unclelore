raw_quote: The Gruulith pressed. The erasure pressed. The void current within Vale
  recognized the pressure—it had felt this before, in the suspended transit, in the
  long stretch between one rejection and the next. The vrill thread responded, not
  by resisting but by braiding tighter, the old contradiction pulling inward instead
  of apart. The Gruulith sought to invalidate him. He was already invalid. The system
  had spent twelve thousand years trying to place him and had paused in recognition.
  He was a contradiction that had learned to hold. The Gruulith unmade things by proving
  they should not exist. Vale should not exist. That was his baseline.
