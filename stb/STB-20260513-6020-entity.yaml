raw_quote: On the fourth day, the Igigi in the adjacent pens began to hum. Not all
  of them. Four. Then six. Then nine. The tone was the same tone Igigi-Three had started.
  Low. Steady. Half a beat slower than the occupation's baseline. The instruments
  registered it as a collective sub-auditory phenomenon, no point of origin identifiable,
  no communication protocol detected.
