raw_quote: The Igigi looked at the sea. His face was still, but something behind his
  eyes shifted. "Where I'm from… we just came out of a freeze. Longer and colder than
  any meant to survive. Then it broke. Flood took the rest." He paused. "After that,
  I was teaching… not books, not numbers on a page… You don't hear 'em till you mind
  stops, my boy… then you start seein' what they're saying." Another pause. His hand
  drifted to the stone beside him, tracing a line in the dust. "Most of the world
  we knew before was no longer, supposed to have been at least." He looked at Vale.
  "Found one that wasn't gone."
