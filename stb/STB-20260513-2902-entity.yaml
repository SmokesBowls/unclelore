raw_quote: Geralt nodded—a fractional tilt of the chin that meant more than any oath.
  Kyh turned without ceremony, her shadow splitting at the edges like overstrained
  fabric. "Home? Now? It's time.. wait for me." The portal tore open with a sound
  like a star collapsing inward, its edges braided with flames that smelled of Vaelthane's
  last breath. Figures writhed within—draconian silhouettes moving too fast to track,
  their motions leaving afterimages of solar plasma. Kyh didn't hesitate. She lunged
  into the inferno like a woman diving off a cliff, her silver threads snapping taut
  before vanishing into the conflagration.
