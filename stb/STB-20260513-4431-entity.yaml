raw_quote: The Nephoretti sang first. It was not the old song—the one that had held
  the needle for six thousand years. It was something new. Seren led them, her voice
  clear, her notes carrying the shape of the ground they would build. The vrill rose
  from the water, from the stone, from the salt-crusted sand, and began to weave.
