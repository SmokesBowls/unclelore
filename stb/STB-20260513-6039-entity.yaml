raw_quote: She returned to the grove before dusk—though dusk was a formality, the
  light no different than noon—and she did not tell anyone where she had been. The
  Igigi boy was still in the middle branches. He watched her climb back to the floating
  planters. She met his eyes. She did not speak. The Igigi did not speak.
