raw_quote: Failed Dragons. The classification was a cold, technical term in Anunnaki
  archives, a footnote from their ambitious, and ultimately futile, attempts to replicate
  the cosmic Dragon species for their legions. The physiological templates were flawless,
  reverse-engineered from data collected across a dozen purged worlds. The failure
  was metaphysical. The consciousness that awoke within the Dregan form was Dragon-adjacent—proud,
  ancient, and vast—but it was trapped in a physical shell that was a mockery of that
  heritage. They possessed the soul of a storm, caged in a body of earth and stone.
  Wings, beautiful and intricate, were grafted to frames too dense and heavy for flight,
  leaving them eternally earthbound. They were creatures of air and fire condemned
  to crawl.
