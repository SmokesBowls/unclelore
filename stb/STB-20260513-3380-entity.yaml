raw_quote: The Five began to fade—not all at once, but in sequence. Blue Mika dissolved
  into the water channels with a ripple that might have been a wink. Green Mika sank
  into the earth, their stone seat crumbling playfully. Red Mika dispersed into dancing
  embers that briefly spelled out words too quick to read. White Mika scattered like
  dandelion seeds on the wind, their whisper carrying a hint of laughter. Violet Mika
  remained longest, star-filled eyes fixed on Tran.
