raw_quote: 'The sun was low when they stopped for good—a shallow depression in the
  rock, sheltered from the wind, with a view of the water. They had made progress.
  Not far—perhaps a few miles—but enough. The rhythm was established. Vale moved automatically:
  checking the ground, finding a place to sit, setting the leafbowl between them.
  The Igigi sat where he was told, his feet aching, his body tired but stable. They
  understood each other slightly now. Not friends. Not allies. Just two people who
  had walked the same day and would walk again tomorrow. Vale looked east one last
  time. The horizon was dark. No shimmer. No pressure. Just the end of the day. He
  turned away.'
