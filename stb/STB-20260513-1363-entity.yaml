raw_quote: 'A collapsing support beam groaned overhead, threatening to crush a squad
  pinned by Harbinger fire. Geralt saw the fracture point: a stress fracture propagating
  through the beam microseconds before collapse. He focused, pouring his will into
  reinforcing the molecular bonds at the fracture’s origin point. The applicator fought
  him, flooding his senses with warnings. The dragon armor surged, amplifying his
  intent. The beam groaned, held… then buckled anyway, collapsing half a second slower.
  Not enough. The squad scrambled clear, but one soldier was clipped, his leg mangled
  instead of crushed. A partial victory. A scream tore from Geralt’s throat – frustration
  and agony mingling. "It’s not enough! I can’t save them all!"'
