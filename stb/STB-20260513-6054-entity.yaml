raw_quote: It came from the northern ridge, where the ship's shadow pooled in the
  high crags. It did not walk. It did not fly. It relocated—a displacement of space
  that left the air colder and the light dimmer in the space it had occupied. The
  dregans fell silent as it passed. The reptilian handlers averted their eyes. The
  enslaved humans and Igigi in the outer work camps felt it as a wrongness in the
  deep current, a note that did not belong, and they pressed their palms to the cold
  stone without knowing why.
