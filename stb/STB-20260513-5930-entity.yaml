raw_quote: He felt the dual pulls first. Vrill dragged one way. Void anchored another.
  They did not balance. They did not tear. They held him in place, tugging with uneven
  force, each current recognizing the other’s presence but refusing to yield. The
  opposition was familiar. Six thousand years of it lived in his marrow. But this
  was not the old fracture. This was the aftermath of it. The system had stopped trying
  to resolve him. It had stopped trying to fix the contradiction.
