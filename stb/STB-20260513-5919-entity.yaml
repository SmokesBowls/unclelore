raw_quote: It started in the far mountains. Not as cloud. Not as storm. As absence.
  A slow, rolling tide of dimness that moved faster than wind, heavier than rain.
  It swallowed the peaks first. Then the ridges. Then the valley floor. Within an
  hour, the sun was gone. Not set. Not eclipsed. Erased. The light did not fade. It
  was pulled. The air grew dense, then still. Temperature dropped. Vrill currents
  thickened, dragging like cold oil through the channels. The resonance chimes went
  silent. Then, as one, they struck a single, low note. The Needle’s pulse answered.
  Not bright. Not strong. But steady. A heartbeat in the dark.
