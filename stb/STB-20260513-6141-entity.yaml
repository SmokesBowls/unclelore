raw_quote: She did not enter the corridor. The entrance was half-collapsed, the gap
  narrow, the darkness beyond absolute. She was an Igigi. She had been conditioned
  to avoid dark spaces, to stay visible, to make her movements measurable. But she
  returned the next day. And the next. And on the fourth day, she cleared the debris
  from the entrance—not enough to be noticed, just enough to slip through. She did
  not slip through. Not yet. But the entrance was ready, and the warmth was ready,
  and the corridor was waiting.
