raw_quote: They started early. The air was cooler, the ground harder underfoot—more
  stone than ash now. The Igigi walked easier than the days before, his sandals holding.
  Vale moved ahead as usual, steady, without pause. But something was off. Not visible.
  Not obvious. Just… off. Vale slowed once. Looked out across the land. Then kept
  moving. The Igigi noticed. Said nothing.
