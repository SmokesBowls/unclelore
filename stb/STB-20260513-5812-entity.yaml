raw_quote: The giants who had trained with Zephyr before the southern journey were
  teaching others now. Vale saw them in the lower terraces—grove and swamp together,
  their null-pressure flowing in coordinated waves, shaping stone not by force but
  by asking. The younger giants watched, tried, failed, tried again. The patient instruction
  continued. The work of learning to build without forcing had become part of the
  city's rhythm.
