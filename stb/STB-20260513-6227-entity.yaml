raw_quote: In the drainage channel, the Igigi's trace hum returned. Not as a flicker.
  Not as a brief, fragile tone that vanished the moment she noticed it. It came quietly,
  a low sub-auditory frequency that matched the stone's steady hum, and it stayed.
  She did not feel the silence close over it. She did not feel her throat deplete.
  The hum was not demanding energy from her; it was receiving energy from the stone,
  carried on the same current that had vented through the network when the almost-word
  fractured. The corridor had released its excess. The release had found her, and
  the finding was not a drain but a gift—a small, steady surplus that asked nothing
  in return. She hummed, and the stone hummed with her, and the handler's instruments
  logged sub-auditory vocalization and dismissed it as environmental resonance bleed.
