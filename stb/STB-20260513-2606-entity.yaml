raw_quote: The lunar kingdom's wards flickered—just once—but it was enough. A tremor
  ran through the sky's invisible latticework, the faintest slackening of cosmic tension.
  That was all the opening the net needed. It struck Vaelthanemid-wingbeat, filament-thin
  strands of silvered force wrapping around his crimson scales like a spider's silk
  ensnaring a moth. Geralt barely registered the impact before he was hurled free,
  the Dragon Mail's gyroscopes screaming as he tumbled into the void.
