raw_quote: The Igigi blinked. His lips moved, but no sound came out. He tried again—a
  rasp, a whisper, nothing shaped. Vale reached for a leafbowl he had found among
  the driftwood—. He lifted the Igigi's head gently and put the spout to his lips.
  A sip. A cough. Another sip. The Igigi swallowed. His eyes stayed on Vale.
