raw_quote: The dampening field readings from the quarantine zone had begun to fluctuate.
  The fluctuations were microscopic—point-oh-two percent deviation from baseline,
  duration less than a second, no correlation with any known environmental variable.
  The dampeners continued to report normal function. The chamber continued to report
  zero vrill, one degree above ambient, subsonic hum steady. The fluctuation was isolated
  to a single instrument at the quarantine zone's northern edge, where the old service
  passages ran closest to the sealed corridor. The instrument was recalibrated. The
  fluctuation did not stop.
