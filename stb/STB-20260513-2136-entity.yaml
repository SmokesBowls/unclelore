raw_quote: Geralt stumbled inside, the door sealing with a final, echoing thud behind
  him. The air thrummed with a pressure that went beyond sound, vibrating in his teeth,
  his bones, the fillings of his soul. Before him, rising through the center of the
  cylindrical space, was the Source Conduit—a column of molten, corrupted light, violet
  and black and angry green, twisting like a tormented serpent. Around it, floating
  in the air without support, hung concentric rings of holographic interfaces, streaming
  torrents of alien data. This was not just one Needle’s heart. This was the control
  nexus for all five. The font of the continent’s poison.
