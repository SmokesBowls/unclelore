raw_quote: '- They stopped near a low slope of broken stone. Vale didn''t wait as
  long this time. "You said it didn''t fight." The Igigi nodded. "Didn''t need to."
  A pause. "It knew what was around it… before anything got close." Vale glanced at
  the ground. At the ridge. At the air between. The Igigi continued, almost to himself.
  "Down there… you don''t move unless you already know where everything is." A beat.
  "Or you don''t move at all." Vale didn''t respond. But he understood something—not
  fully, not clearly—but enough to feel the weight of it.'
