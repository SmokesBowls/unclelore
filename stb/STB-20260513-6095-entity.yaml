raw_quote: He looked at her hand. The Igigi did not touch. The Igigi had not touched
  in six thousand years. Touch was communication, and communication was forbidden,
  and the collar was cold around his throat. But his jaw was unclenched. His palm
  had pressed the warm stone of the wall. He reached out and took her hand and let
  her pull him through.
