raw_quote: She pointed. At the base of the ridge, where the flat shelf of dark stone
  met the broken terrain, a single pillar of shaped rock stood where none had stood
  before. Not tall—perhaps Vale's height. Not ornate. Just a column of the same dark
  stone, its surface smooth, its placement deliberate. A marker. A boundary. A word
  spoken in the language of stone.
