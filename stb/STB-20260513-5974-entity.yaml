raw_quote: The survivors fled north, up the coast. Not in formation. Not in order.
  Strung out. Separated. Clusters of swamp giants carrying Nephoretti children. Igigi
  with broken slates. Cliff giants who had already lost one home now losing another.
  Sera did not make it out. Kima's last calculation was the evacuation route. Ember
  was carried by a grove giant whose name is now only a vibration in the memory-stone.
