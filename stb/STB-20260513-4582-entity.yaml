raw_quote: They stopped briefly in the shade of a broken outcrop. Vale stepped forward
  again too quickly. The Igigi spoke without looking at him. "Too soon." Vale paused.
  Looked at him. The Igigi didn't explain. He just tapped the ground once with his
  foot. "Listen first." That was all. Vale said nothing—but this time, when he stepped
  forward again, he waited. A fraction longer.
