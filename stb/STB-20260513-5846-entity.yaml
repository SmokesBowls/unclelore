raw_quote: '"—was a door opening, or rather closing," Zephyr finished. He plucked
  a vrill-threaded vine from Sera''s abandoned basket, its luminescent fibers pulsing
  between his fingers. "Not all prisons have bars, boy. Some are equations." The vine
  twisted into a knot that glowed briefly crimson before unraveling. "The day you
  found me? That was my homeland''s Nexus reaching through the fracture. And this—"
  He kicked the half-formed eastern anchor, sending clay fragments skittering. "—will
  be my return ticket."'
