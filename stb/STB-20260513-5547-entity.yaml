raw_quote: The group gathered at the camp's edge. Miral stood at the front, her palms
  turned upward in the ancient gesture of offering. The other Nephoretti formed a
  loose arc behind her. Enlil and Nammu waited together, the mathematician's slate
  hanging forgotten, Nammu's palm pressed to the stone. Brak and Keth stood at the
  flanks, their null-pressure soft, receptive. Zephyr positioned himself slightly
  apart—watching, measuring, ready.
