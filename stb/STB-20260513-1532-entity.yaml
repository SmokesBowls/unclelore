raw_quote: '"Show it," Geralt rasped, forcing the words through the psychic torrent.
  He sheathed his blade. He couldn’t fight this with steel. He focused inward, channeling
  Zaron’s resonance through the armor, amplifying the shared grief, the terrible necessity
  of that sacrifice three millennia past. He didn’t justify it; he *acknowledged*
  it. He let the memory flood him – the desperate gamble, the stolen ship groaning
  as it plunged, the faces of his legionnaires saluting their death, the horrified
  Anunnaki captives he hadn’t saved. He poured that raw, unvarnished truth into the
  armor’s empathetic pulse, broadcasting it towards the writhing tendrils of solidified
  sorrow. *We did this. We bear this. We remember them.*'
