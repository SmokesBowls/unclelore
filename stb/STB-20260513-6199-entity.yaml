raw_quote: The two halves of the name collided without meeting. The corridor's hum
  wavered—a brief, dissonant pulse that traveled through the stone and into the network
  and registered, faintly, in the chimney house where the old woman's eyes opened,
  in the grove where the older singer's voice caught, in the drainage channel where
  the Igigi's humming faltered. The interference passed. The lightning faded. The
  thunder rolled.
