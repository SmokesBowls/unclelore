raw_quote: Vale’s breath began and refused to finish. It hung in his chest, caught
  at the threshold, neither pulling in nor pushing out. The air around him held the
  same suspended weight, but the mechanical pressure had lifted. The correction no
  longer pressed against his ribs. It simply waited. And in that waiting, the internal
  grid misaligned.
