raw_quote: The first to notice was not a survivor. It was an Igigi from the southern
  labor camp, the same young female who had heard the second fragment pass through
  the channel silt and felt it echo in her throat. She had been reassigned to debris
  clearance in the workshop district, a punishment detail for the half-second compliance
  delay that had survived recalibration. The handlers did not know why the delay persisted.
  They assigned punishment details to anomalies they could not correct. The punishment
  was meant to discourage. It did not discourage. It placed her within fifty paces
  of the corridor's eastern entrance.
