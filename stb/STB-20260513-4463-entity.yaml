raw_quote: It was subtle at first—a misalignment in the current. The steady push east
  faltered for a single heartbeat, then returned. Vale stopped. Listened. The silence
  broke unevenly. A drip of water—not from ahead, but from his left. Then a splash
  from behind. Then nothing. The shimmer flickered. Not gone—unstable. It bent, folded,
  then snapped back.
