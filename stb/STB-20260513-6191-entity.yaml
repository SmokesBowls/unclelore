raw_quote: He did not understand what had happened. He did not know that the child
  had felt the alignment come early and fail. He did not know that the two halves
  of the name—the first syllable carried by the Igigi and the child and the old woman,
  the second syllable misfiring in the singer and the mason and the corridor—had almost
  met across the distance between the second house and the workshop district. Zeph—
  in one body. —yrr in another. The same lightning strike. The same heartbeat. But
  not the same place. Not the same mouth.
