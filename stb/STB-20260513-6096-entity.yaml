raw_quote: The warmth came. Not from the stone beneath her palm. From the stone within
  her memory. From the path behind her. From the center that was holding, somewhere
  in the sealed chamber, somewhere the occupation had declared contained. The warmth
  did not travel through the vrill channels—the channels were severed. It traveled
  through something older. Something the occupation could not measure. Something the
  occupation had given a year to reevaluate, not knowing the warmth did not need a
  year. It needed permission.
