raw_quote: Overseer Ninurta—whose biological engineering expertise had been honed
  across three millennia of systematic genocide on seventeen conquered worlds—observed
  the first generation with a satisfaction that was both professional and profoundly
  cold. His consciousness, a flickering star within the vast nebula of the Anunnaki
  collective, processed the data streams. Each unit stood a uniform twelve feet tall,
  their bodies a brutalist architecture of living stone. Where the Giants' stone-flesh
  was a testament to millennia of patient, tectonic evolution—a symphony of mineral
  deposits and fossilized history—the Gruulith were a scree-slope, a crude aggregate.
  Their surfaces shifted between the unyielding hardness of granite and the viscous,
  adaptive flow of magma, a direct response to threat assessment algorithms he himself
  had encoded.
