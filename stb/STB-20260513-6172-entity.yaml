raw_quote: In the chimney house, the old Igigi woman shifted her palm on the chimney
  stone and felt the exchange complete. Not through communication—the Igigi did not
  communicate. Through the stone. The warmth deepened by a fraction when the cloth
  was taken, and deepened again when the tuber was left, and the two deepenings were
  different in quality. The first was a taking. The second was a giving. The warmth
  carried both, and the stone held both, and the old woman felt the difference the
  way she felt the difference between rain and mist.
