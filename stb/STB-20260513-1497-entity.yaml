raw_quote: They descended. The stairs were impossibly smooth, cold beneath their boots,
  each step echoing faintly into the abyss. Around them, the Akashic Records unfolded.
  Not as dusty archives, but as living starscapes – constellations shifting into faces,
  battles, moments frozen in time. Nebulae swirled into equations, galaxies condensed
  into whispered secrets. The air hummed with the weight of all existence, pressing
  against Geralt’s senses. Jorik gasped softly, stumbling as a phantom wave crashed
  silently beside them. "It's... everything," he breathed, overwhelmed.
