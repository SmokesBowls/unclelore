raw_quote: Kyh materialized first, her shadow-body frayed at the edges like burnt
  paper. "They didn't refuse us," she said, voice thin. "They *dismissed* us." The
  distinction carved itself into Geralt's hollowed-out chest. Refusal would have meant
  engagement, however hostile. This was worse—the universe shrugging.
