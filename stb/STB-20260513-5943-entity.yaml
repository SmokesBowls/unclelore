raw_quote: It was the northernmost point, already weakened by decades of strain. Enlil’s
  line had been monitoring it remotely, tracking the slow decay of its vrill pulse.
  Then one evening — though evening and noon were indistinguishable now — the pulse
  stopped. Kima, Enlil’s successor, sent a scout team. They found the anchor stone
  intact, its glyphs still carved, its structure unbroken. But it was silent. Not
  drained. Not cracked. Silenced, as if something had reached inside the resonance
  and removed it.
