raw_quote: She did not speak. The Igigi did not speak. But she sent something through
  the stone—not a word, not a signal, but a presence, a steadying pressure that flowed
  outward into the warmth and toward the child and the mason and the singer and the
  Igigi in the channel. She could not carry their weight for them. But she could remind
  the stone to hold them while they carried it themselves.
