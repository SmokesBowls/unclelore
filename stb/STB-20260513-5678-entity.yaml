raw_quote: Vale stopped. The others stopped with him—not because he commanded, but
  because they felt the shift together. The walls ahead were darker, their surfaces
  unbroken by green veins. The grey light seemed thinner here, absorbed by stone that
  reflected nothing. And at the edge of perception, a faint red shimmer. The same
  quality Vale had felt before—the pressure, the refusal, the clear, consistent no.
