raw_quote: Torrhen nodded slowly, the sound like grinding continents. "The stone-dreams
  sing of this. Not of a date, but of a returning season. A great convergence that
  scours and renews, like frost heaving stone. The interval is written in the bones
  of stars, not in numbers. We know it only because its shadow touches the deep places
  first." His geological wisdom touched patterns of change that operated according
  to principles similar to those governing individual growth but amplified across
  scales that made planetary evolution seem rapid by comparison. "Different origins
  create different capabilities. Different capabilities create richer synthesis. Complexity
  serves transcendence when guided by wisdom sufficient for integration rather than
  fragmentation."
