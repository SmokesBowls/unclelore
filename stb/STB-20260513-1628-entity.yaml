raw_quote: 'Above, Mika’s lance wavered. Shieldbearers formed overlapping barriers,
  but the corruption slithered beneath. An Igigi prisoner pressed against crystalline
  bars—his eyes vacant, lips moving: "The chains fit better now..." The vine above
  him crooned back: "Quiet is safety." Geralt felt Luminara shudder. Her golden light
  trembled against encroaching violet. This wasn’t attack. It was seduction. Truth
  reborn as doubt.'
