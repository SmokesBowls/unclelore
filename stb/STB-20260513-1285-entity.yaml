raw_quote: 'Geralt shifted his focus. The wreck''s twisted metal groaned under his
  temporal pressure. He felt its chaotic energy resisting stabilization—a physical
  echo of the crash''s violence. He didn''t force calm; he *redirected* the energy
  downward, channeling it into the bedrock anchor he''d just fortified. The groan
  subsided into a deep, settling rumble. The chroniton bleed dropped sharply. "Threshold:
  3.1%," the applicator reported, its tone grudgingly factual. Geralt swayed, the
  effort draining him. Only one anchor remained—himself. The hardest.'
