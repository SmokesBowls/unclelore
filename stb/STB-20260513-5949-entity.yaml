raw_quote: By the hundredth year of the darkness, First Shore was an island in a silent
  sea. The vrill channels still ran beneath the town, sustained by the needle’s residual
  pulse and the patient work of the grove giants. But beyond the perimeter, the land
  was dead. Not barren — the roots still grew, the water still moved — but the resonance
  was gone. The stone no longer sang. It only remembered.
