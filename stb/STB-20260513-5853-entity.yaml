raw_quote: Vale stood at the shoreline until the golden threads in the water dimmed
  to pewter, then to nothing. The marsh reeds bent toward the horizon, their tops
  brushing the surface like mourners reaching for a departed boat. Somewhere inland,
  a vrill-seed Mora had planted cracked its husk, and the faint luminescence bled
  up through the soil in a slow, green sigh.
