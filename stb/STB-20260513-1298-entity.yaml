raw_quote: Kaelen vanished into a side gorge choked with ice. Geralt followed, skidding
  on slick rock. The gorge dead-ended at a sheer ice wall. "Dead end!" he yelled.
  Kaelen slammed her palm against the ice. "It’s a temporal mirror! Feel its anchor
  point – fractured! Stabilize it *now*!" The chronohounds burst into the gorge behind
  them. Geralt whirled, pressing both hands to the ice wall. He felt its instability
  – the anchor point was a spiderweb of cracks. He poured his will into reinforcing
  the central nexus, weaving his harmony into the fractures. The ice shimmered, becoming
  translucent, revealing a glacial cavern beyond. "Through!" Kaelen ordered. Geralt
  dove sideways as the lead chronohound lunged, its jaws snapping shut on empty air
  where he’d stood. He rolled through the shimmering ice-mirror just as Kaelen followed.
  The mirror solidified instantly behind them with a crystalline *snap*. The chronohounds
  slammed into solid ice, their frustrated screeches muffled. Geralt lay panting on
  the cavern floor. Kaelen stood over him, gazing at the sealed entrance. "Hands-on,"
  she stated, her voice devoid of triumph. "Now you understand why theory alone is
  fatal."
