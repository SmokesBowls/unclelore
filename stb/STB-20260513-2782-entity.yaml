raw_quote: Geralt turned and kept walking. The crunch of boots on gravel was louder
  than the shrieks behind him—not because the sounds weren't horrific, but because
  his numbness had become a tuning fork, resonating only with the path ahead. The
  lead horseman's gurgling protest died mid-syllable, replaced by a wet *thock*—the
  sound of a helmet hitting dirt after its contents had been evacuated through the
  eye sockets. He didn't need to look. He knew the rhythm of Mika's work by now.
