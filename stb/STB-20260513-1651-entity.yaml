raw_quote: The Stair swallowed them whole. Each downward step crushed Geralt’s shoulders
  tighter. Condensation wept from fused basalt walls, slick beneath scaled boots.
  Air thickened—metal-tanged humidity pressing like drowned lungs. No desert wind
  dared trespass here. Only the Spire’s ghost-light bled upward, painting jagged silhouettes
  that danced with each flicker. Legionnaire Corvin gasped behind Geralt. A choked
  sound. Then retching. Pressure sickness. The Luminaire’s buried song wasn’t heard—*felt*.
  It vibrated ribcages, warping inner ears. Equilibrium shattered. Shieldbearer Jax
  stumbled sideways, helmet amplifying the dissonance into a skull-drilling whine.
  Tinnitus screamed. Vertigo pulled. Below, the shaft breathed—a subsonic groan resonating
  through stone and bone alike. Geralt’s dragonmail flared azure, Zaron’s will anchoring
  him against the pull. *One step lower and your stomach drops—the resonance isn’t
  sound, it’s gravity bending.* He gripped Corvin’s pauldron, hauling him upright
  against the trembling wall. Sweat carved trails through grime on pale faces. Silence.
  Only the drip. And the hum.
