raw_quote: It began as a softening. The stone at the corridor's eastern end, where
  the passage met the old workshop district, had been cold for a year. The vrill channels
  that once ran through it had been severed during the siege and never restored. The
  occupation's instruments registered the stone as inert—zero resonance, zero thermal
  anomaly, zero reason to monitor. The instruments were correct. The stone was inert.
  And then it was not.
