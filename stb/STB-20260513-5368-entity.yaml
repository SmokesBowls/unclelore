raw_quote: '"Because it is not." Her voice was soft, carrying harmonics that Vale
  felt in his chest. "The giants shape stone. Sera guides vrill. You provide stability.
  But none of you can bind the pieces together. None of you can make the walls remember
  the channels, or the channels remember the terraces, or the terraces remember the
  people who walk them." She paused. "That is what we do. Not build. Not flow. Not
  stabilize. We remember the connections. We carry the resonance between things that
  should be one."'
