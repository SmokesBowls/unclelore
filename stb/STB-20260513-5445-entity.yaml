raw_quote: The air in the basin shifted. Not wind—something subtler. A quality of
  attention that had been diffuse, waiting, suddenly focused. The vrill in the channels
  beneath them pulsed once, twice, then synced with the resonance Miral had woven.
  The giants—Brak and Keth, standing at opposite sides of the circle—turned to look
  at each other. Not in surprise. In recognition. They could feel each other. Not
  physically. Not through null-pressure. Through the resonance. Through the point
  that now connected them.
