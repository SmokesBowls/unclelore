raw_quote: 'He did not become a leader. He did not become a weapon. He became something
  the city had not expected: a student. For years he sat with the Igigi, learning
  to read the currents that flowed through marsh and stone. He walked the walls with
  Granite, learning the rhythms of the war that had ended but not finished. He sang
  with the Nephoretti, his voice—vibration, not sound—finding harmonies that the old
  songs had not contained.'
