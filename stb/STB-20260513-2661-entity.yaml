raw_quote: The ground trembled—not from seismic activity, but from the network adjusting
  its parameters. Kulla's clay fingers worked faster, patching cracks that wept luminescent
  spores. "Going will hurt," the golem observed without looking up. Geralt didn't
  answer. He was already walking, each step compressing the distance between here
  and *east-that-was-north*, his boots leaving faint afterimages in the air. Behind
  him, Kyh's shadow stretched unnaturally long before snapping back into humanoid
  shape with a sound like tearing parchment. Some roads refused to be walked gently.
