raw_quote: 'Her fingers traced the cold stone, seeking purchase, seeking sanity. Memories
  surfaced unbidden: Geralt’s laugh, rough and warm; the fierce pride in his eyes
  when the Five stood beside him; the chilling emptiness after Xal''Zirith’s touch.
  The grief, sharp and fresh despite the universe’s forgetting, clawed at her throat.
  Was this the tower’s doing? Manipulating her fears? Or was she simply unraveling?
  She pressed her palm flat against the vibrating rock. *Find him. Just find him.*
  The mantra pulsed with her frantic heartbeat. She stumbled around another bend,
  blind to the passage’s unnatural symmetry, consumed by the desperate search within
  and without.'
