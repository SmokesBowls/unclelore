raw_quote: 'Luminara’s consciousness flared painfully. Geralt felt her fragmentation—**Earth
  Prime Resonance Keeper**, stretched thin across dimensions. Her whispers were static:
  *"Anchor points destabilizing... locus integrity failing..."* Her nature revealed:
  not a weapon, but a symphony. Harmonics clashed as Mika’s lance pierced a construct’s
  core. Instead of shattering, it *screamed*—a discordant note silencing her comms.
  "They’re siphon points!" Lyra yelled. "Disrupting her harmonics!" Halvar roared,
  cleaving through rusted plating. Chroniton decay slowed his blade. Torren covered
  him, shield sparking. Each strike fed the spire’s corruption. Geralt’s gauntlet
  pulsed. Zaron’s resonance surged—blue fire met violet decay. Feedback seared his
  nerves. He wasn’t fighting constructs. He was fighting Luminara’s corruption. Her
  agony was theirs.'
