raw_quote: Tran felt it as a heat in his chest that had nothing to do with physical
  exertion, a fire that seemed to respond to his emotions and intentions in ways he
  couldn't understand. When he gripped his farming tools, they felt different in his
  hands—more balanced, more alive, as if they were extensions of his will rather than
  mere implements. When he looked at the Star Needle on the horizon, he sometimes
  caught glimpses of patterns within patterns, geometric relationships that spoke
  to something deep in his mind even though he lacked the knowledge to interpret them.
