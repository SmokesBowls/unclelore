raw_quote: 'The rock struck Geralt’s alloy spine with a dull *clang*, bouncing off
  like a pebble tossed at a cathedral bell. He turned just in time to see Kyh’s shadow-filaments
  lash out—not in defense, but in precise, almost lazy motion. Two portals bloomed
  in the air: one swallowing the thicket where the projectile had originated, the
  other coughing up a spitting, scaled child no taller than Geralt’s knee. The boy
  hit the ground rolling, claws scrabbling at the loam before freezing mid-snarl at
  the sight of Geralt’s exposed cybernetic forearm.'
