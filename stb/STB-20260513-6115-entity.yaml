raw_quote: 'Ember stopped at the threshold. The Igigi boy stopped behind her. The
  old woman did not look up, but her soundless lips paused, and her palm lifted from
  the stone, and she turned it outward—not a greeting, not a signal, but an acknowledgment.
  The gesture meant: I feel the warmth you brought. It is the same warmth I have been
  feeling. You are not the source. You are only carrying it.'
