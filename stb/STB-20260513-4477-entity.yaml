raw_quote: He watched the Igigi's breathing. Shallow, but steady. He checked the pulse
  again—still there, still weak. He adjusted the robe once, twice, making sure the
  cold did not creep in. He did not sleep. He stayed awake, listening to the slow
  rhythm of the stranger's breath, feeling the cold settle around them. The stars
  came out. The water lapped against the shore, ordinary now, no longer coordinated.
  The shimmer did not return.
