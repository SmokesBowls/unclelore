raw_quote: The walls exhaled—a slow, deliberate contraction that pushed them outward
  like unwanted breath from cosmic lungs. One moment the Wise Ones' voice vibrated
  in Geralt's marrow; the next, the nebula spat them into the void with the indifference
  of a god flicking away gnats. Pyrocast's wings snapped open just in time to catch
  them, the sudden deceleration cracking Geralt's ribs against dragon scale. Behind
  them, the nebula's maw sealed shut, its luminous teeth knitting back into an unbroken
  sphere of swirling gas. No farewell. No clarification. Just the echo of their own
  futility ringing in the sudden silence.
