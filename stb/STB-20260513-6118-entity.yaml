raw_quote: The Igigi woman who had placed the first cache of dried tubers now stocked
  the house on the eastern terrace. She did not enter the city—she was still assigned
  to the grove's stores, still silent, still unremarked. But the caches were moving
  inward. The edge of the path was no longer the channel. It was the breach. It was
  the house. It was the corner where the old Igigi knelt and shaped the syllable that
  would not complete.
