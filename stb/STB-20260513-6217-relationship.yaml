raw_quote: The warmth was still there. The stone was still warm. The fragment in her
  chest—the full name, both halves, held silent for longer than anyone—was still quiet.
  But the quality of the network had changed. The transfer had been successful—the
  load had moved, the burden had redistributed, the system had learned to carry itself.
  But the carrying was not free. Every node that held part of the load was holding
  it continuously now, without the cyclic release of the old rhythm, without the pauses
  that had once allowed the system to reset.
