raw_quote: 'Silence. Utter, crushing silence. Geralt collapsed to his knees within
  the negation, gasping. The applicator sputtered, its casing spiderwebbed with cracks.
  Zaron’s warmth felt seared, diminished. But the scar still pulsed before him—weakened,
  but alive. Xal''Zirith’s stain. Rage, cold and absolute, replaced exhaustion. He
  pushed himself up. The scar wasn''t just a wound. It was the Harbinger’s fingerprint.
  Geralt didn''t raise his fists this time. He reached *into* the scar with both hands,
  fingers plunging into the anti-light. He didn''t seek to destroy it. He sought to
  *fill* it. Pouring his tripartite harmony—broken applicator, scorched armor, bleeding
  will—directly into the negation. He forced reality *into* the unmaking. Made the
  scar experience existence. Light. Sound. Sensation. Memory. The scar convulsed,
  thrashing like a speared eel as Geralt’s defiance flooded its emptiness. It wasn''t
  annihilation. It was forced incarnation. And under the unbearable weight of *being*,
  the conceptual stain shattered. Gone. Only exhaustion remained. And purpose. Beyond
  the fading scar, a new path glimmered—the way forward. Kaelen’s voice echoed, faint
  but clear: "The Nexus shifts. Move." Geralt staggered towards the light. The hunt
  continued.'
