raw_quote: 'The jungle pressed closer, its whispers threading through the shield-dome
  like poisoned needles. Halvar’s axe trembled—not from fatigue, but from the vine-murmur
  replaying his brother’s last rattling breath. He slammed the blade into the soil,
  anchoring himself in the vibration. "Weight," Geralt commanded. "Focus on gravity."
  Legionnaires echoed the mantra, gripping weapons until knuckles bled white. Ren’s
  eyelids fluttered as the corruption hissed: *Coward. Weak.* He bit his tongue, tasting
  copper, and whispered his daughter’s name instead. A small defiance.'
