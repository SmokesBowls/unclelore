raw_quote: Zaron waited in the silence for a few heartbeats, his spirit woven into
  the armor's core, until the Dregans' psychic imprint could no longer be felt resonating
  in the sand beneath Geralt’s feet. Only then did the ancient dragon acknowledge
  their actions with a surge of grim respect through the armor’s neural link. *"That
  silent hum,"* Zaron’s voice resonated within Geralt’s mind, sharp as obsidian shards,
  *"is not traditional Dregan behavior. They are predators by nature. They screech
  like sirens. The sound alone once shattered Giant's Rock into brittle glass that
  powdered in the wind. Silence… speaks of recognition. Or mourning."* The implication
  hung heavy. The Dregans, ancient denizens of the Scorch, perhaps sensed the shared
  burden Geralt had carried from the Heart. They offered passage, not attack.
