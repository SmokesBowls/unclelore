raw_quote: Vale left Zephyr on the terrace and walked back down through the settling
  city. The evening had drawn in quiet, the kind of quiet that didn’t feel empty but
  full—like breath held before a song begins. The terraces glowed with low vrill-lights,
  strung along the new channels, casting long shadows over stone that had been shaped
  by hands learning to ask instead of command.
