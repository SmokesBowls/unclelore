raw_quote: 'Above, the Legion advanced through suffocating green twilight. Private
  Ren froze beside a dripping fern. His hand trembled near his blade. "They’re slowing
  down for *me*," he muttered, eyes darting at Halvar’s broad back. A nearby vine
  throbbed softly. Ren’s whisper echoed back, colder: "They’ll leave you behind...
  just like on Mars." His knuckles whitened. He knew the source—the grafted vrill
  whispering through root-filaments—yet the dread felt *his*, marrow-deep and shameful.'
