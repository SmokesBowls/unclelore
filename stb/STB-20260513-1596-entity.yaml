raw_quote: The corridor fell utterly silent. Soldiers froze mid-motion, mouths agape.
  Oreck’s lenses snapped into focus. Dren dropped a water canteen, its clatter echoing
  strangely. Geralt stood framed in the archway, dust from the void swirling faintly
  around his boots, his dragon armor gleaming dully in the torchlight, eyes locked
  solely on Mika. Months of separation, of battles fought across fractured timelines,
  of feeling her absence like a phantom limb, vanished in the raw shock of reunion.
  Mika’s breath hitched. The fierce Commander dissolved, replaced by the woman who’d
  believed against oblivion. She took one faltering step forward, then another, breaking
  into a run. "GERALT!" She crashed into him, arms wrapping around his armored torso
  with bone-jarring force. He caught her instantly, crushing her against him, his
  face burying in her sweat-streaked hair, inhaling the scent of ozone, dust, and
  *her*. His arms trembled, holding her as if she were the only solid thing in a dissolving
  universe. It was fierce, desperate, wordless – a physical reclaiming after lifetimes
  spent adrift. Months of agonized separation dissolved in that fierce pressure, the
  sheer, undeniable *reality* of her warmth against him.
