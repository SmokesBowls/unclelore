raw_quote: The war was below him now. The Guardian stood at the needle's base, and
  the sky was burning, and the choice had not yet been made. Vale watched the figure
  — himself, before he was Vale, before he was Keeper, before the long dark — and
  saw the moment of decision frozen in the air like a held breath. The Guardian could
  walk away. The Guardian could stay. The Guardian could choose.
