raw_quote: Below the cosmic ballet, Geralt’s army stood exposed. Undisciplined. Unanchored.
  Violet corruption pulsed from the spire’s base—Luminara’s fracture weeping darkness.
  VALDRASIL phantoms skimmed low, targeting the Legion’s chroniton signatures. Mika’s
  lance flared uselessly against phased matter. "Shields! Rho formation—now!" Geralt
  roared. Too late. A VALDRASIL solidified overhead, crystalline jaws wide. Its bio-electric
  maw crackled—aimed at Halvar. Geralt lunged. Dragonfire met green lightning in a
  silent detonation. Legionnaires scattered. Shields buckled under stray entropy shrapnel.
  Two men crystallized mid-sprint—their terror frozen in obsidian glass. "They’re
  harvesting us!" Lyra gasped. "Feeding the spire’s decay!" Geralt’s symbiosis with
  Luminara faltered. Her light dimmed against Mars’ dissonance. Anchor points dissolved.
  The Dragon Nebula watched—T’Zurakai’s sapphire gaze tracking every branching doom.
