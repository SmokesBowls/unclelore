raw_quote: They crossed into a stretch of broken ground—flat stone split into long
  plates, edges uneven, gaps running between them like seams. Vale slowed. Not because
  he had to. Because he chose to. He stood at the edge of one of the seams. Waited.
  At first—nothing. Then a faint distortion along the seam. Not ahead. Not distant.
  Right where he was about to step. The air bent—just slightly. Like something was
  about to occupy that space.
