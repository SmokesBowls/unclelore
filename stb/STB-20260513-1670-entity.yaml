raw_quote: 'Lyra’s fingers flew over her Medicae Rig’s scorched panel. "Commander...
  the null state Sahvant theorized? Luminara—she didn’t retreat. She *split*. A fragment
  anchored in stasis..." Her eyes locked on Geralt’s dragonmail. "...the other became
  the storm." The implications hung thick. Luminara’s light judged because it was
  broken. Her harmony sought not a master, but harmony itself. Geralt’s breath caught.
  Zaren’s ghost-shadow whispered again: *Burn the roots. Ascend*. But Mika’s reflection—steadfast,
  unyielding—answered silently: *Anchor us*. The roots coiled tighter. Below Geralt’s
  boots, the lakebed trembled.'
