raw_quote: 'Above ground, the jungle convulsed. Pyramids shuddered. Vines recoiled
  as if scalded. Mika’s shield-wall buckled. Lyra screamed: "Nexus Node Gamma—critical
  failure! All local systems destabilizing!" Geralt felt it—a tremor through Luminara.
  Earth’s sigh. Halvar tore at sealed vines. Stone cracked. Legionnaires cheered.
  But Geralt watched the sky. Distant thunder. Not storm. Wings. Reptilian reinforcements—darker,
  faster. Luminara dimmed. *Roots... deeper...* Victory tasted bitter. Oreck crawled
  free—bleeding, silent. Halvar hauled him up. Mika met Geralt’s eyes. Hope flickered.
  Too small. Too late. The jungle waited. Breathing. Hungry.'
