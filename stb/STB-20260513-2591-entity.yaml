raw_quote: The storm peeled back like a torn curtain, revealing the nebula's heart—not
  the howling maelstrom they'd braved, but a vast, luminous hollow where starlight
  pooled like liquid gold. The walls shimmered with the same eerie brilliance as dragon
  scales catching sunlight, each facet shifting between metallic sheen and something
  deeper, older—an alloy of will and memory forged in celestial furnaces. Ahead, the
  formation resembled a titanic dragon's maw, its "teeth" arching taller than Pyrocast's
  wingspan, wrought from a substance that flexed between solid and plasma depending
  on where Geralt focused his gaze.
