raw_quote: Not the soft freeze of winter — the absolute freeze. The kind of freeze
  that turned water to stone, that made movement impossible, that trapped anything
  caught in the open. The Igigi, who had survived by moving, found themselves unable
  to move. The passes that had been their routes became walls. The channels that had
  been their paths became tombs.
