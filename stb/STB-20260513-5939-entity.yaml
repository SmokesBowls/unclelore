raw_quote: First Shore did not open its gates immediately. Trust was a scarred thing.
  But Sera — ancient now, her spine bent, her vrill-threaded hair gone white — walked
  out to meet them. She had been there when the cliff giants first surrounded the
  northern Nexus. She had felt the stone shift under their weight. And now she looked
  at their broken bodies and said, “They are not what they were. Neither are we.”
