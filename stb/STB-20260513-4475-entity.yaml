raw_quote: He pulled the body higher up the beach—past the high tide line, onto a
  patch of gravel and packed sand. He turned him onto his side, clearing the airway.
  Then he removed his own outer robe—a thick, woven thing, worn but warm—and draped
  it over the Igigi's body, tucking the edges under. The night was cold. Vale sat
  close, shoulder to shoulder, sharing what warmth his own body could give. He did
  not build a fire. He had no tools, no tricks. Only his presence and his endurance.
