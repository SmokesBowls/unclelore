raw_quote: It was another half-day's journey through the corpse of a forest—trees
  petrified mid-sway, their branches frozen in silent alarm. Kyh's shadow kept unraveling,
  filaments snagging on the fossilized bark. By the time Ironspire's obsidian gates
  loomed ahead, her left hand had dissolved entirely into static. Geralt didn't comment.
  They took the distant path, the one even the Queen's archivists had forgotten, where
  the brambles whispered old warnings in dead languages.
