raw_quote: It was not an attack. It was a condition. The Gruulith's presence pressed
  against the chamber's geometry, seeking the edges of what could be invalidated.
  The air thinned. The light flattened. The stone beneath the Gruulith's advance forgot
  itself—not breaking, not cracking, but becoming less. A perfect circle of absence
  began to spread from the threshold, erasing the dust, the tool marks, the faint
  residue of Igigi footsteps left during the quarantine. The chamber was being unmade
  by degrees.
