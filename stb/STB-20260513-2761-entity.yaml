raw_quote: Zypher nodded once, turning toward the alcove where the clone waited. Its
  eyes flickered open at his approach, pupils dilating to absorb his silhouette. "The
  decoy will require staging," he said. "A trail of breadcrumbs for her archivists
  to follow. Burn marks. Struggle." He reached out, pressing his thumb against the
  clone's forehead. A sigil flared there—not Geralt's name, but the Queen's own glyph
  for *verified*. "Let her think she's catching you."
