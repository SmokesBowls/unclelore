raw_quote: Mika stared at the Tower’s dark maw. Geralt wasn’t lost. He was trapped.
  Sacrificed. The Sage awaited. So did answers. And maybe, just maybe, a way back.
  She squared her shoulders, her voice cutting through the stunned silence. "Then
  we go *in*. We find him. We bring him home." She strode forward, the army surging
  behind her, their footsteps echoing into the shadowed throat of the Echo Tower.
  The air shimmered faintly, tasting of ozone and regret.
