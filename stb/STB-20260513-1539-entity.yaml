raw_quote: Dawn arrived not with gentle light, but the grinding sound of the Tower’s
  outer doors disengaging. The legion moved north, a grim procession winding through
  jagged ravines choked with crystalline debris. Geralt walked point, dragon armor
  a silhouette against the bruised sky, Zaron’s spirit humming low within the plates.
  Mika scanned the horizon, her posture tense. Behind them, Oreck moved like a shadow
  given form, his cleaver resting easily in his scaled grip, the green arrows pulsing
  softly, guiding the column’s flank. The air grew thick with ozone and the metallic
  tang of decay.
