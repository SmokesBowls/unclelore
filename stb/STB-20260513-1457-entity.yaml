raw_quote: The corridor inside was impossibly vast, walls curving upward into darkness.
  The air grew colder, thick with the scent of ancient stone and something metallic.
  Phantom whispers seemed to brush past their ears – fragments of conversations long
  silenced. Mika kept walking, her jaw tight. Oreck's words landed like stones. The
  Echo Tower. Zypher's folly. Not Geralt's destination. Just a desperate gamble. Yet,
  the Sage resided here. Knowledge resided here. She glanced back at the soldiers,
  their faces etched with the shared trauma of non-existence and Geralt's sacrifice.
  Their presence was his final act. "Hope isn't a weakness, Oreck," she stated, her
  voice echoing strangely in the cavernous hall. "It's fuel. We find the Sage. And
  hopefully some answers."
