raw_quote: In the days after the Keeper’s awakening, two Nephoretti who had stood
  closest to the broken line when the discordant pulse rolled across the marsh began
  to wake screaming in the dark. They spoke of shapes – not the swamp giants they
  had fought, but the figures from the Ma'at, the ones that had moved in slow procession
  and then vanished into the deep. The shapes did not attack. They simply stood at
  the edge of sleep, watching.
