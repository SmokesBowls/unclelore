  into soft earth. Shield energy flared silver, carving a fragile dome of clarity.
  Within it, the air tasted cleaner—pine and ozone instead of decay. Yet outside,
  the jungle pulsed, alive with malice. Distant Igigi whimpers twisted into accusations:
  "*You abandoned us.*"'
