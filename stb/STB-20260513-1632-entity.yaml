raw_quote: 'Oreck traced glyphs in the damp soil—ancient Martian warding sigils. His
  salvaged armor sputtered emerald light where it touched the symbols, pushing back
  the cognitive poison. "The corruption targets doubt," he rasped, sweat stinging
