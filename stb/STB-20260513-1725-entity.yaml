raw_quote: 'The jungle’s whispers thickened as twilight bled into deep violet gloom.
  Halvar’s knuckles whitened around his axe handle; every rustling leaf echoed with
  his brother’s dying gasps from Mars. "We stop *here*," Geralt commanded, slicing
  through the mental fog with Luminara’s flickering gold light. The clearing was a
  trap—vines coiled like sleeping serpents, obelisks humming with inverted resonance—but
  exhaustion outweighed caution. Legionnaires collapsed against petrified logs, eyes
  darting at shifting shadows. Ren’s hand trembled near his blade. "They’ll slit our
  throats while we sleep," he muttered. The vine above him sighed back: "*Sleep is
  surrender.*"'
