raw_quote: He had returned to the entrance during the dead hour—his leg had carried
  him there without his mind's permission, the warmth pulling him eastward through
  the old workshop district, past the chimney house, past the shadow line, to the
  dark gap where the Igigi had cleared the debris and the weaver had left the cloth
  and the tuber rind still lay on the warm stone. He did not know why he had come.
  He only knew the cold in his leg was worse tonight, and the warmth in the corridor
  was the only thing that eased it.
