raw_quote: The Tower’s entrance yawned before them – a jagged tear in seamless obsidian.
  Mika halted the column. "Hold!" Her command echoed strangely. She scanned the warriors,
  their faces shifting between confusion and dawning horror. They remembered dying.
  They remembered *not* existing. And now… they remembered Geralt’s agonised face
  as he hurled himself into the temporal storm *for them*. One soldier, face pale
  beneath desert grime, stepped forward. "Commander Mika? Sir… Geralt… he *pushed*
  us out. At the end. We felt it. Like… like being shoved through a closing door."
  His voice cracked. "He stayed behind. Holding it open."
