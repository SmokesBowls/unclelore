raw_quote: The Dragon Mail no longer whispered in his bones. The Applicator didn't
  scream warnings through his nerves. But the weight remained—the anchor's burden,
  settling deeper than fused alloy or scar tissue. Geralt turned first to Kyh, whose
  shadow-filaments still coiled around his wrist like a lifeline he wouldn't need.
  "You'll hold the network," he said, not a request. Her darkness pulsed once in acknowledgment,
  silver threads flaring where the Guild's harmonics had claimed her.
