raw_quote: The Shadow had swallowed the sky. Noon was indistinguishable from dusk.
  Light did not fall; it pooled, thick and amber, catching on dust and damp stone.
  Visibility shrank to the space between breaths. Fighters relied on vibration, on
  the grind of carved armor against channel-ribs, on the low hum of Nephoretti binding
  tones cutting through the dark. The war was no longer seen. It was felt. Measured
  in shifts of weight. In the sudden absence of a footfall. In the way the stone flinched
  before the next strike.
