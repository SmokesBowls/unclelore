raw_quote: And in the modest stone cottage that served as the village's unofficial
  center of governance, Garric Stoneheart—elder, mediator, and keeper of the community's
  collective memory—sat at his simple wooden desk reviewing the ledgers that tracked
  Sundrift's prosperity. At sixty-two, he had guided the village through good years
  and lean ones, through conflicts with neighboring communities and the occasional
  crisis that tested their resolve. His weathered face bore the lines of a man who
  had shouldered responsibility for others most of his adult life, and his steady
  gray eyes held the wisdom that came from decades of careful observation and judicious
  decision-making.
