raw_quote: Three grove giants and a swamp giant moved a slab of bedrock down toward
  the dock. They didn’t lift. They pushed. Null-pressure flared from their palms,
  a blunt wave that shoved the stone forward. It scraped, caught, scraped again. The
  edges ground against the slope, sending up a shower of grit and a sharp, discordant
  vibration that made Vale’s teeth ache. The giants adjusted their stance, pushed
  harder. The slab tilted. A hairline crack split diagonally across its surface. They
  stopped. Exchanged looks. Shifted their null again. Tried to force it straight.
