raw_quote: The first to arrive were the ones who had been closest – a group from the
  eastern hills, led by a Nephoretti named Darian who had survived the winter in a
  cave system, living on nothing but frozen roots and the faint vrill that seeped
  from the stone. They had heard the pulse through the long nights, had followed it
  through the thaw, and when Sera’s song had called, they had been close enough to
  answer within days.
