raw_quote: It stepped into view. Humanoid—but wrong in its proportions. Shorter than
  a true giant, broader through the shoulders, its surface uneven—like stone that
  hadn't settled properly. The air around it shimmered faintly, not with heat—with
  something else. A distortion that made Vale's eyes want to slide away. It didn't
  charge. It watched. Then it moved. Fast.
