raw_quote: The weaver stepped inside. The Igigi stepped aside. They stood in the darkness
  together, their shoulders nearly touching, their breath slowing to match the subsonic
  hum that traveled through the stone. The corridor was narrow. It had been built
  for single file passage, for the Needle's attendants to move quickly between the
  inner workshops and the chamber. Two bodies filled it. Two bodies warmed it. The
  warmth deepened by a fraction, and then another fraction, and the stone adjusted
  its frequency to match the doubled presence.
