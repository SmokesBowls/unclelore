raw_quote: 'Halvar crouched beside a petrified log, nostrils flaring. "Igigi sweat.
  Fear-scent. Fresh." Mika’s lance tip trembled—not from exhaustion, but rage. Below,
  through cracked basalt, faint crimson light illuminated cages stacked like cordwood.
  Igigi prisoners huddled inside, their vrill-dampening collars flickering. Reptilian
  guards patrolled above, claws clicking on stone fused with crystalline cabling.
  Lyra’s scanner hissed. "Nexus resonance spike imminent. Reinforcements inbound."
  Geralt’s command was a blade-honed whisper: "Oreck. Disrupt it." The air thickened.
  Vines tensed like coiled serpents. Sentinel trees shifted, bark splitting to reveal
  gunmetal apertures. The jungle watched.'
