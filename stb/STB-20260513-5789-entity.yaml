raw_quote: The stone held. The vrill threaded through it—not forced, but invited.
  The shape became consistent. A circle of dark stone, veined with ancient mineral,
  anchored in the shelf where the earth had accepted it. The resonance of the labyrinth,
  which had been contained within its walls for seven thousand years, reached outward.
  Not far. Not dramatically. Just... out. Toward the ring. Toward the point. Toward
  the place that had been made to hold it.
