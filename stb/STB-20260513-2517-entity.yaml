raw_quote: The chamber moved. Not a quake, but a deliberate, horrific reconfiguration.
  The floor beneath Kyh’s feet became transparent, then vanished, re-forming as a
  wall ten feet to his left. Gravity, a polite suggestion seconds before, became a
