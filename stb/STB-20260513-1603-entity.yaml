raw_quote: The assault lasted seconds. Immediate threats vanished. Annihilated. The
  crimson warrior turned. His eyes—Geralt’s own eyes—locked onto Geralt’s. Recognition
  deeper than blood. A silent nod. Acknowledgement. Warning. Then—a bronze dragon
  descended like fury incarnate. They leapt onto its back—four impossible saviors—vanishing
  into the cosmic storm above. Gone. Leaving only the echo of thunder and the scent
  of ozone deep within Geralt’s soul. Questions burned hotter than dragonfire. Ancestors?
  Heirs? Or something far stranger? The Dragon Nebula watched. Judgment paused. Curiosity
  sparked.
