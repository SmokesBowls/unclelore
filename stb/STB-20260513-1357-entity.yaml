raw_quote: 'They pressed the attack. Geralt targeted stolen moments – a lion’s roar
  silenced mid-roar, a raindrop falling properly. Each restoration weakened the predator.
  Its vortex eye dimmed. It shrieked in fury, diving straight for the locus fracture.
  "It seeks escape!" Kaelen cried. "Seal the fracture *as* it enters! Trap it in the
  paradox it created!" Geralt saw the sequence: predator enters, fracture seals. But
  sealing required immense power focused precisely at the moment of transition. He
  sprinted towards the fracture, feeling its chaotic pull threaten to unravel him.
  The predator was a blur of bone and stolen light ahead. Geralt reached the fracture''s
  edge. He poured everything – applicator precision, armor power, his desperate will
  – into a single command: *Anchor. Seal. NOW.* He slammed his hands onto the fracture''s
  shimmering edge as the predator crossed the threshold. Reality screamed. The fracture
  snapped shut like a closing jaw, severing the predator’s trailing leg-bone. A final,
  agonized screech echoed from nowhere, then silence. The chamber stabilized. Only
  the frozen cubs remained, silent witnesses. Geralt collapsed to his knees, gasping.
  The locus fracture was sealed. The paradox predator was gone. Trapped forever in
  the discontinuity it craved.'
