raw_quote: He spent the early hours of the night experimenting with his abilities.
  He learned that the crimson flames could be summoned, but controlling them was delicate
  work. Too little focus and the power sputtered; too much intent and it threatened
  to blaze uncontrollably. It was less like wielding a tool and more like learning
  the temperament of a wild animal that lived within his own veins. Gradually, through
  trial and error, he began to sense a rhythm to it, an ebb and flow that mirrored
  his own heartbeat. The fire was not separate from him; it was him. Learning to use
  it felt less like imposing his will and more like finding harmony with a fundamental
  part of his being.
