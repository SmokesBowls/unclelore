raw_quote: The order was transmitted. The patrol routes were scrambled. The careful
  rhythm that the handlers had walked for months—the timing that had drifted, that
  had paused, that had learned the warmth without knowing it—was broken by design.
  Keth-var found himself walking a different sector at a different time, his body
  disoriented, his rhythm severed. The Igigi's humming faltered as the patrol passed
  at an unexpected interval. The older singer's vigil was interrupted by a dregan's
  scream that came twelve minutes early.
