raw_quote: Kyh looked at his hands, still faintly trailing shadow-smoke. He looked
  back the way they'd come, toward the war he was leaving. "I walked the Spire's paths
  for months without knowing what they were. I used them to save a handful. Today,
  I used them to save a world." He met Geralt's gaze, his twilight eyes finding a
  hard resolve. "Now I know what they are. And I know what they're for. Yes. I'm with
  you."
