raw_quote: 'Wisdom came not from dragons, but desperation. Geralt tore a chroniton
  arrow from Oreck’s quiver—its green glow stark against Zaron’s blue. He plunged
  it into the root-mass. Light exploded. Not azure or emerald, but pure, blinding
  white. The roots shattered. The Luminaire flared—not predatory, but *awakening*.
  For an instant, Geralt saw her: Luminara, fractured yet radiant, a being of crystallized
  harmonics reaching through the void. Then agony. The spire’s full resonance hammered
  him. Dragon scales cracked. Flesh burned. Zaron roared—a sound of triumph and dissolution.
  The walls dissolved into starlight. The cavern vanished. Above the dunes, Earth’s
  Spire flared gold, announcing their presence to the cosmos.'
