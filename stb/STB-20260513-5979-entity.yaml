raw_quote: The chamber holds its silence around him—not the dead silence of the occupation's
  suppression, but the suspended quiet of a breath that has found its rhythm. His
  palm rests flat against the stone floor. The vrill beneath it runs thin, thready,
  a current starved for two centuries. The void anchor in his chest sits heavy, stable,
  a counterweight that no longer tears.
