raw_quote: The grove canopy is a layered world now. The lower branches hold the Nephoretti—old
  singers, young students, the voiceless and the nearly voiceless. The middle branches
  hold the Igigi, those who escaped the occupation, who chose the uncertain marsh
  over the certain slave camps. The upper branches are for watching, for silence,
  for the few who still let themselves hope.
