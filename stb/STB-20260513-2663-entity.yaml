raw_quote: Falconridge was worse. The shack's roof had caved in under the weight of
  a fallen oak branch, its splintered wood gray with rot. Geralt knelt by the tombstone,
  brushing away moss with fingers that remembered the exact curve of Mika's hip beneath
  wool blankets. He laid a fistful of wild indigo—plucked from Sundrift's overgrown
  verges—against the granite. The petals trembled in a breeze that didn't touch the
  grass.
