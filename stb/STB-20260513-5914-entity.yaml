raw_quote: 'It lived in the slow cooling of the noon sun, in the way vrill currents
  dragged like thick oil through the channels, in the thinning of the high canopy
  leaves that no longer held their iridescent glow. It crept inward from the polar
  fractures, a slow tide measurable now in the slates kept by Enlil’s descendants:
  resonance decay at 0.4% per decade. Not catastrophic. Not yet. But inevitable. The
  town felt it in their joints, in the way their breath caught before dusk, in the
  quiet way they looked at the sky and calculated how many seasons remained. The Igigi
  tracked it in harmonic decay rates. The Nephoretti felt it in the thinning of their
  baseline tones. The giants sensed it in the way the stone’s memory grew heavier,
  slower, harder to wake.'
