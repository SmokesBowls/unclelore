raw_quote: The first swamp giant crossed the ancient road before the warning could
  be shouted. It was one of the big ones, its hide mottled green‑black, its arms longer
  than a Nephoretti dwelling. It moved with a purpose that had been building since
  before the landing, and behind it came others – dozens of them, their feet shaking
  the ground, their eyes fixed on the needle.
