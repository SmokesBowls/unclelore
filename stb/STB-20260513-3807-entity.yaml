raw_quote: Kronocht Elder led the Stone Giants' contingent, and the very ground of
  Mars trembled at their approach. These were beings who had slumbered in Earth's
  depths for millennia, and their awakening for war was terrible to behold. Some carried
  weapons carved from mountains, others simply relied on fists that could shatter
  continental plates. Behind them marched Kronocht the Younger—the Titanborn who had
  joined Tran's quest—his relative youth (a mere few centuries) making him swift and
  adaptable where his elders were ponderous and certain.
