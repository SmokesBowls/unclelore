raw_quote: Geralt plunged his clawed hand into the pool. Not toward the core. Into
  the root-mass choking it. Zaron’s will surged—not domination, but *alignment*. Azure
  light flared from his gauntlet, weaving through the metal vines. The roots stiffened.
  The Luminaire’s pulse stuttered. For a heartbeat, the storm stilled. Reflections
  cleared—Mika’s fierce determination, Oreck’s unwavering vigilance, Lyra’s exhausted
  resolve. Real. Uncorrupted. Then the roots *shrieked*, recoiling. The pool churned
  black as the Luminaire’s light dimmed to ember-red. Something deeper than roots
  stirred in the depths. Revelation’s price waited in the dark.
