raw_quote: The one who had collapsed—designation Igigi-Seven, though the Igigi had
  not used designations among themselves for centuries—sat against the pen wall and
  did not move. His eyes were open. His breathing was steady. He did not respond to
  the food left at the grating. He did not respond to the handlers' queries. He did
  not respond to the dregans' screams when they passed. He was present and absent
  in equal measure, and neither the present nor the absent could be measured by the
  instruments that monitored him.
