raw_quote: He reached the corridor entrance without knowing it was an entrance. The
  young Igigi female had cleared the debris—not enough to be noticed, just enough
  to slip through. The opening was dark. The stone around it was warm. The mason stopped.
  His hands, which had been idle for eleven months, reached out and pressed against
  the stone on either side of the gap.
