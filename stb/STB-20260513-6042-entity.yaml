raw_quote: No one told them to. The first had not spoken of the warmth. He had returned
  to the grove and gone about his work—lifting the floating planters for the Nephoretti
  harvest, bracing the root columns where the silt was shifting, standing watch at
  the western perimeter. But his new circuit left traces. The silt was disturbed in
  a new pattern. The water was warmer along the path he had taken. The stone ribs,
  pressed by his weight, hummed faintly at a frequency the Nephoretti could feel through
  the soles of their feet.
