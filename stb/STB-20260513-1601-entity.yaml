raw_quote: Then—the void answered. Space rippled again. Not dragons. Not VALDRASIL.
  A serpentine shadow—longer than Vaelros’ wingspan—coiled into existence. **Void-wyrm**.
  Starlit scars marred its anti-light scales. It heard resonance—the spire’s corruption,
  Geralt’s key, VALDRASIL’s discord. Instinctual. Hungry. It descended toward the
  fracture. Armies froze. Dragons banked away. VALDRASIL phased erratically. Dread
  washed cold through Geralt’s veins. Survival demanded silence. But Luminara’s agony
  sang too loud.
