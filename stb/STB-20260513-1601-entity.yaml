raw_quote: The descent into the Tower's core was a plunge into ancient resonance.
  The air thickened with ozone and the low thrum of containment fields, the walls
  shifting from rough-hewn stone to seamless obsidian veined with pulsing chroniton
  blue. Geralt moved with purpose, Mika a step behind, the dragon armor casting long,
  defiant shadows against the humming walls. Around a spiraling bend, torchlight flared
  ahead, illuminating a figure hunched over a glowing control plinth. Wild grey hair
  stuck out in tufts, and mismatched robes draped a frame humming with barely contained
  power. Zypher. He didn't turn, fingers dancing over intricate glyphs projected into
  the air. "Ah, Commander! Right on cue," he chirped, his voice echoing oddly in the
  confined space. "Your storm-chasing stirred quite the harmonic soup upstairs! Excellent
  destabilization! Very messy." His eyes, sharp and impossibly old beneath bushy brows,
  flickered towards Mika. "Lieutenant. Fine anchoring work. Saved me considerable
  recalibration effort with these stubborn souls." He jabbed a thumb over his shoulder.
