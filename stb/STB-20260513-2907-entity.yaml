raw_quote: 'My companions are now the data streams. The steady, mindless fusion cycles.
  The flash every 47 pulses. The slow, gravitational dance of planets. I narrate events
  to myself, my voice a dry rustle in the vault of my own skull. I develop a madness
  of perspective: a genocide is a slight dimming of biological signatures; the birth
  of a god-child is a minor energy fluctuation. I have to fight to remember that Tran’s
  laugh, Kyh’s grief, a hero’s sacrifice, Mikas love, are the only things that ever
  truly mattered. They are the impossible, delicate miracles. The rest is just… physics.'
