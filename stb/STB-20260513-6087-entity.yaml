raw_quote: In the grove, the Nephoretti were singing the evening vigil when the older
  singer—Mora's last student, her voice worn thin—felt a catch in her throat. Not
  a word. A fragment. A broken syllable that did not belong to her but passed through
  her anyway. She did not speak it. The song was too important. The binding tones
  held. The shield held. But the syllable sat in her larynx like a stone in a channel,
  and she knew, without knowing how she knew, that something had tried to speak and
  almost succeeded.
