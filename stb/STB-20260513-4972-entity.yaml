raw_quote: Sera nodded. "We've always known. The Nephoretti. We feel it in the songs.
  The vrill doesn't flow the way it should. It pools in some places, runs thin in
  others. The channels are... confused. They don't remember what they were." She looked
  at the water, grey-gold in the evening light. "The flood changed everything. The
  freeze changed everything. The war changed everything. The stone has been trying
  to adapt for seven thousand years, and it's exhausted."
