raw_quote: The second Igigi takes a single step forward. Then another. She does not
  kneel. She stops at the edge of the warm circle, her hands at her sides, and she
  feels something she cannot name. A thread. A remembered pattern. The ghost of something
  Zephyr left in the stone six thousand years ago, before the Igigi were broken, before
  the Gruulith learned to hunt, before the ship ever shadowed the mountains.
