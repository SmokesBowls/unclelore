raw_quote: The Igigi worked alongside the Nephoretti and the grove giants, their long
  fingers counting, measuring, calculating. They did not sing. They did not laugh.
  They did not do anything that was not necessary. But they were there, and they were
  helping, and slowly, grudgingly, the city began to accept them.
