raw_quote: She was old. Older than the female who had spoken the first syllable in
  the eastern channel. Older than the male who had spoken the second in the south.
  Her robes were the same patched robes all the enslaved Igigi wore, but they hung
  on her frame like something that had been worn for centuries, washed and mended
  and washed again until the original thread was only memory. She was kneeling in
  the corner where the chimney met the wall, her palm pressed flat against the stone,
  her lips moving soundlessly.
