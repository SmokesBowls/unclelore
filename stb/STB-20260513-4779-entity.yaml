raw_quote: Vale looked at the city, at the needle, at the people who had sung to him
  for six thousand years while he slept in the stone. He thought of the day he had
  woken—the light, the voices, the weight of something that had been waiting for him
  to open his eyes. He had not understood then what home meant. He was not sure he
  understood now.
