raw_quote: 'The lower room was lit by a single vrill-glass shard, dim and flickering,
  salvaged from the old canopy before the occupation purged it. The family was five:
  the woman, an older man whose leg was twisted and useless, two younger women of
  fighting age who should have been in the labor camps but were hidden here, and a
  child. The child was perhaps six. She had been born after the fall. She had never
  seen the sun. She looked at Ember with eyes that were not hollow at all.'
