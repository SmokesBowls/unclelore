raw_quote: It was dark. The gap was narrow—just wide enough, the debris cleared just
  enough. The stone around it was warm. She did not know that an Igigi had cleared
  this entrance. She did not know that the mason had stood here five days ago, his
  forehead pressed to the same stone, his twisted leg trembling. She knew nothing
  except that the passage was warm and her hands were cold and the warmth was not
  asking her to enter. It was only asking her to arrive.
