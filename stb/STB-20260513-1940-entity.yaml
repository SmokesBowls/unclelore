raw_quote: Geralt found a spot apart, his back against cool stone. He closed his eyes,
  and the silence within was worse. But it was a different silence. Before, the bond
  with Luminaire had been a constant, low hum of presence, like standing near a powered
  spire. Now, it felt thin. Not absent, but stretched. And beneath the fatigue, he
  sensed a new, unsettling precision to her diminishing state. It felt less like a
  slow bleed, and more like a controlled dissection.
