raw_quote: Crystal rain came first—needle-thin shards of frozen oxygen that screamed
  as they fell. Geralt ducked as one grazed his temple, leaving a streak of frostburn
  where it kissed skin. The shards weren't just ice; they were memories. Each carried
  echoes of dead stars, and where they struck Pyrocast's wings, the crimson dragon
  hissed as decades of his own past unwound in jagged flashes. Kyh's shadow-form flickered
  wildly beside them, her edges dissolving under the assault. "Don't *listen* to them!"
  she gasped, forcing herself back into coherence.
