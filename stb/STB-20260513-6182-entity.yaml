raw_quote: She did not fight it. The Igigi had learned not to fight. But she felt
  the second syllable press against the back of her throat, and she did not speak
  it, and the unspeaking took effort now. The effort was new. Before, the fragment
  had been a weight she carried. Now it was a force she held back, and the holding
  was becoming difficult, and the difficulty was a sign that the name was almost ready.
