raw_quote: She found herself on the eastern edge of the canopy, where the branches
  thinned and the marsh opened into the old drowned channels. She did not remember
  crossing the distance. She remembered her hands moving. She remembered the Nephoretti
  humming their binding tones a half-step flat. She remembered the Igigi boy watching
  her from the middle branches, and she remembered turning away from him, and then
  she was here.
