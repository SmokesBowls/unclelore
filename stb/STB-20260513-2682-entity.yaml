raw_quote: At dusk on the third day, the sand began singing. Not melodies—arithmetic.
  Each grain vibrated with perfect harmonic alignment, their collective hum rising
  to a pitch that made Kulla's new shells chime in sympathetic resonance. Geralt knelt,
  letting the frequencies wash over him like a baptism in static. This wasn't natural.
  This was the Queen's work—a sonic sieve filtering reality for impurities. He exhaled
  through his teeth, watching his breath crystallize mid-air into a fleeting glyph
  before shattering. Above them, Tidecaller's peak pulsed once, its glacial cap bleeding
  indigo shadows down the ravines like veins opening. Somewhere beyond those ridges,
  Zypher waited. And so, Geralt realized with grim certainty, did whatever the mountain
  had been built to contain.
