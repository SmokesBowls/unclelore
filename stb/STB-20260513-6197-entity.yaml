raw_quote: She had been experimenting for days—not consciously, not with the precision
  of the Igigi's half-second delay, but with the slow, intuitive calibration of a
  body that had been singing the binding tones for seventy years. The lightning disrupted
  the shield when it struck mid-note. The shield held better when the tones peaked
  before the pulse, leaving a brief silence for the flash to pass through. She had
  learned this through trial and error, through the wobble of the shield and the catch
  in her throat and the way the dregans' distant screams seemed sharper when the timing
  was wrong.
