raw_quote: 'The corridor abruptly ended at a circular chamber. Utterly bare. Utterly
  silent. No Sage. No artifacts. Only a single, immense mirror dominating the far
  wall. Its surface was liquid obsidian, swirling with impossible depth. Mika approached
  cautiously. Her reflection didn''t appear. Instead, the mirror revealed a desolate
  courtyard under a bruised sky. Five arched doorways stood open around its perimeter,
  dark mouths leading deeper into shadow. Standing calmly in the courtyard’s center,
  gazing directly *through* the mirror at Mika, was Zypher. His expression was unreadable,
  a flicker of something like weary resignation in his eyes. He wasn''t trapped; he
  was waiting. He gestured slowly towards the five open chambers. Mika knew without
  seeing: Geralt''s five loyal followers lay within. This was the Echo''s heart –
  a gateway, not a destination.'
