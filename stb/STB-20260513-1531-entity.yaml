raw_quote: Geralt retreated to a cleared alcove, the dragon armor releasing its seals
  with a resonant sigh. Exhaustion settled deep into his bones – temporal exertion,
  psychic strain, the sheer weight of resurrection. He leaned his head against the
  cool obsidian wall. Beside him, Mika sat, her shoulder touching his, radiating silent
  solidarity. Oreck stood motionless nearby like a statue forged from shadow and vigilance,
  the faint green arrows on his greaves pointing outward, guarding the approach. The
  Tower hummed around them, a cradle against the gathering storm. Geralt closed his
  eyes, not seeking oblivion, but conserving every shred of strength. Dawn would bring
  the true hunt.
