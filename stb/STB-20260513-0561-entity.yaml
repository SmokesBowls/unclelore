raw_quote: The Anunnaki did not speak to their creations. To do so would be to acknowledge
  them as beings capable of receiving communication, capable of response, capable
  of anything beyond the function for which they'd been designed. Instead, the makers
  spoke among themselves in resonant tones that rippled through the chamber like physical
  force—not sound alone, but vibration that pressed against bone and tissue and the
  nascent consciousness struggling to orient itself.
