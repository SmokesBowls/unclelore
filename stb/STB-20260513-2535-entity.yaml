raw_quote: It was not a clean, technological facility. It was a graft. Organic, Anunnaki-grown
  support structures—like metallic coral—crawled over the surface of the largest asteroid,
  which pulsed with a sick, violet light. This was the Amygdala Analogue. And crawling
  across the void between it and other fragments were lines of living light. Gravity
  tethers. And along those tethers, like ants on a string, were figures. Slaves. Hundreds
  of them, minds broken by neural spikes, their collective telekinetic will being
  harvested to literally drag the god-fragments closer.
