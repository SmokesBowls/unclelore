raw_quote: A glint caught her eye near the base of the nearest ridge – not metal,
  but something darker, wetter. She scrambled down the scree slope, stones skittering
  beneath her. Half-buried in rust-colored sand lay a scrap of heavy, dark fabric,
  stiff with dried blood. Geralt’s cloak. Her breath hitched.  He’d been here. Alive?
  Captive? She gripped the bloody cloth, its texture rough and familiar against her
  palm, a tangible anchor in the disorienting void. The low hum intensified, thrumming
  through her bones. Whatever lay beyond that ridge held answers. And Geralt. She
  followed the blood tracks, the desert sun glaring down on her solitary defiance.
