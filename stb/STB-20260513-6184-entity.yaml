raw_quote: In the chimney house, the old Igigi woman felt the second syllable press
  against her throat with enough force to stop her breath. She did not speak it. She
  had never spoken it. But the holding was effort now, and the effort was visible
  in the tremor of her jaw, in the way her palm pressed harder against the chimney
  stone, in the way her breath caught and released in a rhythm that was not her own.
