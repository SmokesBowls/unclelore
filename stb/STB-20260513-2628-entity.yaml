raw_quote: Geralt reached into the scorched ruin of his Applicator and withdrew a
  single glyph—not words, but the shape of a wound. The guild's oculus darkened as
  he pressed it against the nearest archive wall. The stone didn't just accept it;
  the masonry *remembered* the mark, grooves aligning like old friends reuniting.
  "You're already part of Earth's bones," he said. "You just forgot how to bend."
