raw_quote: Geralt clung to the dragon’s spines, his body numb from the Wise Ones’
  dismissal. The obstacles were behind them, yes, but so was the hope of an answer.
  The Dragon Mail’s enchantments flickered weakly against his skin, its borrowed divinity
  fraying at the edges like a banner left too long in the wind. Kyh’s shadow-form
  hovered close, her edges still flickering with stolen photons, while Oreck’s growl
  reverberated through the vacuum, a soundless snarl of frustration. Kulla, ever pragmatic,
  had already begun patching his cracks with regolith scraped from Pyrocast’s scales.
