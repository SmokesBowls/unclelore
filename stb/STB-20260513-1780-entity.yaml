raw_quote: Landing was impact. Bone-jarring. Sand replaced by rusted regolith. The
  Mars spire stabbed the horizon—cracked, weeping violet corruption. Geralt rose.
  Five hundred stood. Behind them, the silver gateway collapsed. Ahead, shambling
  forms emerged from dust-devils. Not soldiers. Twisted spire-constructs. Half-metal,
  half-flesh. Luminara’s light pulsed in Geralt’s palm. Warmth against Martian cold.
  "She’s weak here," Lyra warned, scanner glitching. "Corruption resonance overwhelming."
  Oreck nocked an arrow. "Then we purify." Geralt drew his sword. Dragonfire ignited
  the blade. "For Earth. For anchors." The constructs charged. Silence fell. Only
  the spire’s broken heartbeat throbbed. Hungry.
