raw_quote: The survivors of Sundrift had worked through the night with the desperate
  efficiency of people who understood that their lives depended on turning a ceremonial
  ground into a defensible position. Ancient stone formations that had once provided
  natural amphitheaters for community celebrations now served as barriers and fighting
  positions. Caves that had sheltered picnic supplies and festival decorations were
  hastily converted into refuges for the wounded and the most vulnerable members of
  their community.
