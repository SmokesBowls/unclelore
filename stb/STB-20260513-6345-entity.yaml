raw_quote: She did not know when that would be. The Igigi did not ask questions. But
  she felt the center's frequency strengthening in the stone beneath her, and she
  felt the fragments resting in their separate bodies without strain, and she understood
  that the network had entered a new phase. Not completion. Not resolution. But readiness—a
  sustained, stable capacity to hold what it had never been able to hold before. The
  name would come when it came. The network was no longer trying to summon it. The
  network was simply waiting, and the waiting was no longer a struggle but a state,
  and the state was sustainable.
