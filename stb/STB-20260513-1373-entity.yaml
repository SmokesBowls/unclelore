raw_quote: The third drake, smarter, circled wide, trying to flank Geralt. The applicator
  mapped its path. The armor sensed its predatory focus. Geralt felt the chroniton
  anchor point *within himself*—his own position, amplified by the Needle. He couldn't
  move it, but he could... *harden* it. He visualized his presence as a fixed point,
  radiating temporal stability outward. As the drake lunged, jaws snapping for his
  flank, it hit the reinforced field. Its teeth grated on nothing tangible, its charge
  halted mid-air as if hitting solid stone. Geralt spun, drawing the short blade fused
  to his dragon-scale vambrace. The blade, humming with the armor's spirit, plunged
  deep into the drake's exposed throat. Hot, acrid blood sprayed.
