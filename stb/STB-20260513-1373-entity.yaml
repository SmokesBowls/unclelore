raw_quote: 'He stumbled back onto the rain-locked street shard. The vortex behind
  him collapsed with a final, muted sigh. Relief warred with hollow dread. They were
  out. The 250 were flung free. But where? Scattered across millennia, adrift in forgotten
  eras. Saved, yet utterly lost. The applicator, fractured and sparking, offered no
  answers. *Probability vectors indeterminate.* Mika’s face flashed—not in triumph,
  but in desperate confusion. *Did I fail them twice?* The cost screamed through him:
  cracked ribs, scorched spirit, the applicator dying in his grasp. Victory tasted
  like ashes. Kaelen materialized beside him, her expression unreadable. "They are
  beyond Xal''Zirith’s grasp," she stated, her voice flat. "Beyond immediate retrieval.
  The scattering was… necessary." Geralt stared at his trembling, bleeding hands.
  "Necessary?" The word felt thick, alien. "They''re lost in time."'
