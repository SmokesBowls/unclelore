raw_quote: She found the entrance on the third day of her reassignment. She was hauling
  broken tile from a collapsed workshop when her foot struck a stone that was warmer
  than it should be. She stopped. The handlers were not watching—they never watched
  the debris detail, which was considered the lowest form of labor, assigned only
  to broken Igigi who had outlived their usefulness. She knelt. She pressed her palm
  to the stone. The warmth was faint, barely a degree above the ambient cold, but
  it was there, and it was the same warmth she had felt in the channel silt when the
  fragment passed through her. The same warmth she had felt in the quarantine pen
  when the dampeners cycled and the humming resumed. The same warmth that was spreading,
  somewhere, from a center she could not name.
