raw_quote: The colossal alien world hung immovable in the sky, its bruised hues and
  jagged silhouette a permanent scar across the heavens, devouring the sun. This wasn't
  a world merely draped in shadow; it was a world condemned to an eternal, alien twilight.
  Below, the valley lay smothered, painted now only in the Star Needle's eerie pulse
  and the dying embers of Sundrift. The fire in Tran's blood felt like a defiant,
  solitary sun within him. Keen's perception of the deep connections binding all things
  became a fragile web of light in a universe suddenly vast and hostile.
