raw_quote: She stood. She looked at the Igigi boy. He was watching the inner gate,
  his hollow eyes tracking the patrol patterns, his jaw unclenched. He did not point.
  He did not need to. She followed his gaze and saw the second house—a larger structure,
  two stories, its upper floor collapsed but its lower intact. It stood at the edge
  of the inner terrace, just beyond the shadow line. It was occupied. Not by an old
  woman. By a family of human slaves, three generations packed into the lower room,
  their hollow eyes no less hollow than the Igigi's.
