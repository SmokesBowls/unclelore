raw_quote: The dunes breathed. Not in the way poets described—no romantic sigh of
  wind over sand—but in slow, tectonic heaves that made the horizon itself seem to
  ripple like disturbed mercury. The southern dregans kept their distance, their spined
  silhouettes dark smudges against the white-hot sky. Geralt knew they weren't afraid;
  desert predators didn't fear prey. They were waiting to see which category he fell
  into now, this hollow man trailing a shadow and a crumbling golem.
