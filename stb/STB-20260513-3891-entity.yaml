raw_quote: 'They cleared the nearest structures first: a ring of low buildings that
  might have been workshops or dwellings, their stone roofs collapsed but their walls
  still standing. Inside, they found nothing but sediment and the roots of swamp trees—but
  the walls themselves held traces of vrill, faint as old scars.'
