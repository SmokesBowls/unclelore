raw_quote: He stepped. Nothing. Second step—a distortion flickered ahead. Not where
  he stood—but where he was going. He stopped. Waited. It didn't vanish. It shifted.
  Sliding slightly to the right, like it was adjusting. Vale changed direction. Stepped
  left instead. The distortion followed—slow, but not wrong. Just late. He stopped
  again. This wasn't a point. It wasn't something to avoid. It was moving.
