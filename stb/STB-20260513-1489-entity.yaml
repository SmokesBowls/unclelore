raw_quote: Kaelen pressed a small, cold chroniton shard into his palm. "This holds
  your external timeline. Wear it visibly. It marks you as... unusual. Use it." She
  gestured towards the shimmering boundary. "Step through. Find the key individual
  – the one whose unresolved pain resonates strongest with the anchor carving. Help
  them face it before the cycle resets." Geralt gripped the shard. "What happens if
  I fail?" Kaelen's expression was stark. "The loop continues. The settlement stagnates.
  And Xal'Zirith's influence grows stronger within fractured time." Geralt took a
  breath. Failure wasn't an option. He stepped forward, the temporal boundary parting
  like cold water. The world shifted subtly – sounds sharpened, colors deepened. He
  stood at the settlement's edge. A farmer trudged past, leading grivets. He glanced
  at Geralt, eyes widening slightly at the glowing shard pinned to Geralt's overshirt.
  The echo had begun. Geralt scanned the plaza. His eyes locked onto a young woman
  kneeling by the grivet carving, silently tracing the stone kits with trembling fingers.
  Her grief was a raw, palpable thing. The anchor point. Katherine's owner. Sully.
  Geralt walked towards her. The settlement held its breath.
