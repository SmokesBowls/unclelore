raw_quote: Geralt turned back to the pulsing Remission Chambers, Mika beside him.
  The fractured light from the five cylinders painted shifting patterns on their faces.
  "Zypher," Geralt’s voice held a low intensity. "The gems... why are they all transparent?"
  Each cylinder was dominated by a central, fist-sized crystal at its core – crimson,
  emerald, sapphire, violet, amber – yet they lacked solidity, appearing as swirling
  condensations of pure, colored light rather than physical stones. They pulsed with
  the same rhythm as the forms suspended within.
