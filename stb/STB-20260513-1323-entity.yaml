raw_quote: The passage twisted sharply, narrowing until jagged rock scraped her shoulders.
  The shouts of her soldiers faded, replaced by a suffocating silence broken only
  by her ragged breath and the crunch of grit under her boots. Then, the air thickened.
  The rock walls seemed to ripple, their surfaces shifting subtly, like scales on
  a sleeping beast. The path ahead branched, then branched again – identical forks
  offering no clue. Mika paused, disoriented. Had she passed that oddly shaped stalactite
  before? Twice? Three times? A cold sweat prickled her scalp. The fissure felt alive,
  breathing malice, warping space itself. Logic screamed retreat, but Geralt… he *had*
  to be deeper in. She pushed forward, choosing left, then right, guided only by a
  gnawing instinct deeper than the unnerving déjà vu.
