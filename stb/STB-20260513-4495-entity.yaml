raw_quote: The sun hung low over the water, painting the shore in shades of orange
  and purple. The Igigi had slept again, fitfully, waking once to drink more water.
  His colour was better—less grey, more flesh. His breathing was deeper. Vale had
  found a few shellfish in the tide pools, cracked them open, offered the meat. The
  Igigi ate a little, chewed slowly, swallowed. He did not speak, but his eyes were
  clearer now. He watched Vale with something like curiosity.
