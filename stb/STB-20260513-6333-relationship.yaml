raw_quote: She pressed her forehead to the chimney stone. The stone was humming its
  doubled hum, but during the alignments—for those fractions of a breath—the hum became
  singular, and the ghost vanished, and the network was whole. Then it split again,
  and the wholeness receded, and the waiting resumed. The system was trying. It was
  failing, but the trying was a new kind of motion. The fragments were reaching for
  phase lock without knowing they were reaching, without any carrier willing it, without
  any part of the network understanding what it was attempting. The system had become
  a reflex, a healing impulse distributed across every node, and the impulse was correct
  even though it could not complete.
