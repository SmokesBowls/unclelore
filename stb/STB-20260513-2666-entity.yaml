raw_quote: The wall rose like a scar against the skyline—not the slapdash timber palisade
  Geralt remembered, but a seamless fusion of mortared stone and something darker,
  its surface glistening with the unnatural sheen of Queen-tech. Iron spikes crowned
  the ramparts at precise intervals, each one humming faintly in a frequency that
  made Geralt's molars ache. Sundrift's ghostly silence had been eerie, Falconridge's
  decay mournful—but Ironspire's new fortifications vibrated with a different energy
  entirely. Not memory. Amnesia enforced by steel.
