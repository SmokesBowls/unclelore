raw_quote: 'Vaelthanebanked sharply, his wingbeats slowing as if caught in viscous
  honey. The other dragons followed, their movements suddenly precise, reverent. The
  "material" beneath them hummed—not a sound, but a vibration Geralt felt in his molars,
  the marrow of his bones. It was neither stone nor metal, but something shaped by
  forces beyond magic: the compressed resonance of a thousand dragon songs, the fossilized
  breath of supernovae, the weight of a thousand millennia of dragon wars pressed
  into a single, perfect architecture.'
