raw_quote: The plinth's fractured shards still hung suspended in the air when Geralt
  stepped forward, his shadow stretching long and jagged across the guild's sanctum.
  Kyh's fingers brushed his wrist—a silent plea for restraint—but he shook her off
  with a twitch of muscle beneath the Dragon Mail. The twelve sovereigns watched from
  their elevated benches, their faces carefully neutral, their hands folded in identical
  postures of condescension. Documentation. Always documentation. As if history could
  be contained in ink and vellum.
