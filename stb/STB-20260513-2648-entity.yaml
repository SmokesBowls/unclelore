raw_quote: The ash clung to Geralt's thighs like a ghost's fingerprints—first one
  gust, then another, swirling the ember-flecked remnants of last night's fire directly
  into his lap. No wind had touched the camp. The air was still as a held breath.
  Kyh's shadow recoiled from the phenomenon, her edges flickering like a candle in
  a draft. "Reality hiccups," Kulla muttered, kneading a fistful of clay into the
  ground as if to plug a leak. Geralt said nothing. He brushed the ash away, watching
  it dissolve before hitting the earth. Some farewells didn't need words.
