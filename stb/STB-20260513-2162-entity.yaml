raw_quote: The sun dipped lower. The order was passed not by shout, but by a look,
  a nod, a gesture. Two hundred and ninety turned as one, facing west. Toward the
  last slavers. Toward the last fight. The dragon armor on Geralt’s chest felt cool,
  inert, a dormant shell. It hadn’t changed since the crash. It was still just a breastplate
  and a promise. As the column began to move, the shadow they cast was long, thin,
  and bleeding into the dusk.
