raw_quote: All around, scattered across the vast chamber floor, dozens of other figures
  stirred. Dozens of other Nameless Ones awakening to the same sensory assault, the
  same disorienting flood of existence without preparation. Some moaned—low, animal
  sounds of confusion and distress. Others simply trembled, overwhelmed. A few, like
  the one who would later be called Geralt, remained silent, struggling to process,
  to catalog, to understand.
