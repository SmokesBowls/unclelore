raw_quote: The first streak tore across the Pacific like a surgical incision—a jagged,
  luminous white bolt that didn't fade so much as solidify, hardening into the atmosphere
  like a scar refusing to close. Geralt's knuckles pressed harder against the viewing
  pane as Earth's oceans began leaching color, their deep blues surrendering to a
  milky, uniform pallor. The transformation wasn't violent. That was the horror. It
  was methodical. Inevitable. The clouds dissolved into the same blank whiteness,
  as if the entire planet were being dipped in liquid porcelain.
