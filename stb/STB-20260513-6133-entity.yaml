raw_quote: The Igigi assigned to the southern drainage channel had been operating
  with a consistent half-second delay for three weeks. The delay had never deviated.
  The delay had never increased. The delay was within operational tolerance, but the
  tolerance did not account for consistency. A consistent delay across multiple subjects,
  multiple shifts, multiple handlers, was not a compliance failure. It was a statistical
  anomaly, and statistical anomalies were reviewed.
