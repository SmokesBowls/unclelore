raw_quote: Vale did not look up. He did not acknowledge the Gruulith. He had spent
  millennia learning that acknowledgment was unnecessary. The stone remembered his
  shape. He pressed another groove into the floor—not a tally, not a mark of defiance,
  but a confirmation. The Gruulith watched the groove appear and could not unmake
  it. The moment of creation was instantaneous. The erasure required a past to invalidate.
  The groove had no past. It was simply there, present, already part of the stone.
