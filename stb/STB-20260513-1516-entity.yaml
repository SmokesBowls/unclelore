raw_quote: 'Beyond him lay the Remission Chambers. Five crystalline cylinders, each
  radiating intense light – crimson, emerald, sapphire, violet, amber – bathing the
  chamber in fractured hues. Within the pulsing light, Geralt glimpsed blurred, shifting
  forms: the Five, suspended in liquid radiance. Their features were indistinct, warped
  by the energies reshaping them, but their signature resonances burned fiercely –
  loyalty tempered to an incandescent edge. Geralt felt the dragon armor resonate
  in recognition, a low thrum of kinship. "Status?" Geralt demanded, his gaze locked
  on the amber chamber where a familiar, fiercely protective signature blazed brightest.'
