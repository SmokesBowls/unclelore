raw_quote: The terrain shifted. The lava rock gave way to a stretch of black sand,
  coarse and loose. The Igigi's bare feet sank slightly with each step. He did not
  complain. He simply walked. Vale glanced back once. The Igigi's eyes were on the
  ground, but his hands were busy—working the fibers as he walked, twisting them,
  testing their strength. He was not just collecting. He was preparing. Vale turned
  forward. Said nothing. The afternoon light turned gold. The wind picked up, carrying
  the smell of salt and dry stone. The Igigi added more material to his bundle—a piece
  of driftwood, thin and flexible; a scrap of cloth from his own torn robe. Vale noticed.
  Still said nothing.
