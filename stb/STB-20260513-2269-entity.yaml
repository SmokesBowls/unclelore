raw_quote: “Weeks old,” Oreck said, kneeling to examine the blast patterns. “He was
  here. They found him. He left before they could close the net.” He pointed to a
  single set of tracks leading east—an Igigi, but with a pronounced, dragging limp.
  A dark, crystalline substance flecked the dust at intervals. Dried chroniton-tainted
  blood.
