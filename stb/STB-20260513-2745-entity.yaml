raw_quote: The loam clung to Geralt's boots like a memory refusing to fade—each step
  pulling threads of luminous mycelium into the air, delicate as smoke signals. Oreck
  crouched low, claws sifting through the black soil until they scraped something
  that hummed. "Here," he growled, and the earth itself seemed to lean in, listening.
  Kyh's shadow-fingers traced invisible ley lines while Kulla pressed his clay palm
  flat against the ground, muttering about "poor foundations" even as the bioluminescent
  veins brightened under his touch.
