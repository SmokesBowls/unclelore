raw_quote: Geralt leaned against a cracked support column, the dragon armor’s breastplate
  dull with ash and scored by energy fire. The vestigial wing-nubs on his back twitched
  occasionally, a phantom itch he’d learned to ignore. Mika approached, her own armor
  scuffed, a fresh burn across her left vambrace. She didn’t speak at first, just
  followed his gaze westward, where the late afternoon sun painted the distant foothills
  in shades of blood and gold.
