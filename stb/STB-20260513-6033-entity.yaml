raw_quote: The water rose to her knees, then her hips. Cold. The marsh had been cold
  for two hundred years, the vrill too thin to warm it. She felt the cold and noted
  it. She did not stop. Her feet found the old channel bed—the stone ribs laid by
  First Shore giants four centuries ago, before the Shadow, before the ship, before
  the occupation. The ribs were still there. The occupation had never dredged this
  far out. The stone remembered its shape.
