raw_quote: She could not become him. If she tried—if she smoothed her truth to match
  his, if she stilled her direction to mirror his constancy—the thread would align
  perfectly. And she would cease to be herself. The labyrinth did not want that. The
  system did not need that. It needed her to remain direction—seeking, moving, stretching
  toward what was not yet known. And it needed Vale to remain center—holding, steadying,
  being the point that direction could orient toward without becoming.
