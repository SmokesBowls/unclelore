raw_quote: The fragment moved between them. Not as sound. As pressure. The weaver
  felt it as a weight in her chest, the same weight she had felt three days ago when
  she pressed her palms to the stone and her jaw unclenched. The Igigi felt it as
  a resonance in her throat, the same resonance she had felt in the channel silt when
  the older female spoke the first syllable and the stone carried it. The fragment
  was Zeph—, and it did not complete, but it pressed against both of them simultaneously,
  a single weight distributed across two bodies.
