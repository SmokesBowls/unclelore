raw_quote: It started where Oreck’s chroniton arrow had struck—a low, dissonant hum
  vibrating through the scout’s corpse. The gold-green veins pulsed like infected
  lightning, spreading through petrified wood and moss-slick stone. Where the Legion
  stood, the ground trembled—not in threat, but in terrible imitation. Vines uncoiled,
  lifting toward the canopy as if conducting an unseen orchestra. The notes tasted
  of copper and spoiled honey on Geralt’s tongue.
