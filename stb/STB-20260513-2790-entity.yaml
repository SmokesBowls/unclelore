raw_quote: Kyh's fingers twitched in midair as they approached the iridescent river,
  sketching invisible geometries only she could see. Her lips moved soundlessly—not
  in prayer, but in argument, her shadow flickering in time with some internal debate
  Geralt wasn't privy to. He watched the way her silver threads coiled tighter around
  her wrists like self-imposed shackles, how her pupils dilated and contracted at
  intervals that didn't match the ambient light. Strange behavior, yes, but no stranger
  than the way she'd taken to vanishing for hours only to reappear smelling of ozone
  and old books, her shadow stuttering like damaged film.
