raw_quote: Throughout the journey, the three heroes found themselves called upon again
  and again to use their newfound abilities. When a group of the shadow creatures
  emerged from concealment to harass the column's flank, Tran met them with steel
  that blazed with crimson fire, his simple farming tools proving more than adequate
  to deal with threats that should have required legendary weapons. When exhaustion
  threatened to overcome the wounded and elderly, Keen found ways to strengthen their
  resolve and ease their burdens through subtle manipulations of the connections that
  bound the group together. And when injuries occurred or existing wounds worsened,
  Viên was there with healing touch that restored not just physical health but spiritual
  strength.
