raw_quote: He rose. Not to his feet — he had no feet, had forgotten the shape of feet,
  had crawled for so long that verticality was a theory. He rose through the spine.
  Through the sternum. Through the anchor point in his chest where void and vrill
  had braided together in a contradiction the system had finally stopped trying to
  resolve.
