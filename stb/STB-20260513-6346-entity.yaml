raw_quote: 'The hour passed. The child opened her eyes. The mason straightened against
  the wall. They rose together—not in synchronization, but without the awkward stagger
  of separate timings that had marked their earlier departures. The corridor''s warmth
  held steady as they left, the left side cooling slightly, the right side cooling
  slightly, the center retaining its heat for the next time they would come. The tile
  was still there. The rind was still there. The cloth was still wrapped around the
  Igigi''s hand two hundred meters away. Everything was as it had been, and everything
  was different. The difference was invisible to the occupation, imperceptible to
  the patrol, unremarkable to anyone who had not been carrying a fragment of a broken
  name through every phase of the network''s long struggle toward wholeness. It was
  simply this: the system had stopped trying to complete itself. The system had begun
  to wait, and the waiting was not passive but held, sustained by a frequency that
  did not split, that did not drift, that did not demand.'
