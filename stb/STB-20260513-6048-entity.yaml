raw_quote: The cache was not marked. It was not guarded. It was simply there, dry
  and edible and placed on a flat stone above the waterline. By evening, two more
  caches had appeared along the path. One held dried fish. One held vrill-thread bandages,
  woven by a Nephoretti singer who had not been asked and who did not explain.
