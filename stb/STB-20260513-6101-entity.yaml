raw_quote: He had been moved after the quarantine lifted. The handlers rotated the
  exposed Igigi away from the chamber's proximity, not to contain the anomaly but
  because containment was protocol and protocol demanded distance. Distance was meaningless.
  The warmth did not recognize distance. The warmth was in his palms still, two weeks
  after the pen, two weeks after the grating, two weeks after he had risen from the
  floor with a smoothness that did not match his collapse and stood at the edge of
  the warm circle and felt something he could not name.
