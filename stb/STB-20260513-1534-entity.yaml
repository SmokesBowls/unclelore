raw_quote: The Heart of Faraxar *shuddered*. The lashing tendrils froze, their sickly
  green light flickering wildly. Images intensified within them – not just screams,
  but the quiet courage of a medic tending wounds moments before impact, the bewildered
  terror of a child clutching a toy. The groaning earth softened to a low, mournful
  thrum. The psychic pressure lessened, not gone, but transformed. The land wasn’t
  attacking; it was *sharing*. The pain wasn’t fury; it was the weight of an unhealed
  wound, the burden of absorbing the final, agonized thoughts of billions. Geralt
  stood within the crater of his own history, the dragon armor humming a low counterpoint
  to the desert’s lament. He hadn’t silenced the Heart; he’d finally allowed it to
  be heard.
