raw_quote: Vale said nothing. He did not ask what kind of thing. He did not ask how.
  He simply sat, the words settling in his chest. Found one that wasn't gone. He thought
  of the water. The cold. The body he had pulled from the sea two nights ago. He had
  found one too. He did not say it. But his silence was different now—recognition,
  not surprise.
