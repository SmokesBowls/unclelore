raw_quote: She had been hauling silt from a clogged drainage channel, a task the reptilian
  handlers assigned to the Igigi because it required long arms and a tolerance for
  cold water and no tools that could be repurposed. She had been doing it for forty-three
  years. The channel was the same channel. The silt was the same silt. The cold was
  less cold now, though she had not registered the change consciously. Her body had
  registered it. Her body had been registering it for days—the half-second delay before
  compliance, the warmth in her palms, the sub-auditory hum that matched the tone
  the quarantine Igigi were still singing, somewhere, in the pens she could no longer
  see.
