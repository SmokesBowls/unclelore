raw_quote: The bridge had failed. The corridor had attempted mediation and proved
  insufficient. The carriers had aligned in time and space and still could not merge.
  The problem was no longer in the network. It was in the foundation, in the deeper
  layer where Vale was pressing grooves into the floor of the sealed chamber, waiting
  for the system to become something it was not yet. The phase could not be locked
  from above. It would have to be locked from below, from the center, from the thing
  that had been holding since before the network existed, since before the fragments
  were separated, since before the thread was severed and the name was broken in two.
