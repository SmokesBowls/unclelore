raw_quote: She had returned to the corridor during the same dead hour, her punishment
  detail completed, her compliance scores still within tolerance, her half-second
  delay still holding. She had been thinking of the weaver—not thinking, exactly,
  but carrying the memory of the doubled warmth, the way the corridor had felt fuller
  with two bodies breathing the same rhythm. She did not expect the weaver to be there.
  The Igigi did not expect. They carried tasks and executed them. But the corridor
  was warm, and the warmth was easier to hold when it was shared, and she had returned.
