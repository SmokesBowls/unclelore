raw_quote: Silence. Vale didn't move for a moment. Then exhaled, slow. The Igigi watched
  the direction it left. "That one didn't change," he said. Vale said nothing. He
  looked at the ground where it had struck. The cracks still bent, the edges soft,
  as if the rock was still deciding. A faint shimmer lingered in the air, then faded.
  He looked up. "Brajor," he said. The Igigi shook his head. "Not Brajor. That's somethin'
  else." He paused, his eyes still on the direction the thing had gone. "Litharim.
  That's what we called the ones that hunted. They don't change. They don't stop."
