raw_quote: The patrol was not due for another hour. The young giant in the drowned
  channels had mapped the pattern, and Ember had marked it on her fourth crossing,
  and the watchers in the high branches had adjusted their shifts to cover the gaps.
  The mason did not know any of this. He was not part of the network. He was a crippled
  old man who had spent eleven months against a cold floor, and the floor was warm,
  and he was walking.
