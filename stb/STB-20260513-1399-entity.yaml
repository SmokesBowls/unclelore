raw_quote: Two hundred and fifty pairs of boots crunched over shattered rock. The
  Anunnaki ship hadn't landed; it had carved its tomb. Twenty miles of armored hull
  lay crumpled against the peaks, plowing valleys where none existed yesterday. Jagged
  metal cliffs rose higher than cathedrals, dripping coolant like black blood. The
  air reeked of scorched earth and something disturbingly sweet.
