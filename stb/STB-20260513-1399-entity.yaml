raw_quote: The tunnel widened abruptly into a cavernous ice chamber. Geralt froze.
  Scattered across the slick floor lay dozens of small, furry corpses – wolf cubs,
  frozen solid mid-play, mid-snarl, mid-flight. Their stillness was absolute, horrifying.
  Kaelen knelt, her temporal light illuminating frost-coated fur. "Not killed," she
  whispered, tracing a claw mark on the ice. "Stolen. Plucked from their timeline
  moments before death." Geralt’s stomach churned. "Who?" Kaelen stood, her face grim.
  "A paradox predator. It hoards moments of terror, preserving them like trophies."
  She pointed towards the chamber’s far end. A crude archway pulsed with unstable
  light. "Through there lies the fracture locus. Prepare yourself." Geralt tightened
  his grip on his blade. The armor flared briefly, casting shifting shadows on the
  frozen cubs. He wasn't just walking into paradox; he was walking into a predator's
  den.
