raw_quote: The Dragon Mail's pauldrons hissed as they unfolded, revealing the latticework
  of old wounds beneath—not just battle scars, but the precise, surgical marks of
  a man who'd been taken apart and reassembled too many times. "Ragnarok's Shadow,"
  Geralt continued, tapping one jagged line along his collarbone. "Breaker of Chains,"
  he added, tracing the brand on his forearm. Each title was a scar, each scar a story
  they'd documented but never *witnessed*. He let his hand drop. "You've written about
  anchors. Have you ever held one?"
