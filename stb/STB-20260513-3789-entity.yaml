raw_quote: Not the largest – that was Stone‑Jaw, whose crystal‑veined face became
  a landmark. Not the fiercest – that would come later, when the war split their kind.
  This one was quieter, older in a way that had nothing to do with years. He moved
  like water over stone, and when the Nephoretti sang, he was always the first to
  turn his head.
