raw_quote: She discovered this on her second crossing, three days after the first.
  The Igigi boy was with her—he was always with her now, meeting her at the canopy's
  edge before the light reached its dull peak, his hollow eyes less hollow with each
  passage. They had crossed the wall four times together. Each time, the cold was
  less absolute. Each time, the warmth followed further into the occupied city. Each
  time, they returned before the patrol patterns shifted, before the dregans' screams
  realigned, before the occupation's instruments could register the sliver of heat
  that was spreading through the severed stone like dye through still water.
