raw_quote: They cut through Sundrift at dusk. Geralt counted seventeen empty market
  stalls where flower vendors once hawked moonblooms and fire-orchids. The fountain
  stood dry, its basin choked with dead leaves. Kyh's shadow stretched long across
  the cobbles, her silver threads probing the hollows between stones as if reading
  old footfalls. No familiar faces peered from shuttered windows. The silence tasted
  like a held breath—not abandonment, but evacuation.
