raw_quote: The world didn't dissolve; it *unfolded*. One moment, Geralt stood on loose
  rock under a bruised sky. The next, he was *inside* the chaos of the third compound
  assault. Sounds assaulted him – the deafening crackle of disintegrator beams tearing
  stonecrete walls, the agonized screams of warriors caught in the Harbinger’s annihilating
  light, the frantic shouts of commanders trying to rally a collapsing defense. The
  acrid tang of vaporized metal and charred flesh filled his nostrils. Dust choked
  his throat. He saw Lieutenant Varik, shield raised defiantly against a beam meant
  for a downed medic, seconds before the light engulfed him. *No!* Geralt lunged instinctively,
  a roar tearing from his throat. His hand passed through Varik’s fading shoulder
  like smoke. He was a ghost here. A witness, not an actor.
