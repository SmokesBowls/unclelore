raw_quote: The Pleiadians were humanoid—more so than the Anunnaki, more so than any
  of the overseer species. Tall, with refined features that suggested generations
  of deliberate genetic optimization. Their skin carried faint luminescence, as though
  lit from within. Hair cascaded in impossible colors—silver, gold, colors that had
  no name in any human language. Their eyes held depths that suggested either great
  wisdom or terrible emptiness, depending on the angle of observation.
