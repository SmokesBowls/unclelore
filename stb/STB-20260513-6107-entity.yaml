raw_quote: The fragment did not complete. It would not complete for a long time. The
  thread was too frayed. The occupation was still watching, still measuring, still
  certain that the Igigi were broken. But the syllable had been spoken twice now,
  in two different mouths, in two different channels, and the stone had carried it
  both times, and the warmth had received it, and the center was holding.
