raw_quote: Teryn thought of the first days, when the light had been gold and the marsh
  had been green and the world had seemed full of possibility. She thought of the
  hundred years of peace, the long watch, the slow building of a city that had become
  a home. She thought of the Igigi, who had fallen from the sky and stayed, who had
  measured the world and found it wanting and set about fixing it.
