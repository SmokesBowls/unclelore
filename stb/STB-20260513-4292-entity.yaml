raw_quote: Not the old memories — the wars, the hatreds, the centuries of killing.
  Those memories drowned, eventually, in the rising water. What remained were newer
  memories. Smaller memories. The memory of a child who had learned to climb before
  she could walk. The memory of a giant who had carried a Nephoretti singer across
  a flooded channel. The memory of a moment when someone had chosen to help instead
  of to hoard.
