raw_quote: Ishara looked down at her newborn, at the daughter she had not asked for
  but would protect with every calculation her mathematical mind could generate. "I
  will name her Layla," she decided. "After the ancient word for 'night' in a language
  our people spoke before the Anunnaki. Because she was born in darkness, but perhaps
  she will live to see dawn."
