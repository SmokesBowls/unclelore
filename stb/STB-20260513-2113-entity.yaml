raw_quote: The Red Hand didn’t hesitate. There was no ceremony, no challenge. They
  simply attacked. Kael’s axe took the lead guard’s head off in a spray of dark fluid
  and sparks. The others followed, a blur of brutal, efficient violence. It was over
  in twenty seconds. Two Red Hand bore fresh, sizzling wounds from energy blades,
  but they waved off Geralt’s look. “Scratches,” one grunted, binding it with a rough
  bandage.
