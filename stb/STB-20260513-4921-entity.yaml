raw_quote: Zephyr’s gaze didn’t leave the work bed. “Grove moves like water. Swamp
  moves like bedrock. Neither one’s wrong. But they ain’t speakin’ the same language.”
  He tapped the rail. “The little ones down there… they don’t just harmonize. They
  read the stone. They pull the vrill where it’s already wantin’ to go. Ain’t math.
  Ain’t force. It’s… geometry with breath.”
