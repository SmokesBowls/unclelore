raw_quote: The terrain south of the city was different from the eastern approach.
  Less volcanic rock, more packed sediment—ancient seabed, lifted and dried by forces
  Vale did not fully understand. The flood channels here were deeper, their walls
  carved smooth by centuries of water that no longer flowed. The vrill ran thin in
  some places, pooled in others, following paths that seemed random until Sera pointed
  out the pattern.
