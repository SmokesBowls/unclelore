raw_quote: The grey light found them still on the shore. Vale had not slept. His back
  was against a driftwood log, his legs stretched toward the water, his eyes fixed
  on the stranger's breathing. The robe was still tucked around the Igigi's body.
  The tide had risen and fallen, leaving a dark line in the sand a few paces below
  them. The sky paled. A few clouds caught the first light, turning the colour of
  old copper. The water was calm, ordinary. No shimmer. No pressure. Just the slow
  lap of waves.
