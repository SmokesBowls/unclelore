raw_quote: On the island, Vale’s fingers traced the same discipline. He did not force
  the stone to hold him. He asked it to remember his shape. The grooves deepened.
  Not by force. By repetition. By patience. By the quiet insistence of a being who
  had learned, too late and just in time, that home was not a coordinate. It was a
  hand that steadied you when the numbers stopped making sense.
