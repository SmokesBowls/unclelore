raw_quote: Morning broke grey and salt-thick. Vale stood at the edge of the lowest
  terrace, where worked stone gave way to the new docks. The timber was dark, waterlogged,
  lashed to basalt pilings with woven cord. The tide pulled back, leaving a sheen
  of vrill on the wet rock. He felt it before he heard it—the low hum of the needle,
  the slower pulse of the channels, the scattered rhythm of work already underway.
