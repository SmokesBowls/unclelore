raw_quote: 'Halvar paced the perimeter, axe gleaming. "Focus on the weight," Geralt
  ordered, his Applicator scorching against his skull. "*Feel* your boots crushing
  stone. Hear my voice." Ren flinched as vines whispered his darkest shame—the Martian
  outpost he’d fled. "Ignore echoes," Geralt growled. "They’re thorns, not truths."
  Luminara’s glow brightened, casting long, defiant shadows. Around them, the Legionnaires
  clutched weapons, lips moving in silent mantras: names of home, rhythms of drills,
  equations of vrill-flow. Resistance was a raw, scraping thing—a refusal to let their
  minds be unmade.'
