raw_quote: He worked slowly, deliberately. The seaweed was wet, but he twisted it,
  squeezed it, shaped it into cords. The fibers he wove between the cords, creating
  a mesh—flexible but strong. The bark strips became soles, layered and pressed flat.
  His hands moved with a quiet precision, practiced but unhurried. Vale watched from
  across the fire. He did not offer help. He simply sat, his back against the rock,
  his eyes on the Igigi's hands. The fire crackled. The wind picked up, then died.
