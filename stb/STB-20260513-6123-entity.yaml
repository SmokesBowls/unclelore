raw_quote: The route from the chimney to the shadow line was fifty paces. Ember had
  walked it four times now, each time stopping at the turned tile, each time marking
  the limit with her body. The warmth thinned beyond the shadow. The occupation's
  presence thickened. The inner gate loomed ahead, its basalt pillars still scarred
  from the siege two centuries past, now fitted with ship-made instruments that tracked
  vrill displacement and thermal shift. The instruments were aimed outward. They were
  not aimed at the terrace floor, where a single tile lay pale side up.
