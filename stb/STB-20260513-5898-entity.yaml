raw_quote: In the eastern workshop, Sera’s hands moved through vrill-seed and damp
  clay, her song a low, steady thread against the silence. It used to be that the
  needle answered before she finished the phrase. Now, she sang the full arc, waited,
  and felt only the echo return. *“We are pressing hope into the stone, layer by layer,”*
  she told Mora one evening, wiping grit from her jaw, *“but the needle no longer
  answers before the question is asked.”* Mora didn’t flinch. She simply hummed the
  binding tone a half-step lower, letting it settle into the mortar between terrace
  stones. *“Then we sing until it remembers how,”* she said. But the worry lived in
  the spaces between their notes. The First Shadow had brought the Igigi. The Second
  was written in the fatigue of the bedrock, the Third almost frozen in time. And
  without Vale’s pulse to ground it, the land felt unspooled.
