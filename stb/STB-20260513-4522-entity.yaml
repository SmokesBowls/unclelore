raw_quote: They stopped at a sheltered hollow, a depression in the rock where the
  wind could not reach. The sun was low, the sky turning orange. Vale gathered driftwood.  He
  stacked the wood, found a flat stone, and struck it against another until a spark
  caught the kindling. The fire grew. Small, steady, ordinary. The Igigi sat near
  it, his back against a boulder, his bundle of materials beside him. He did not speak.
  He simply watched the flames for a long moment, then reached for the seaweed.
