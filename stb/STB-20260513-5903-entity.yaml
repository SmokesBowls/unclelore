raw_quote: At the hearth fires, the talk turned inward. No one had seen Vale or Zephyr
  leave. They had simply stepped into the pattern and not returned. The town began
  to speak of them as a single breath held too long—the Synthesis swallowed back by
  a world not yet ready for its weight. *“The stone didn’t take them,”* an elder murmured,
  feeding damp peat to the flames. *“It kept them. Until we learn to hold the shape
  without the center.”* But fear ran deeper. The Cliff Giants held the first Nexus.
  The southern labyrinth’s door remained sealed. The Shadow’s approach was written
  in tired stone and thinning song. They were becoming something unplanned, yes—but
  in the dark. Wondering, in quiet moments, if they were merely dust in the wind without
  their Keepers to guide the resonance.
