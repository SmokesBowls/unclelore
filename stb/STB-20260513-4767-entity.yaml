raw_quote: The taller figure moved like Vale. But not quite like Vale. There was something
  different in the way he walked now—a pause before each step, a hesitation that was
  not uncertainty but listening. And the shorter figure behind him… Stonefall had
  seen Igigi before. Three of them had fallen from the sky and made their home in
  First Shore. But this one was different. His proportions were the same, but his
  posture was older, heavier, carrying something that the others did not.
