raw_quote: 'Silence slammed down—deep, sterile, red. Geralt’s boots crunched Martian
  sand. Dragon Nebula light bathed the Legion in sapphire gloom. Luminara’s spire
  stood whole again—obsidian gleaming under alien stars. Luminaire sighed within Geralt’s
  palm: *"Duty... fulfilled."* Relief warred with exhaustion. Halvar spat crimson
  dust. Mika scanned dead skies. No dragons. No wyrms. Only desolation. Oreck lowered
  his bow, fingers trembling. Lyra’s scanner blinked: "Transit integrity confirmed.
  Earth resonance stable." But Geralt felt it—the Nebula’s watchful gaze. Judgment
  deferred. Not ended. He tightened his grip on Luminara’s fading warmth. The war
  waited. Earth bled. And four storm-lit figures lingered in memory—lightning fists,
  star-woven robes, shadows that killed. Questions coiled like vipers. But for now...
  breath. Silence. Sand. Home for the weary. Victory tasted like ashes and ozone.
  The Legion lived. The Garden endured. Next?'
