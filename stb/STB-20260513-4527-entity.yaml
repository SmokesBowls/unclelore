raw_quote: It was low—barely audible over the fire. A single note, held steady, then
  shaped into a pattern. It was not a song, not quite. It was a tone—a vibration that
  seemed to come from his chest, not his throat. The air around him shimmered faintly—not
  the shimmer of the east, but something softer, something that belonged to him. Vale
  leaned forward. The tone was familiar—not the needle's pulse, not Luminaire's warmth,
  but something that resonated in his chest nonetheless. He had heard something like
  it before, long ago, in the songs of the Nephoretti. But this was different. This
  was not a song of stone or vrill. It was something older.
