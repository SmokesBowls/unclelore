raw_quote: Miral's ancient eyes met his. "Yes. And no. They built with Void energy—the
  pure Ethereal, the force that existed before light and sound. Their points were
  stronger, more stable, able to span galaxies." She paused. "But they forgot something.
  They built the points, but they did not weave the relationships. They created a
  network of power, not a web of connection. And when the war came, when the Aaon
  Keepers struck, the points held—but the spaces between them collapsed. Because there
  was nothing alive in those spaces. Only structure."
