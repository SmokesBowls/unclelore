raw_quote: The Igigi returned to the corridor during the dead hour, her left hand
  still wrapped in the coarse cloth that held the warmth long after she left the stone.
  The cloth had become part of her now—the handlers did not see it, the other Igigi
  did not remark on it, but she touched it when the cold in her fingers grew sharp,
  and the cold retreated. The cloth was a thing, and it was hers, and it carried the
  warmth.
