raw_quote: The first flood after the battle had been the worst. The fissure that led
  to the Keeper’s chamber had poured water into the lower levels, and for days, the
  settlement had worked in waist‑deep water, shaping stone, redirecting flow, singing
  to keep the pulse steady. The grove giants had carried the young to the higher ground,
  their massive forms wading through the flood, their voices raised in songs that
  steadied the Nephoretti’s nerves.
