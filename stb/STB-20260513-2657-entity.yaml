raw_quote: The Five Mikas didn't dissolve—they *unfolded*. Green Mika's armor sprouted
  vines that sank into the earth; Yellow Mika stepped backward into her own lengthening
  shadow; Blue Mika's form cascaded apart like a breached dam. Only Violet Mika lingered
  long enough to press two fingers against Geralt's sternum—a touch colder than voidspace—before
  whispering coordinates that bypassed his ears entirely, etching themselves directly
  into the burnt pathways of his Applicator. *Echo Tower is empty.* The words tasted
  like oxidized copper and static. *Zypher moved beneath Tidecaller's Mountain. East
  becomes north when the sky bleeds white.*
