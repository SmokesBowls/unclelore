raw_quote: The patrol had passed. The shadow line was quiet. The chimney house was
  dark—the old Igigi woman was kneeling against her stone, her palm flat, her breath
  slow. The child passed without seeing her. The warmth pulled her onward, through
  the collapsed workshop, past the debris the young Igigi had cleared, toward the
  dark gap where the stone was warmest.
