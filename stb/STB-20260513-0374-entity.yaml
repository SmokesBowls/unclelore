raw_quote: Torhh represented the Tidecallers—ancient beyond most, memory stretching
  back to the First Coming and even fragments of the Garden itself. Beside the jade-green
  Giant stood Korrhan of the Ash Giants, its burnt-red stone-flesh cracked and barely
  holding cohesion after months of Gruulith assault. Saresh limped forward for the
  desert tribes, its body fragmenting from sustained Dregan sonic attacks. Representatives
  from Forest, Mountain, Highland, and Subterranean populations completed the circle,
  each bearing wounds that spoke of coordinated Anunnaki pressure across all territories.
