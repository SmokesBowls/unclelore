raw_quote: Now, Geralt stood at the Nexus’s primary anchor point – a stable platform
  overlooking the churning basin of fractured moments. The Star Needle spire, its
  chroniton core now humming with calibrated purpose, pulsed steadily beside him.
  Kaelen faced him, her form shimmering slightly against the vortex-light. "The spire
  is attuned," she stated, her voice devoid of inflection. "It will translate you
  back to your origin point – the crash site. Its chroniton resonance will guide you
  to the other Void Spires. Nine anchors. Two dormant. Find them. Stabilize them.
  Learn their secrets." She gestured towards the spire. "Your path lies outward now.
  Not within."
