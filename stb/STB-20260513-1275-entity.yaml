raw_quote: 'The applicator screamed warnings: *Temporal instability detected! Extreme
  chroniton flux! Withdraw immediately!* Simultaneously, the dragon-scale armor pulsed,
  radiating fierce encouragement: *Confront! Prevail!* Geralt stared at the shimmering
  distortion. Within its heart, he thought he saw fleeting shapes – armored figures
  locked in desperate combat against a towering shadow wreathed in impossible light.
  The Harbinger. His friends. His failure. Pain lanced through his ribs, sharp and
  grounding. He spat blood onto the scree. Watching wasn''t enough. Learning couldn''t
  be passive. He met Kaelen’s gaze. "Teach me," he growled, taking a staggering step
  towards the vortex. "Now."'
