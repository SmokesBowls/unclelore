raw_quote: While the city’s hands, voices, and calculations were anchored at the ridge,
  the true assault came down on the eastern and southern terraces. It was not a charge.
  It was a bombardment. Focused null-pressure. Synchronized footfalls. Resonance hammers
  driven into the outer walls until the vrill-glass canopies cracked and the channel
  ribs groaned. First Shore fell back. Not in panic. In sequence. Outer terraces to
  inner. Inner to the Needle’s threshold. The breach did not come on the first strike.
  It came on the thirtieth day. A slow, grinding attrition that tested every song,
  every calculation, every lesson of patience. When the eastern wall finally gave,
  it did not shatter. It peeled. Stone slabs shifted aside like exhausted lungs. A
  gap opened. The Cliff Giants stepped through. And First Shore held the line behind
  it.
