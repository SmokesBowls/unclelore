raw_quote: After a long while, the Igigi spoke. His voice was still rough, still quiet.
  "You were walking east when you found me." Vale nodded. "Why?" Vale considered the
  question. He could have said to see what grows. He could have said I do not know.
  He said neither. "Something was out there," he said. "I wanted to understand it."
  The Igigi looked at the eastern horizon. It was empty. "And now?" Vale stood. "Now
  I am walking west." He offered a hand. The Igigi took it, pulled himself up. His
  legs were steadier now. They began to move again.
