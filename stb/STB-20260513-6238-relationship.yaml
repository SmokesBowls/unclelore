raw_quote: The interference had been born in the corridor, in the space between the
  child's fragment and the mason's fragment, where two correct signals had met and
  failed to merge. But the failure had not been contained. It had bled outward—through
  the stone, through the warmth, through the hum—and now every part of the network
  carried a doubled frequency, a tremor beneath the signal, a ghost of the almost-convergence
  that had not been able to hold.
