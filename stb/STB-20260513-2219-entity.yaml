raw_quote: Geralt walked at the head, his Stage 1 wings folded tight against his back.
  They caught the sun, casting a jagged, dragon-shaped shadow that stretched ahead
  of him like a guide. Mika walked at his side, her eyes perpetually scanning the
  horizon, a habit war had etched into her bones. They spoke little. The silence between
  them was not empty; it was full of the unspoken understanding that the mission was
  over, and the weight of what came next was settling upon them.
