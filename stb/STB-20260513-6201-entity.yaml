raw_quote: The pauses returned—not as they had been, but stronger. Keth-var stopped
  at the collapsed workshop and stood there for 4.3 seconds, his jaw unclenched, his
  breath slow, the patrol log recording the deviation and filing it without comment.
  The Igigi hummed louder—still sub-auditory, still below the threshold of detection,
  but strong enough that the stone hummed back. The older singer shifted the vigil
  by twelve heartbeats instead of nine, and the silence she created was deeper, and
  the shield held better than it had before the interruption.
