raw_quote: The air thickened, losing its knife’s edge dryness. Boots crunched on gravelly
  earth now, sand yielding to cracked hardpan radiating heat upward like coals. Ahead,
  blinding white salt flats stretched—cracked crusts whispering false promises of
  water under the midday glare. Geralt’s dragonmail hummed differently here; Zaron’s
  spirit recoiled faintly against the mineral scent carried on sudden, sluggish breezes.
  Thorny bushes clawed upward from the baking soil, razor-edged grasses scratching
  against scaled greaves. Silence draped itself like a shroud. No wind whispers. Only
  the scuff of weary boots and the low thrum of shield generators. Then, a sharp cry
  echoed—Corporal Vess stumbled backward from a low mound. Her boot sank calf-deep
  into liquefied clay where solid ground seemed moments before. The earth pulsed visibly
  around her leg, drawing her deeper. Panic flared. Legionnaires froze. Oreck surged
  forward, his chroniton-enhanced strength anchoring him on firmer ground as he seized
  Vess’s arm. "Don’t struggle!" Mika barked, seeing the suction intensify. The clay
  gulped hungrily. "Guide her slowly!" Geralt ordered, scanning the treacherous basin—this
  was no desert. This was the land’s wounded throat.
