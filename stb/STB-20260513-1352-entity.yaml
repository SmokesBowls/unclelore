raw_quote: Kaelen’s voice cut through the din. "Stable! Now, amplify! Force the reversal!"
  Geralt poured every shred of focus into his integrated harmony. The golden spark
  flared, pushing against the sickly green. The Spire groaned like a dying beast.
  Stone cracked overhead. "It’s destabilizing!" Geralt yelled. Kaelen’s eyes blazed.
  "Exactly! The sinkhole effect weakens as its anchor shifts! Prepare to move!" She
  gestured towards a widening fissure beneath the core. "That leads deeper – towards
  the fracture locus!" Geralt nodded, sweat freezing on his brow. The golden light
  surged, momentarily overwhelming the corruption. The crushing drag vanished. Gravity
  reasserted itself violently. Geralt staggered. "Now!" Kaelen commanded. She leapt
  into the fissure. Geralt followed without hesitation, plunging into the abyss below
  the crumbling Spire. The sinkhole collapsed behind them.
