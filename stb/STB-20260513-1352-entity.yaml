raw_quote: A softer, resonant growl vibrated against his bones. The armor’s spirit.
  *Focus. Stand.* It wasn't words, more like… intention. Geralt gritted his teeth,
  leveraging the conflicting energies within him. He lurched upright, swaying. The
  crash site sprawled below him – a canyon gouged by the airship’s carcass, twisted
  metal gleaming dully under the strange light. Ahead, jutting from the scree like
  a misplaced tooth, stood a slender spire of obsidian stone. Smooth, impossibly dark.
  The Star Needle. Drawn by instinct or the hum in his skull, he stumbled towards
  it.
