raw_quote: Sera chose the site. Not by calculation. By feel. She walked the shoreline
  for hours, her palm pressed to the stone, her voice a thread of melody that the
  vrill answered in faint, pulsing harmonies. When she found the place—a flat shelf
  of dark rock, veined with blue mineral that caught the light and seemed to move—she
  knelt and pressed both palms to the stone.
