raw_quote: Geralt counted their footfalls instead of screams. Violet Mika's absence
  was the loudest—until reality itself hiccuped, and the last two riders simply ceased
  mid-stride, their outlines fraying like poorly rendered ink sketches. Only then
  did Violet Mika condense from the empty air beside Geralt, her cloak still rippling
  with afterimages of erased spacetime. "Cleaner this way," she murmured, though her
  voice came from everywhere and nowhere, a harmonic pressed between seconds.
