raw_quote: What had been a place of survival became something approaching abundance.
  The channels that had frozen and flooded now teemed with fish. The twisted trees
  that lined the waterways put forth fruit that none of them recognized but all learned
  to eat. And the fields they had planted – laboriously, using vrill to turn the ancient
  soil – were beginning to show green.
