raw_quote: They continued. Now it wasn't about stopping. It was about timing. Distortions
  appeared—one, then another. Not constant. Not random. But enough that Vale couldn't
  just wait them out. He moved through them. Not faster. Smarter. Each step placed
  where the world hadn't closed yet. One came late. Too close. The air compressed
  just ahead of his step. Vale shifted mid‑motion—barely—his foot landing just outside
  the pressure. The ground where he had aimed sank slightly, like something had pressed
  down a fraction too late. He didn't stop. Didn't look back.
