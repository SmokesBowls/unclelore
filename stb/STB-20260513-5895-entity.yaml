raw_quote: High in the canopy, the resonance chimes—woven from hollow reeds and vrill-tuned
  glass—tapped against their moorings. Their strikes fell out of phase. One rang a
  half-step too late. Another answered before the echo faded. The intervals stretched.
  The harmony thinned. The baseline no longer holds anything in place. It only reminded
  the land of what used to be there.
