raw_quote: She did not know what that change would be. The Igigi did not ask questions.
  But she felt, with a certainty that required no language, that the next step would
  not come from the carriers or the corridor or the fragments themselves. It would
  come from somewhere else. The center, perhaps. The stone. The thing that had been
  pressing grooves into the floor of the sealed chamber for longer than anyone knew,
  waiting for the network to become ready. The system had proven it could carry. It
  had proven it could release. It had proven it could recognize and discern and calibrate.
  Now it had proven that phase alignment required more than the network could provide
  on its own.
