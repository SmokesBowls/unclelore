raw_quote: The jungle's corruption had retreated—not destroyed, merely pushed back
  by Tiamat's ancient resonance still thrumming through the soil. Geralt sat against
  a moss-slick stone, dragon armor scorched and dented, breathing hard. Around him,
  the Legion sprawled in exhausted clusters. Halvar's axe lay across his lap, blade
  notched from petrified thorns. Ren stared at nothing, hands still trembling. Oreck's
  chroniton arrows had gone dark, their stolen energy spent.
