raw_quote: 'Lyra’s scanner screamed. "Resonance decay in twelve seconds! Gate destabilizing!"
  Geralt ripped his gauntlet from the cleansed Nexus. Silver light already engulfed
  the Legion—transit energy fraying at the edges. "Rho formation! Homeward sigil—now!"
  Oreck’s arrows traced the dragonway glyph in emerald flame. Legionnaires locked
  shields, vrill-chant rising to a crescendo. Luminaire’s light pulsed weakly. *"Mars...
  calling..."* Earth’s gravity tugged. Mist thickened. Distant reptilian screams choked
  into silence as silver consumed sight. Geralt’s last glimpse: Igigi survivors vanishing
  into ferns, their eyes wide with dawning hope. Then—cold. Void. Weightlessness.
  Luminaire’s presence flickered. A final whisper: *"Remember... the Garden..."*'
