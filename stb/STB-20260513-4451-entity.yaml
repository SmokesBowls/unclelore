raw_quote: By the fifth day, the islands were distant smudges. The shimmer was constant
  now—a line of distortion just beneath the surface, always ahead, never reached.
  Vale swam when he had to, walked when the bottom rose. The needle's pulse in his
  chest was fainter, as if the east was pressing against it. He had begun to count
  the hours by that weakening beat.
