raw_quote: Tidecaller's Mountain grew teeth as they approached. What had been a distant
  smudge of violet-grey against the horizon now loomed like a snapped bone jutting
  from the earth's flesh, its upper slopes sheathed in ice that glittered with unnatural
  clarity. Geralt's Applicator throbbed in time with their footsteps—not a warning,
  but a tuning fork resonating with something buried beneath the scree. Kyh's form
  frayed at the edges whenever they passed cairns of stacked obsidian shards, her
  silver threads vibrating as if plucked by invisible fingers. "They're markers,"
  she whispered once, though her lips didn't move. "Not for travelers. For whatever
  walked here before continents cooled."
