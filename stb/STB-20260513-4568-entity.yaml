raw_quote: 'They stopped near a split in the rock where a thin line of shade cut across
  the ground. Vale drank from the leafbowl, passed it. Then: "You said it was still
  alive." The Igigi nodded. Vale looked at him. "What is it?" The Igigi didn''t answer
  right away. He crouched, picked up a fragment of dark stone, rolled it between his
  fingers. "Not like anything you''ve seen on land." A pause. "Built for the deep.
  Pressure. Silence. Time." He glanced toward the coast—toward the water. "Doesn''t
  rush. Doesn''t waste." Another pause. "Just… is."'
