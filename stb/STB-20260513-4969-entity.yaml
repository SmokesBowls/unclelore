raw_quote: Vale walked beside the Nephoretti woman. Her name, he had learned, was
  Sera. She had been born in the grey, three hundred years ago, when the marsh was
  still frozen and the needle's light was the only warmth. She had learned to sing
  before she learned to speak. Had learned to hear the stone before she understood
  what hearing meant.
