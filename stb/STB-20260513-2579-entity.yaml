raw_quote: Geralt exhaled through clenched teeth. Human stamina meant nothing here.
  This was dragon-time—a battle measured in the lifetimes of quasars. He watched Kulla
  hurl another clay-fracture into the enemy ranks, watched Kyh weave starlight into
  tripwires for silver serpents, watched Oreck ride his emerald mount straight into
  the heart of the Vasthril formation with claws extended. The numbness in his chest
  didn't fade. It deepened. Because this wasn't his war. It was theirs. And dragons,
  when properly provoked, didn't fight battles. They wrote endings.
