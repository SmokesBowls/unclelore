raw_quote: The dragons banked in unison—a choreography older than human language—their
  wingbeats carving a rift in the Vasthril formation wide enough to slip through.
  Pyrocast’s scales hummed against Geralt’s palms as they plunged into the opening,
  spacetime stretching thin around them like overworked taffy. For three heartbeats
  (or three centuries; time meant little here) they fell through the wound in the
  war, emerging above a distant moonlet that glowed like a photon trapped in amber.
