raw_quote: It had been clean since the calibration—a single, steady tone that matched
  the stone's hum and answered the lightning directly. But tonight, as the storm flashed
  and the thunder rolled, her throat opened and produced a sound that was not one
  note but two, a fundamental tone and a fainter overtone that sat just above it.
  The two frequencies did not harmonize. They beat against each other, a slow oscillation
  that the handler's instruments logged as a sub-auditory anomaly and dismissed. The
  Igigi did not know her hum had split. She only knew that her throat felt strange—not
  depleted, not strained, but busy, as if the hum was carrying more information than
  it had been designed to carry, and the carrying was effortful in a way it had not
  been before.
