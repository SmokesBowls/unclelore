raw_quote: Kaelen’s voice cut through the din, calm and immediate, yet seeming to
  originate from everywhere and nowhere. "Feel the *texture* of the moment, Geralt.
  Not the sights, not the sounds – the *chroniton weave*. Your applicator perceives
  it as danger. Your armor feels it as resistance. *You* must feel it as potential."
  Geralt forced himself to stop reaching for Varik. He closed his eyes against the
  horror, focusing inward. Beneath the applicator’s frantic alerts and the armor’s
  defiant thrum, he sensed… threads. Millions of shimmering filaments, taut with tension,
  fraying under the Harbinger’s assault. One thick, fraying cord pulsed directly ahead
  – Varik’s thread, snapping violently. "That cord!" Kaelen urged. "Not to catch it
  – to *reinforce* its anchor point *before* the stress! See the point of imminent
  fracture?"
