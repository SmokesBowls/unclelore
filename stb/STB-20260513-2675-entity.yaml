raw_quote: The crimson dragon—Pyrocast—lunged forward, his wings shearing through
  the air like blades. Recognition flared in those supernova eyes. Not of Geralt,
  but of the scorched Applicator fused to his spine, still smoking from its battle
  with the Spire. "You bear the old scars," Pyrocast's voice came as a tectonic rumble.
  "And now the sky bleeds white." Around them, the other dragons shifted, their talons
  carving sigils into the regolith—ancient flight-pact glyphs.
