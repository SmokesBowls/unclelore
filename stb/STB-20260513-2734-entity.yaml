raw_quote: The clone's dissolution leaves the chamber vibrating with a profound silence,
  thick with the dust of shattered certainties. Equations bleed from the severed neck,
  seeping into the stone floor where they writhe and fade like dying phosphorescence.
  Geralt stands over the corpse of his own perfection, his corroded fist still crackling
  with the afterglow of Vaelthane's stolen roar. The Dragon Mail's divinity thrums
  within his alloy bones, no longer a graft but a fused, furious core.
