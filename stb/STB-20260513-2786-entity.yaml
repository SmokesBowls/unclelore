raw_quote: Kulla discovered the ocean like a child finding a forgotten toy. One moment
  he was trudging behind Geralt, kneading his ever-fracturing clay; the next, he'd
  plunged into the surf with the single-minded delight of a landslide greeting gravity.
  When he emerged hours later, his body was a mosaic of iridescent barnacles and spiral
  shells, their edges fused seamlessly into his flesh. "Better mortar," he announced,
  shaking seawater from a crevice where his left ear should be. Beneath the waves,
  brajors circled—not fleeing, but maintaining exact parallax, their bioluminescent
  frills dimming whenever Kyh's shadow passed too close to the tideline.
