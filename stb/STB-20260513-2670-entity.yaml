raw_quote: They emerged into air that smelled of lightning-struck granite and something
  darker—ozone with teeth. The ground here wasn't ground at all, but the corpse of
  an older mountain, its bones ground to powder and reshaped into the Queen's parody
  of order. Geralt's boots sank slightly, the earth remembering itself just long enough
  to bear their weight before reverting to sterile dust. Behind them, the fissure
  sealed with a sound like a ribcage collapsing.
