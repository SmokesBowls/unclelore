raw_quote: The giants did not approach. They stood on the ridges above, their tall,
  lean forms silhouetted against the grey sky, their null-pressure a wall of contained
  attention. They did not trust. They did not welcome. But they did not interfere.
  The point they had allowed Vale to build—the one that would link their territory
  to the network—was being built now, at the edge of their land, where the stone remembered
  their presence without being claimed by it.
