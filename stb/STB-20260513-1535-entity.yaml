raw_quote: Geralt exhaled, a slow, measured sound like stone grinding. He lifted his
  head from the obsidian wall, eyes reflecting the fractured glow of Oreck’s pathfinder
  arrows. "The Void Spires," he began, voice resonant yet weary. "They aren't just
  anchors. They're *keepers*. Each one... a resonance lock." He traced a clawed finger
  on the dusty floor—a jagged spire shape. "The Gravitons, those cosmic architects...
  they built more than spires. They seeded *guardians*. Echoes of their will." His
  finger jabbed beside the spire. "
