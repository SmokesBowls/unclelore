raw_quote: The cracked sandstone stairs vanished beneath ankle-deep water slick with
  condensation. Each step echoed too loud, too soon—a drumbeat swallowed by damp stone.
  Geralt led, boots sinking into unseen silt. Above, the ceiling wept mineral tears
  that hissed against heated armor seals. Below, the Void Spire’s ghost-light bled
  upward, painting the shaft walls into jagged, shifting silhouettes. Legionnaire
  Bren gasped behind him—a wet, choked sound. Then retching. Pressure sickness. The
  Luminaire’s buried song wasn’t heard. *Felt*. It vibrated ribcages, warping inner
  ears. Equilibrium shattered. Shieldbearer Kael stumbled sideways, his helmet amplifying
  the dissonance into a skull-drilling whine. Tinnitus screamed. Vertigo pulled. The
  shaft breathed—a subsonic groan resonating through stone and bone. Geralt’s dragonmail
  flared azure, Zaron’s will anchoring him. *One step lower and your stomach drops—the
  resonance isn’t sound, it’s gravity bending.* He hauled Bren upright against the
  trembling wall. Sweat carved trails through grime. Silence. Only the drip. And the
  hum.
