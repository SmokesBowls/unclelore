raw_quote: 'They stood at the entrance together. Human and Igigi. Weaver and laborer.
  Neither had spoken in more than a year—the slaves did not speak, the Igigi had not
  spoken for millennia. They did not speak now. They looked at each other in the dim
  amber light that filtered through the collapsed workshop roof, and they did not
  need to speak. The warmth was speaking for them. It was saying: You arrived correctly.
  You both arrived correctly. The corridor is large enough for two.'
