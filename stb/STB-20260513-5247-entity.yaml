raw_quote: The stagnant pool lay in a depression of old stone, a place where the vrill
  had been pooling for centuries—long before the flood, long before the freeze, long
  before the Nephoretti had found this shore and begun to sing. It was not corrupted.
  Not poisoned. Just... tired. A system that had been running too long without change,
  without release, without the small deaths that made room for new growth.
