raw_quote: Kaelen stepped closer, her movements unnervingly smooth. "Want? To stitch
  the wound *you* tore. The Needle's activation is premature. It creates… instability.
  A localized temporal vortex." She pointed towards the deepest gouge in the canyon
  floor, near the crumpled bow of the airship. The air above it shimmered, warping
  light into impossible geometries. "See that distortion? That's *now*. But within
  it…" Her voice dropped, heavy with implication. "...is an echo. *Your* echo. The
  moment your legion was unmade." She looked back at him, her galactic eyes holding
  his. "You wish to learn how to wield ancient powers? How to defy the Queen’s dominion?
  Step into the vortex, Geralt. Step into the eye of your own storm. Learn by *undoing*."
