raw_quote: Kaelen didn't deny it. A ghost of something – regret? weariness? – touched
  her features. "Long enough to know your resolve burns brighter than your fear. Long
  enough to see the paradox forming around you like a storm cloud." She gestured towards
  the shimmering vortex near the wreckage. "The falcon observes. It reports. Your
  arrival wasn't unforeseen, Geralt. It was… inevitable. The Needle resonates with
  the dissonance within you – the applicator's cold logic, the dragon-spirit's fierce
  defiance, your own raw will. You are a walking anomaly." She tilted her head. "Now,
  choose. Stand here and let the vortex collapse, trapping that echo forever. Or step
  *into* the moment you wish to change. Face the Harbinger *within* the distortion.
  Learn temporal mechanics by fighting your own ghost."
