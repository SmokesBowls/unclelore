raw_quote: In the healer's cottage at the village's heart, Elyse Moorhaven tended
  to her morning rounds with the same gentle competence that had made her indispensable
  to the community for the better part of two decades. Her gray-streaked hair was
  bound back in a practical bun, her capable hands moved with the certainty born of
  thousands of similar mornings, but today something was different. The herbs in her
  garden seemed more potent, their fragrances more complex and meaningful. The simple
  salves and tinctures she prepared carried an efficacy that surprised even her experienced
  eye.
