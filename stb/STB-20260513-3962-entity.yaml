raw_quote: The fields that had fed Garden Grove for a century began to fail. The channels
  that had drained the marsh ran slower, the water darker, the fish fewer. The grove
  giants who had worked the land with the Nephoretti began to speak of changes in
  the highlands – snow that came earlier and stayed longer, game that had moved deeper
  into the mountains, winds that carried a cold they had not felt in living memory.
