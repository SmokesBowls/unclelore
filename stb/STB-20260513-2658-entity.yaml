raw_quote: Then she too was gone, her cloak's hem dissolving into the ozone-scented
  air where she'd stood. Geralt exhaled sharply—not at their departure, but at the
  *weight* of their message. Directions here weren't geography; they were living fractures
  in the Queen's porcelain reality. *North to go east.* He flexed his fingers, feeling
  the Guild's network hum in confirmation beneath his skin. Some paths only revealed
  themselves to those already broken enough to walk them.
