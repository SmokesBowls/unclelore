raw_quote: The child was sleeping, her fragment held open by the stone itself. The
  mason was limping, his body slowly giving ground to the cost of persistence. The
  Igigi in the drainage channel had stopped humming—not because the patrols had silenced
  her, but because the sustained tone in her throat had begun to ache, and the ache
  had spread to her chest, and she had paused to rest and found that the rest did
  not restore. The older singer in the grove had faltered twice during the vigil,
  her voice cracking on notes that should have been easy, the silence she had learned
  to hold for the lightning stretching longer than she intended.
