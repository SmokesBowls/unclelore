raw_quote: The wall that had been a crude barrier became a fortification, its stones
  shaped by generations of geomancy, its towers rising above the marsh. The shelters
  became houses, their walls carved with the history of the settlement, their roofs
  thatched with reeds from the delta. The outer complex became a district of its own,
  its wide streets and high ceilings built for giants and Nephoretti alike, its plazas
  filled with the sound of work‑songs and the deep harmonies of the grove.
