raw_quote: Silence returned, heavier now with the scent of blood and drake musk. Geralt
  stood panting, blade dripping. The stabilized anchors hummed, undisturbed. Kaelen
  stepped forward, her gaze sweeping the carcasses. "Acceptable," she stated. "You
  stabilized the moment *while* utilizing its structure as a weapon. The Needle remains
  secure." She turned her galactic eyes back to him. "But temporal stability attracts
  predators beyond beasts. This lesson is merely the primer. The Queen's hunters track
  chroniton anomalies." She gestured towards the distant horizon, where jagged peaks
  clawed at the sky. "We move. Now. Your next lesson requires higher ground... and
  deeper paradoxes." She walked towards the canyon wall, not waiting to see if he
  followed. Geralt wiped his blade on the drake's hide, the applicator coldly analyzing
  the kill, the armor pulsing warm satisfaction. Hands-on, dangerous, and far from
  over. He limped after her.
