raw_quote: Vale saw it from the final ridge—the terraces stepping down toward the
  water, the new walls rising where the old ones had been, the channels gleaming with
  vrill-light in the fading afternoon. The needle stood at the city's heart, its pulse
  steady and warm, its light a beacon that reached farther than it had before the
  Nexus points were built. The resonance of the labyrinth, extended through the anchors
  they had placed, had found its way back here. Strengthening what was already strong.
