raw_quote: The house became a waypoint. Not a base. Not a camp. A place where a body
  could pause before moving deeper. The old woman's presence made it safe—not because
  she guarded it, but because she had been there for decades, overlooked by the occupation
  as too old to be useful, too silent to be a threat. She was part of the city's furniture.
  The furniture was now a node in a network that did not know it was a network.
