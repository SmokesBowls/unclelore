raw_quote: The spire’s light intensified, swallowing Geralt whole. The sensation wasn't
  violent dissolution, but a swift, precise translation. The roar of fractured time
  faded instantly. Cold, damp air rushed in. The scent of ozone, burnt metal, and
  pine sap replaced the Nexus’s metallic tang. Solid ground slammed beneath his boots.
  He blinked against harsh, grey daylight filtering through shattered trees. He stood
  amidst the wreckage of his airship, twisted metal groaning softly in the mountain
  wind. The Star Needle spire – the very one Kaelen had first dragged him towards
  – pulsed faintly nearby, its chroniton signature now a clear, resonant beacon in
  his awareness. One anchor found. One known. Eight more needles hidden across the
  world, waiting. And somewhere on Earth, Luminaire. Geralt took a deep, steadying
  breath of real air. Alone. But armed. He turned his back on the wreckage and strode
  into the forest, the spire’s silent hum guiding his steps northward. The hunt for
  anchors – and answers – had truly begun.
