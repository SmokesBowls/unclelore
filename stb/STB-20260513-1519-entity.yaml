raw_quote: The oppressive stillness of the Echo Tower’s lowest archives pressed in
  like damp velvet. Geralt moved silently, Mika scanning the towering shelves laden
  with crystalline data-cubes and humming containment units. They needed weapons,
  supplies Zypher swore lay buried here. Dust motes danced in the pale light cast
  by Geralt’s Star Needle applicator. Suddenly, Mika hissed, hand flashing to her
  blade. A shadow detached itself from behind a monolithic server stack – not an attacker,
  but a familiar silhouette clad in dark, segmented armor that drank the light. Oreck.
