raw_quote: She placed it beside the tuber rind, which was still there, dried now,
  curled at the edges. She placed it beside the cloth, which was gone—the Igigi had
  taken it, was still carrying it, the coarse weave wrapped around her dredging hand.
  She placed it on the warm stone and pressed her palm over it for a moment, letting
  the warmth seep into the glaze, letting the glaze remember what it had been.
