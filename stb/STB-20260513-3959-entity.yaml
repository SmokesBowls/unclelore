raw_quote: Sera herself changed. The girl who had hummed in the darkness of the fissure
  became a woman whose voice could calm a flood or turn a giant from the boundary.
  She was the bridge between the two peoples, the one who could speak the language
  that was neither Nephoretti nor giant but something new. When she sang, the grove
  giants listened. When she spoke, the council heard.
