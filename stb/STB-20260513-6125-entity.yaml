raw_quote: The Igigi boy did not follow immediately. He had learned to read her movements—the
  pause before the decision, the way her weight shifted forward when she was about
  to move rather than retreat. He watched her step past the tile and into the dimness
  of the inner terrace, her body low, her feet finding the dead spots between the
  patrol sightlines the young giant had mapped. She moved like someone who had spent
  a year learning to be invisible. The occupation's instruments did not register her.
  She was not vrill. She was not thermal. She was a body in the cold, and the cold
  was still the occupation's baseline.
