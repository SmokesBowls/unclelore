raw_quote: The door wasn't a door—not in any conventional sense. It was more an absence
  where the mountain had forgotten to be solid, its edges fraying like torn vellum
  against the cliff face. Geralt's knuckles came away bloody from the first attempt;
  the stone didn't so much resist as fail to acknowledge the concept of "knocking"
  altogether. Behind him, Kulla sniffed at the mineral deposits clotting the faux
  threshold. "Bad hinges," he muttered, kneading his barnacle-armored forearm absently.
