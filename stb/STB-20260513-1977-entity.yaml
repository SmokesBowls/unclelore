raw_quote: Geralt sat apart, as usual, but this time he closed his eyes and dove inward,
  following the steady, dark-blue pulse that had become his new center of gravity.
  He found himself not in a void, but in a space of pure, structured resonance. It
  looked like the interior of a vast, dark crystal, shot through with flowing lines
  of silver and gold—the echoes of her Sound, the fading memory of her Light. At the
  center hung the Anchor, no longer a mere pulse, but a complex, slowly spinning sigil
  of profound stability.
