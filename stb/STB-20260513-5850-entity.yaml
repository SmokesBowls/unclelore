raw_quote: Zephyr didn't say anything. He simply looked at Vale—really looked—with
  those dark Igigi eyes that had measured galaxies before they'd learned to see people.
  Then he turned and walked into the water.  One moment his boots were sinking into
  wet sand, the next he was knee-deep in the shimmering current, the metallic streaks
  in the water licking at his patched robes like hungry tongues of liquid light. Vale
  stood rigid at the shoreline, his form flickering wildly—not with instability, but
  with the effort of holding himself together.
