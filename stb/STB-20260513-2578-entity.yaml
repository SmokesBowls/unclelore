raw_quote: Then Vaelthanebanked hard left, his spinal ridges slicing Geralt's palms
  open as they narrowly avoided a coordinated strike from three Vasthril. The crimson
  dragon didn't retaliate. He laughed. The sound cracked lunar regolith three miles
