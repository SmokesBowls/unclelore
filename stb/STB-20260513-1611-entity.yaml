raw_quote: The ancient Igigi peered at Geralt over a complex chroniton lattice he
  was weaving around the sapphire cylinder. "Transparency? Ha! Not transparency, Commander!
  Potential!" Zypher’s eyes sparkled with manic glee. "Those aren't gems *yet*. They're
  Affinity Cores – solidified manifestations of the dominant resonance each soul naturally
  attuned to *during* their Remission crucible. Think of them as... soul-lenses focusing
  primordial energies!" He gestured wildly. "The true definition? Ahhhh! That's the
  beauty! It crystallizes *upon* awakening, shaped by their first conscious act, their
  intent, their deepest self reborn!" He tapped the crimson cylinder swirling violently.
  "Red *could* be Warrior-Fury incarnate... or perhaps Forge-Mastery bending metal
  with a thought! Or... ah!" He grinned, "Pure Pyrokinesis? Depends entirely on *who*
  Orell is when he steps out!" He pointed to the emerald core, pulsing steadily. "Green?
  Could be Verdant Life-Healing... or Earth-Shaping command... or even Poison-Synergy!
  The metaphysics are... delightfully chaotic! The color hints at the *domain*, but
  the *expression*? Pure, glorious individuality!"
