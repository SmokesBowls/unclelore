raw_quote: The Nephoretti who had sung the Keeper awake were singing still. Their
  voices rose from the fields and the channels and the workshops, weaving through
  the city's rhythm like threads of light. The songs had changed—they carried new
  notes now, harmonies that had been learned in the labyrinth, frequencies that matched
  the resonance of the Nexus points. But the heart of them was the same. The stubborn,
  patient love of a people who had refused to stop singing, even when they did not
  know if anyone was listening.
