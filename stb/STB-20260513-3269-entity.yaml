raw_quote: The Igigi heritage was unmistakable—the stone-like solidity that spoke
  of beings older than mountains, the geometric patterns that flowed across his skin
  like living mathematics, the eyes that held depths measured not in years but in
  cosmic epochs. Yet there was also something else, something that spoke of transformation
  beyond his original nature. This was no ordinary Igigi, but one who had transcended
  the limitations of his kind through will, wisdom, and the patient accumulation of
  power that came from serving forces greater than himself.
