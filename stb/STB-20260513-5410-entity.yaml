raw_quote: The group was smaller than Vale had expected—not the full council, not
  a delegation. Five Nephoretti, their oldest leading. Enlil and Nammu, the Igigi
  mathematician and the one who had learned to listen. Brak and Keth, the mountain
  and the storm, carrying nothing but their null-pressure and the patience of stone.
  Sera, her hands still carrying the memory of channels. Zephyr, walking at the rear,
  his sandals scraping the ancient rock, his fingers pressed together.
