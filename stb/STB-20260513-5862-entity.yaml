raw_quote: Vale paused beside a fallen monolith, its surface veined with luminous
  moss the color of bruised plums. He pressed his palm to the stone, not to steady
  himself, but to listen. Beneath the corruption's oily whisper, the stone still sang
  its slow, patient song. The same song Brak had hummed. The same song that meant
  waiting, not mourning.
