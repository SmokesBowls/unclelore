raw_quote: A Nephoretti singer—not the older one, but a younger woman who had been
  born in the dark and learned to sing under Mora's students—began walking the path
  at midday. She carried nothing. She sang nothing. She simply walked to the wall
  and back, her feet finding the stone ribs without looking, her throat humming a
  tone that was now less than an eighth-step from the old First Shore baseline. The
  warmth was strongest when she hummed. The path was easiest when she walked. She
  did not know why. She did not ask.
