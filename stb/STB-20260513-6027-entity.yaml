raw_quote: Igigi-Seven was assigned to the outer channel dredging. He worked in the
  cold water up to his chest, his long arms dragging silt from the clogged vrill veins
  the occupation had never learned to maintain. The water was cold. His palm, where
  it had pressed against the iron grating, remained warm. One degree above body temperature.
  The water did not cool it. The handlers did not measure it. The Igigi dredging beside
  him noticed. They said nothing.
