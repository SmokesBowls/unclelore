raw_quote: The fire was the last insult. Geralt doused it with their remaining water—a
  hissing protest of steam—only for flames to lick back to life the moment his back
  turned. Not embers. Not sparks. Full defiance, as if the universe had decided combustion
  was mandatory. Kulla stomped on it with one clay foot, grinding the coals into the
  damp earth. The fire gasped, died, then reignited in his footprint.
