raw_quote: Suddenly, the rock beneath Geralt’s boot dissolved. Not crumbled – *flowed*.
  The ledge liquefied into swirling vapour. He pitched sideways into thin air. Jorik
  yelled, grabbing futilely. The mountain itself was rejecting them. Geralt plummeted
  – then slammed onto an invisible platform of solidified mist. It shimmered beneath
  him, icy cold. Looking up, he saw Jorik frozen mid-reach, suspended on another disc
  of cloud-stone. Before them, impossibly tall, stood Althurion, First Speaker. His
  skin held the blue-white sheen of glacial ice, his eyes the pale, infinite expanse
  of a winter sky. Tendrils of cloud wreathed his form. He didn't speak; the harmonics
  emerged directly from the vibrating air itself, deep and resonant, making Geralt’s
  bones hum. **"Trespassers."** The word wasn't accusation, merely fact. **"You wear
  stolen fire. You climb with violence. You disturb the Aetherhold's song."** His
  gaze, ancient and utterly alien, locked onto Geralt’s armor, then flicked to Jorik’s
  bow. The mountain’s disapproval solidified into crushing pressure. Geralt felt the
  Neferati’s subtle influence fraying like old rope. This was raw Giantsong, unmediated.
