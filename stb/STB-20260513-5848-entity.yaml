raw_quote: Zephyr didn't speak. He simply turned his palm upward, catching a single
  drop of seawater that had flicked onto his wrist from the pulsing tide. The droplet
  balanced there for a heartbeat—refracting the last of the sunset in its curve—before
  he flicked it away with a motion too precise to be casual. Vale recognized that
  gesture. It was the same one Zephyr used when clearing his abacus after a complex
  calculation.
