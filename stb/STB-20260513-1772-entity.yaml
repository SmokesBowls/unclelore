raw_quote: 'Silence. Geralt stood on obsidian glass fused by his own power. Legionnaires
  stared, shields dark, lances lowered. Below, the lake flowed clear. Healing. Luminara’s
  voice hummed through Geralt’s shattered armor: *"Anchor established. Transit protocols
  initiated."* Mika touched the liquid—not teal, but silver. "She’s mapping coordinates."
  Lyra collapsed, her rig humming as it repaired itself. "Integration complete. The
  null state… she didn’t hide. She synchronized." Halvar flexed his hand—no trace
  of decay. Oreck scanned the horizon. Chroniton sight showed branching paths: Mars,
  scarred and waiting; Dragon Nebula, shimmering beyond time. The storm hadn’t ended.
  It had shifted.'
