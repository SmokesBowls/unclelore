raw_quote: The first day was quiet. Not peaceful—quiet, the way a held breath is quiet.
  Vale noticed the absence of Zephyr's footsteps, the missing weight of his voice,
  the way the reeds didn't snap back quite as quickly without Zephyr's fingers testing
  their tension. He catalogued these absences with the same precision he had once
  used to measure void harmonics in the Spire. A missing frequency here. A dampened
  resonance there.
