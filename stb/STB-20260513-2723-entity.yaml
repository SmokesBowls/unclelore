raw_quote: '"You''ve recorded storms," Geralt said, his voice low enough that the
  guild''s acoustics strained to catch it. "But have you ever stood in one?" He lifted
  his left hand, palm up. The Applicator''s scorched core pulsed once, and the hovering
  shards rearranged themselves—no longer displaying images, but *names*. They flickered
  too fast to read, a cascade of titles and epithets, until finally settling into
  a single word, etched in silvered scars across his palm: *Geralt*.'
