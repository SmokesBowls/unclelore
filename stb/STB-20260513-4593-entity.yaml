raw_quote: 'Vale didn''t move. A beat. Another. Then the distortion deepened—just
  for a moment. The stone beneath it shifted, not breaking, but compressing, like
  weight pressing down where nothing visible stood. Then gone. Vale stepped—but not
  where he had been about to. He shifted slightly to the left. Placed his foot on
  solid stone. Nothing happened. He continued. The Igigi watched the spot they had
  passed. Then: "Better." That was all.'
