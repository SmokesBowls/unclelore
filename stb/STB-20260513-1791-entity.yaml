raw_quote: 'The core nexus beckoned—a pulsing heart of corrupted crystal deep within
  the spire’s base. Lyra’s rig spat diagnostics onto the sand: "Harmonic dissonance
  peaking—threshold in eighteen seconds!" Geralt plunged his gauntlet into the fracture.
  Luminara’s agony seared his nerves—but beneath the violet decay, her true song fought.
  Pure. Golden. Desperate for release. "Pour it into her!" Geralt commanded. Oreck
  channeled chroniton stability through the lattice. Mika’s shieldbearers amplified
  Luminaire’s fading pulse. Halvar roared as his blade glowed white-hot, severing
  corrupted energy tendrils anchoring the decay. The Legion became a single instrument.
  Five hundred souls resonating with one purpose: cleanse the anchor. Free the Keeper.
  Go home.'
