raw_quote: Brak stood at the western channel, forty feet of moss-draped stone and
  old scar tissue. Once, he would have driven his shoulder into a displaced monolith
  and forced it home. Now, he knelt. His massive hands, each the size of a wagon,
  rested lightly on the bedrock. He listened. The stone hummed a tired, grinding note—vrill
  channels clogged, resonance sapped by centuries of forced realignment. He did not
  push. He pressed. A slow, steady transfer of mass. The stone yielded, not from force,
  but from recognition. The channel settled. Brak exhaled, a sound like wind through
  a canyon, and moved to the next fracture.
