raw_quote: Lyra’s bio-scanner flared crimson. Anunnaki signatures surged—not distant.
  Converging. "Seven minutes!" she yelled. The sand hardened beneath Geralt’s boots.
  Silver light bled from cracks, forming a vast sigil—a dragon coiled around a spire.
  Anchor points. Transit paths. "Formation Rho!" Geralt roared. Legionnaires locked
  shields. Oreck planted chroniton arrows at each node. Halvar gripped his blade,
  knuckles white. Torren limped forward, ichor-stained bandage taut. "For Ironspire!"
  The cry rose. Brittle. Defiant. Sand fused into obsidian beneath them. Static hummed
  in teeth and bone.
