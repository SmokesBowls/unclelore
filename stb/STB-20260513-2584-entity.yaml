raw_quote: Geralt flexed his hands, raw from gripping dragon spines. Eight minutes
  borrowed from a black hole's event horizon. Eight minutes to decide. "I've fought
  in the cracks between your wars for decades," he said. The numbness in his chest
  didn't waver. "I've held timelines together with my ribs as splints. If the Wise
  Ones have even one truth that can break Her frequency..." He looked up at Pyrocast's
  supernova eyes. "I'll take the bad news."
