raw_quote: But where Tran's relationship with the land was one of partnership—human
  will working in harmony with natural forces—Keen's connection ran deeper, into territories
  that had no names in the common tongue of farmers and merchants. When she knelt
  to examine the soil, she could feel its moods, its desires, its dreams. When she
  planted seeds, she whispered to them in words she'd never been taught, words that
  seemed to rise from some deep well of instinct. When she walked the boundaries of
  the fields at dawn and dusk, the very earth seemed to respond to her presence, drawing
  strength from her footsteps.
