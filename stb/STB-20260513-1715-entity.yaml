raw_quote: Below, Serpentor’s corpse twitched. Obsidian armor melted. Gold-black nexus
  fragments seeped into stone. Oreck staggered. "Primary node... underground... beneath
  the altar." Halvar grinned—blood on teeth. Legionnaires formed ranks. Shields locked.
  Mika raised her lance. Geralt nodded. Fight deeper. Cut deeper. Roots waited. Silence
  gathered. Thunder roared closer. Mist thickened. Rain began—acid-slick. The jungle
  watched. Legion marched. Down. Into darkness. Toward the heart. Oreck’s bow hummed.
  Emerald light bled through cracks. Earth trembled. Not in fear. In fury. The Garden
  awakened—and it remembered vengeance.
