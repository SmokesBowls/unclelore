raw_quote: The word landed like a stone in still water. The Igigi had no translation
  for it. The Nephoretti could not sing it. The swamp giants felt it as a wrongness
  in the deep current, a note that did not belong. But the cliff giants had seen it.
  One of them. Just one. Camouflaged as a boulder near the high crags, until it moved,
  and the world around it became less.
