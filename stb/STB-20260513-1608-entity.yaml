raw_quote: Geralt met his gaze, a silent acknowledgment passing between them. No words
  were needed for the shared crucible of the crash, the agonizing Remission. Zaron’s
  spirit within the dragon armor hummed a complex chord of kinship and wary respect.
  Oreck’s sheer presence radiated amplified power, a contained storm wrapped in obsidian
  scales and Anunnaki pursuit-tech. Without hesitation, Oreck shifted, the heavy thud
  of his armored boots echoing sharply as he took position half a step behind Geralt’s
  left shoulder, and a respectful pace behind Mika’s right. The formation snapped
  into place – Commander, Second Commander, and First Shield. Precisely as it had
  been during the desperate raids on slave pens, the frantic escapes through crumbling
  Anunnaki citadels. His scaled hand rested lightly on the hilt of a massive, newly
  forged cleaver hanging at his hip. He was home. He was ready. The Harbinger had
  one less advantage. The hunt gained its fiercest blade.
