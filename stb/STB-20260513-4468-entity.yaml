raw_quote: He did not hesitate. He hooked an arm under the Igigi's shoulders and began
  to pull. The weight was awkward—the body limp, the robes waterlogged. Vale kicked
  hard, angling toward the nearest shore. There was no current to help him now. The
  system had withdrawn. Behind him, the shimmer flickered once, then snapped back
  to its distant alignment. The pressure did not return. The silence became ordinary.
