raw_quote: Then the stranger moved. A twitch of the fingers, a shift of the head.
  Vale leaned forward, watching. The Igigi's eyelids fluttered but did not open. His
  mouth opened slightly, closed. His breathing deepened, caught, then steadied. Vale
  did not speak. He simply waited. The sun cleared the horizon. The light turned gold,
  then white. The stranger's breathing found a rhythm—slow, but even. He was waking.
