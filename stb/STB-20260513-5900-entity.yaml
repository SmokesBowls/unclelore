raw_quote: Sera felt it through the soles of her feet. The vrill threads woven into
  her wrists went taut, not with pain, but with warning. She stepped out of the marsh-side
  workshop, wiping clay from her hands, and looked north. The sky was clear. The sun
  held high. But the wind carried a new density—dry, mineral, edged with the scent
  of crushed limestone and distant snowmelt.
