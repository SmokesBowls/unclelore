raw_quote: '"Indeed." Zypher''s smile was a blade-slash of delight. He moved abruptly,
  his robe dissolving into mist as he circled Kulla—not walking, but *reappearing*
  at intervals like a spliced film reel. Each stop left behind a faint afterimage
  that hummed at a different frequency. "You should be impossible. Clay animated by
  will rather than spellwork. Structure that *chooses* its shape." His voice dropped
  to a whisper that raised the hairs on Geralt''s neck. "Tell me, mason—when you dream,
  do your bricks rebel?"'
