raw_quote: The path northward shifted dramatically. The choking dunes gave way to
  rocky plateaus, the air cooling as elevation climbed. Snow-capped peaks loomed in
  the distance—the first fingers of the Crescent Mountains. Scrubby trees, twisted
  but alive, dotted the landscape where groundwater seeped up through fractured stone.
  Sand yielded to gravel, then to packed earth strewn with hardy alpine grasses. The
  oppressive heat lifted, replaced by a wind carrying the scent of pine and distant
  ice. Geralt crested a ridge, muscles burning from the climb but lungs grateful for
  the cleaner air. Below, nestled in a sheltered valley bowl beside a rushing glacial
  stream, stood a small encampment. Sturdy hide tents clustered around a central fire
  pit. Sharpened stakes formed a defensive perimeter—overkill for such a remote location.
  Geralt counted eight figures moving with military precision among the tents. All
  wore patched leathers, but their movements spoke of Legion training.
