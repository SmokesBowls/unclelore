raw_quote: The final shield generator hissed into standby mode. Legionnaires shifted
  gear onto scaled reptilian pack-lizards newly acquired from spire traders. Mika’s
  chosen fireteam gathered near Trabin – Halvar, Torren, and three other grizzled
  faces, packs laden with shock-lances and spare power cells. Sahvant bowed stiffly
  towards Geralt, her earlier recklessness replaced by wary respect. "The Circle will
  analyze the resonator… cautiously," she promised. Her techs were already buzzing
  around Kael, who clutched the Sentinel core like a holy relic. Geralt gave one curt
  nod, his gaze already lifting towards the serpentine cleft leading into the Crescent
  Mountains’ shadowed embrace. The hunt pressed onward. The crevasse swallowed the
  column – five hundred souls moving single-file along an icy, wind-scoured path beneath
  cliffs glittering with embedded chroniton crystals. Above, snow swirled. Ahead,
  the vast, golden desolation of the Faraxar Desert shimmered under a merciless sun.
  Behind them, Ironspire Refuge receded, a lone spike guarded by borrowed steel, its
  fate now woven into theirs. The true crucible lay beyond the peaks.
