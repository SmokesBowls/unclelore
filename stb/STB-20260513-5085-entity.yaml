raw_quote: The eastern terrace was broken. Not destroyed—the wall still stood, the
  Nephoretti stonework holding against whatever had struck it—but scarred. Black scorch
  marks ran along the parapets. The channel gates were twisted, their vrill-light
  flickering weakly. And above it all, a thin column of smoke rose from the needle's
  base.
