raw_quote: The morning sun, struggling to pierce the shadow cast by Nibiru's approach,
  painted their diverging paths with light that seemed to carry blessings and warnings
  in equal measure. Where Keen and Isla walked toward Ironspire, the light took on
  a crystalline quality that made technological surfaces gleam with cold efficiency.
  Where Tran and Viên followed the geometric channels, the same light warmed to gold
  and copper, picking out ancient symbols carved into stone that had been invisible
  moments before.
