raw_quote: They sat for a while longer. The sun lowered, the light turning orange.
  Then Vale stood. "We should move." The Igigi stood with him. He tested his sandals,
  flexed his toes, then nodded. They walked. The silence returned, but it was different
  now. Both of them knew something about the other. Neither pressed. The path west
  stretched ahead, empty and ordinary. The sky darkened. The stars came out. And behind
  them, the east held its secrets for another night.
