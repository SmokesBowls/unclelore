raw_quote: The climb became brutal. Handholds vanished, replaced by slick ice. Chroniton
  winds screamed, trying to peel them from the rock face. Jorik moved like a mountain
  goat, finding purchase where Geralt saw none. Then came the cry – sharp, piercing,
  echoing off the cliffs. Three sleek, scaled shapes detached from a higher ledge,
  plummeting towards them. *Ice Drakes*. Faster than thought, Jorik planted his feet
  on a narrow ledge, nocked an arrow, and drew the massive horn bow in one fluid motion.
  The sinew groaned. He sighted, exhaled, and released. The arrow blurred, striking
  the lead drake squarely in the throat. It shrieked, plummeting past them. Before
  the others could react, Jorik had another arrow nocked, fired, striking the second
  drake's wing joint. It spiraled away, shrieking. The third hesitated. Geralt drew
  his blade, but Jorik's third arrow took it through the eye. Silence crashed back,
  broken only by the wind. Jorik lowered the bow, breathing hard, a savage grin briefly
  touching his lips. "Told you it drew heavy," he rasped. Geralt stared at the falling
  shapes. "Hell of a bowman," he acknowledged. They climbed higher. The mist parted
  briefly, revealing a colossal cave mouth high above – the Giant's threshold. The
  Giants knew they were coming. They also knew Jorik could shoot. The path narrowed.
  Mika felt closer than ever.
