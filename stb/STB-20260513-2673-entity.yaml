raw_quote: Geralt exhaled through his teeth. A single drop of water fell from his
  canteen—the one he'd stabilized during Kaelen's training. It hung in the air, perfectly
  inelastic, as the Five Mikas had taught him. The lead horseman's head cocked at
  an impossible angle, his neck vertebrae clicking like beads on a string. "You persist,"
  he observed, as if commenting on a mildly interesting fungus. "How mortal."
