raw_quote: The camp was spare but efficient. Smoked meat hung near the fire pit; sharpened
  stakes ringed the tents. Sella gestured Geralt towards a hide stool near the flames.
  "Found this cleft months back," she explained, pouring bitter kaff from a dented
  pot. "Good water. Few predators big enough to threaten us." She nodded towards the
  peaks looming above. "The Giants pass higher. We stay low." Geralt noted the tension
  coiled beneath her calm. "Hunted?" Sella’s eyes hardened. "Not beasts. Raiders.
  From the lowlands. They sniffed us out last moon-cycle. Took two." She spat into
  the fire. "We retrieved one. Buried him yesterday."
