raw_quote: When she rose, she left a second thing. Not a cloth—she had no more cloth.
  A twist of dried tuber, the pale flesh wrapped in a strip of reed-fiber, the kind
  of cache the Igigi had been placing along the path for weeks. She had found one
  of the caches near the eastern wall, on her second walk to the corridor. She had
  eaten half. She left the other half on the warm stone where the cloth had been.
