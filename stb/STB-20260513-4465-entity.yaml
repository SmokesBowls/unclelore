raw_quote: He reached the shape. It was a body. Floating face-up, arms loose, robes
  tangled in the current. The head was elongated, the proportions familiar—the same
  general physiology he had seen in the Igigi who had fallen from the sky centuries
  ago. But not like the ones he knew. This one wore a robe, not the structured gear
  of Enara's people. His posture was relaxed, collapsed—not the rigid control of the
  survivors from First Shore. And the water around him was wrong. Looser. Less aligned.
  As if the system did not fully agree with his presence.
