raw_quote: She had not been this far east since the evacuation. None of them had.
  The occupation patrols favored the old terrace roads, the high ground where the
  vrill channels used to run. The drowned channels were too deep for the reptilians
  to wade without submerging their instruments. Too tangled with root and silt for
  the dregans to patrol without fouling their wings. The survivors stayed deep in
  the grove because the deep grove was safe. The eastern edge was not safe.
