raw_quote: Vale shifted first—side step, low, controlled. The thing came through where
  he had been, striking ground instead of flesh. The impact cracked stone, but the
  cracks bent slightly, curving in ways that didn't follow the rock's grain. The Igigi
  didn't back away. He shifted angle, pulling its focus just enough. "Not yours,"
  he said, low. Vale already knew.
