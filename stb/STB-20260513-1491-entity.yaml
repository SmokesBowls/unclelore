raw_quote: Pain seared through him as the vortex resisted. Temporal shards sliced
  psychic feedback across his mind. He grounded himself in the image of the Whispering
  Stone's symbols, the Giants' own language of harmony. Slowly, agonizingly, he found
  a screaming frequency within the storm and answered it not with force, but with
  a counter-harmony of focused purpose. The vortex bucked violently. A sigil on the
  dais flickered out. Geralt poured more will into the weave, his vision blurring.
  He saw not just energy, but the potential Althurion warned of – timelines fracturing,
  knowledge devouring seekers. He channeled that understanding into his resonance,
  shaping the fury into a pulsing, contained sphere of ordered light atop the plinth.
  Silence fell abruptly, heavy and profound. The storm-light was now a calm, humming
  orb. Geralt swayed, blood trickling from his nose. The applicator's casing groaned.
  Althurion nodded once, a deep, resonant hum vibrating from his chest. **"Understanding
  witnessed."** He turned, leading them towards a towering archway carved from glacial
  ice. **"The Heartpeak awaits."**
