raw_quote: He stretched his twisted leg on the warm stone and let the ache settle
  into the background. The pain was still there—the warmth eased but did not repair—but
  the pain no longer seemed to matter in the same way. It was part of his body, and
  his body was part of the network, and the network was being held by something deeper
  than itself. The holding was not healing. It was acceptance, and the acceptance
  was a form of peace.
