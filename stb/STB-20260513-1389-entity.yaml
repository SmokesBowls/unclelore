raw_quote: Time thickened instantly. His descent felt agonizingly slow, like falling
  through syrup. Sounds stretched and warped – the drip of water became a deep, booming
  thud. He focused solely on his internal anchor, the blazing core of *self*. He landed
  beside Kaelen, the impact jarring despite the slowed time. Around them, dust motes
  hung suspended, frozen in the thick air. "Good," Kaelen acknowledged, a flicker
  of approval in her galactic eyes. "Maintain that anchor. Follow my path *exactly*.
  Deviate, and the drag intensifies." She began moving towards the central Spire,
  her steps deliberate, navigating a path only she could see through the temporal
  sludge. Geralt followed, each step a battle against the crushing weight of stagnant
  time, his anchor the only thing keeping him from freezing solid. The hunt continued,
  deeper into the sinkhole.
