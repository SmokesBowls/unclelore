raw_quote: Pyrocast's warning came half a second too late—Geralt's bones turned to
  liquid as the dragon inverted gravity beneath them. The moonlet vanished upwards
  while the nebula yawned below, its tendrils now a gaping maw of ionized mist. The
  first void wind hit like a sledgehammer of frozen mercury, nearly wrenching Geralt
  from Pyrocast's spines. He clung tighter, fingers locking into the grooves between
  scales that pulsed with ancient blood-magic. Around them, the other dragons banked
  hard—jade serpent coiling into a spring, tawny beast folding its wings into a bullet—as
  the stormfront swallowed them whole.
