raw_quote: The eastern terrace wall emerged from the marsh haze like a sleeper opening
  one eye. It was not the grand fortification it had been. The occupation had not
  repaired what the siege had broken. The outer facing was scarred, the mortar between
  the stones pried loose by two centuries of damp and neglect. The vrill-glass canopy
  that had once crowned the parapet was gone—shattered in the fall, or salvaged, or
  simply fallen. The wall was a ruin.
