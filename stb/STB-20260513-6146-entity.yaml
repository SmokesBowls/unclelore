raw_quote: The women did not stop him. The child watched from the corner where she
  had pressed her palm to the floor and felt the fragment rise in her throat. The
  mason had heard the fragment—not the sound, but the shape of it, the way it pressed
  against the air and almost resolved. He did not know what it meant. He did not know
  it was the same fragment the Igigi were carrying through the channels and the quarantine
  pens and the chimney corner. He only knew that the child had made a sound that meant
  something was returning, and his leg had stopped hurting the same day, and the floor
  was warm.
