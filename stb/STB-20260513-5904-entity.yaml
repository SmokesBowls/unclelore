raw_quote: The Nexus points could not be left unattended. Not with the Cliff Giants
  holding the northern anchor, not with the Shadow’s approach written in the tired
  stone. First Shore split its strength. Half the grove tended the terraces. Half
  the Igigi mapped the southern fractures. The Nephoretti rotated song-cycles, never
  letting the baseline drop below the threshold of awareness. Guard duty became ritual.
  Brak’s rotation at the western gate. Keth’s watch over the eastern channels. Mora’s
  vigil at the needle’s threshold. They did not stand with weapons. They stood with
  presence. Weight. Attention.
