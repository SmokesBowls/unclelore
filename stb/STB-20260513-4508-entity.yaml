raw_quote: They reached a stretch where the rock was broken—a field of jagged shards,
  black and glassy, left by an old flow. Vale stopped. The Igigi stopped behind him.
  "This will cut you," Vale said. He pointed to a narrow path along the edge, where
  the shards gave way to packed ash. "Go that way." The Igigi looked at the path,
  then at his bare feet. He nodded. He stepped onto the ash. It was softer, easier.
  His pace picked up. Vale waited until the Igigi was past the worst of it, then followed.
  He did not say anything else.
