raw_quote: Kyh’s laughter hit the clearing like a glass shattering—sharp, sudden,
  and wrong enough that even the bioluminescent fungi recoiled. She came awake mid-cackle,
  her silver-threaded shadow writhing as if trying to strangle the sound. The scaled
  boy perched on Oreck’s shoulders clapped his claws over his ears, hissing. Geralt
  didn’t flinch. He’d spent the last three hours explaining causality loops to reptilian
  warriors using nothing but a stick and the charred remains of their campfire, and
  frankly, insanity was a welcome palate cleanser.
