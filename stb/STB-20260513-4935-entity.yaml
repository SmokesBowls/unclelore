raw_quote: Vale returned to the lower terrace as the morning light broke grey and
  salt-thick over the water. The basalt capstone sat exactly where the Nephoretti
  had settled it—true, seated, the crack at its corner no wider than a hair. The vrill
  pool beneath it had dissipated, leaving only a faint shimmer in the stone's grain,
  like a memory of warmth.
