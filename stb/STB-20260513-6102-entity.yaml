raw_quote: He was dredging silt. The work was the same work. The silt was the same
  silt. The channel was colder here, further from the grove, further from the path,
  further from the wall where Ember had pressed her palm and found the stone waiting.
  He had not been to the wall. He had not walked the path. He was an Igigi assigned
  to the southern labor camp, and his movements were tracked, and his compliance scores
  were within tolerance, and his half-second delay had never deviated.
