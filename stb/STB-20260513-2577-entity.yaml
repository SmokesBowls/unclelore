raw_quote: Kyh's shadow-form flickered like bad reception across Geralt's HUD. She
  wasn't speaking—she was resonating, her frequency tuned to the gaps between Pyrocast's
  wingbeats. "The Queen's harmonics—" her voice phased in and out "—are fracturing
  under dragonfire but..." A Vasthril lashed through her spectral form, its segmented
  body momentarily warping into the shape of a whip before disintegrating. Oreck's
  answering snarl wasn't audible over the battlefield's cacophony, but Geralt felt
  it in his molars—a subsonic growl that made the Dragon Mail's joints lock in primal
  recognition.
