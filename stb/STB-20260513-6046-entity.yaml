raw_quote: No one had ordered it placed there. No one had asked. An Igigi woman—the
  same one who had pressed her palm to the cold pen floor during the quarantine—had
  carried the cache from the grove's stores, one bundle at a time, over three nights.
  She had told no one. The Igigi did not speak. But she had felt the warmth through
  the stone of the quarantine pen, and she had felt it again when her work detail
  passed near the channel, and she had understood, without language, without plan,
  that the warmth was a direction and the direction would need supplies.
