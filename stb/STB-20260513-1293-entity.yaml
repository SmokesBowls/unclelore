raw_quote: 'The chroniton weave wasn’t fraying; it was dissolving. Geralt felt the
  Spire’s corrupted core actively *sucking* stability from the valley below. Millions
  of shimmering threads were snapping, dissolving into chaotic static. He couldn’t
  reinforce individual points; he had to counter the Spire’s pull. Kaelen stood beside
  him, a pillar of stillness. "The Spire is the source. Its corruption creates the
  decay field. You must stabilize *it* first. Feel its anchor points. They’re poisoned."
  Geralt focused inward, past the applicator’s panic and the armor’s fire. He sensed
  the Spire’s anchors: deep roots fused to the glacier bedrock, but vibrating with
  the Queen’s dissonant energy. "It’s… rejecting stability," he gasped. "Like oil
  on water." Kaelen nodded sharply. "Exactly. You must purge the corruption *from*
  the anchor points, then reinforce them with your own stabilized signature. Your
  tripartite harmony is the solvent."'
