raw_quote: She did not name the resentment. She woke that morning in the grove, ate
  a dried tuber from the cache, listened to the Nephoretti singing a quarter-step
  sharper than yesterday, and knew she would cross. Not because she planned to. Because
  she was already walking, and the path was already there, and the wall was already
  waiting. The decision had been made in her body before her mind caught up.
