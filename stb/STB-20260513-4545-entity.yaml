raw_quote: The following day again they walked. The terrain was open—packed ash, low
  scrub, an occasional outcrop of lava rock. The sea was a grey‑blue line to the south.
  The Igigi's sandals held. His pace matched Vale's. The leafbowl swung from his shoulder.
  No events. No tension. Just the rhythm of two people moving west. Vale led. The
  Igigi followed. The silence was ordinary.
