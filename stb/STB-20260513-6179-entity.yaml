raw_quote: In the chimney house, the old Igigi woman felt the shift. The warmth in
  the chimney stone deepened in the north—the dampener's push—and thinned briefly
  in the south—the field drop—and the difference traveled through the stone like a
  ripple through still water. She did not know what had caused it. She only knew the
  warmth was no longer stationary. It was moving, adjusting, compensating for something
  the occupation had done. The center was not just holding. It was responding.
