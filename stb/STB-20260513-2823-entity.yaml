raw_quote: Both Tran and Keen began running toward the village, their farming tools
  forgotten, their minds focused only on reaching their friends and neighbors. As
  they ran, the shadow overhead completed its advance, plunging the entire valley
  into an darkness so profound that the boundary between day and night seemed to have
  been erased. In that unnatural twilight, illuminated only by the strange, shifting
  glow of the Star Needle, they saw sights that would be burned into their memories
  forever.
