raw_quote: Time had dissolved into rhythm. Not the rhythm of days, but of weight,
  of song, of stone meeting stone. The Cliff Giants pressed in fractured waves, their
  basalt armor scarred, their null-pressure relentless. First Shore did not meet them
  with equal force. They met them with geometry. With layered terraces that absorbed
  impact. With vrill channels that redirected tremors into the deep bedrock. With
  song that asked the mortar to hold, and with giants who had learned how to stand
  without breaking. The swamp and grove lines interlocked, their resonance braided,
  their mass distributed. The defense held. But holding is not without cost. The outer
  walls bore new fractures. The channels ran thick with displaced silt and crushed
  vrill-seed. And between the terraces, where the stone had been forced to bear too
  much, lay the quiet weight of those who had fallen. Swamp giants. Grove giants.
  Cliff cousins. Nephoretti voices stilled. Igigi slates left open to the damp. Each
  side had paid. The ledger was written in silence.
