raw_quote: Their forms were unmistakably of Anunnaki manufacture—the too-perfect symmetry,
  the consciousness-signatures that hummed with artificial genesis, the purposeful,
  un-natural grace with which they navigated the complex currents. Yet, the reports
  from the mountain and desert fronts spoke of relentless, single-minded aggressors.
  These creatures... drifted. They moved in small pods of five or seven, their smooth,
  pale skin reflecting the dappled light filtering through the reef. They did not
  assume attack formations. They did not brandish the psychic violence of the Dregans
  or the grim inevitability of the Gruulith. They simply... observed.
