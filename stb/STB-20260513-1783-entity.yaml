raw_quote: The sky tore open. Reality rippled like heat haze over a forge. Massive
  silhouettes glided across the Martian stars—not ships, but **living eclipses**.
  Wings blotted out Deimos. Scales caught the light of Phobos, glittering with crimson
  fire and nebular gold. Vaelros descended. A roar unheard in vacuum shook the regolith
  beneath Geralt’s boots. Beside him, VALDRASIL units phased into existence. Serpentine
  forms flickered between crystalline matter and emerald energy, executing impossible
  turns. Their jittering movements left afterimages—ghostly shimmers clawing at the
  mind. One VALDRASIL streaked toward a bronze dragon, scales catching a dying sun’s
  fury. Impossible. Terrifying. Silence screamed louder than battle cries. Legionnaires
  froze. Halvar’s grip loosened on his blade.
