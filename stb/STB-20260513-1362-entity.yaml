raw_quote: The plaza flickered. Ghost-images of Sully kneeling overlapped. The cycle
  was nearing its end. Geralt pressed. "Say her name. Not as loss. As joy." Sully
  took a shuddering breath. "Katherine," she whispered. Then louder, defiant. "Katherine!"
  Her voice cracked the stillness. The stone carving seemed to vibrate. A faint, golden
  light – Katherine's favorite sun-warmth – pulsed from the stone kits. The ghost-images
  snapped away. The oppressive weight lifted. Sully gasped, looking around as if seeing
  the settlement for the first time. "I... remember everything." The chroniton shard
  on Geralt's chest flared brightly, then dissolved. The loop was broken.
