raw_quote: Vale did not answer immediately. He was watching the smoke, the way it
  rose straight in the still air, the way it spoke of warmth and shelter and people
  who had kept the fire burning while he walked into the east. He had not known, when
  he left, if he would return. He had not known what he would find if he did.
