raw_quote: At the village forge, Rowan Ironwright had been up since before dawn, as
  was his custom, his hammer ringing against his anvil in the steady rhythm that served
  as an unofficial timekeeper for the entire community. But today, as he shaped red-hot
  metal with practiced strokes, he noticed that his work seemed to flow more easily
  than usual. The iron responded to his hammer with unusual malleability, as if the
  metal itself were eager to take the shapes he envisioned. The fire in his forge
  burned hotter and cleaner, and more than once he could have sworn he saw patterns
  in the flames—geometric designs that reminded him of the ever-shifting inscriptions
  on the distant Star Needle.
