raw_quote: Tran looked up from his own work, and for a moment their eyes met across
  the field of grain. In that instant, something passed between them—not words or
  thoughts, but a recognition that ran deeper than consciousness. Both of them carried
  the legacy of powers beyond imagination sleeping in their blood. Both of them stood
  on the threshold of awakening to destinies that would reshape the very fabric of
  reality. And both of them, in that golden morning moment, felt the first stirrings
  of the forces that would soon tear their peaceful world apart and forge them into
  legends.
