raw_quote: The sky paled slowly, grey light bleeding over the water. Vale had not
  moved. His legs were stiff, his back sore, but the Igigi's breathing had deepened.
  The pulse was stronger. He checked again. Turned the body slightly. Pulled the robe
  higher. The face was still pale, but there was colour in the lips now—a faint flush
  of life returning. Vale sat back, watching the horizon. The system was gone. The
  shimmer was absent. He was just a man on a shore with a stranger who should not
  have been here. He did not know what came next. But the stranger was alive. And
  that was enough for now.
