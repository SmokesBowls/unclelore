raw_quote: 'It yielded like cold, thick oil. Mika plunged through, followed instantly
  by Oreck, Dren, and the wiry scout, Kael. Behind them, the army watched, frozen,
  as the mirror swallowed their commanders. The transition was instantaneous. One
  moment, the sterile obsidian chamber; the next, the desolate courtyard under that
  bruised, turbulent sky. The air crackled with latent energy, humming against Mika''s
  teeth. Zypher stood before them, calm as deep water. He inclined his head slightly.
  "Commander Mika. Oreck." His eyes lingered on Dren, a flicker of recognition – or
  perhaps sorrow – before settling back on Mika. "You demand explanation. Suffice
  it to say, Geralt is my friend. I commune with the Aeon Keepers through the Nephrati.
  They foresaw Geralt''s strength. I was there when the Council gifted him the armor."
  His voice was low, resonant, carrying effortlessly over the ambient hum. "Finding
  his five loyal followers confirmed what I feared: Geralt wasn''t with them. He''d
  already sacrificed himself to the temporal breach. So I saved what I could. I brought
  them *here*."'
