raw_quote: 'Geralt didn’t shout. He pointed. Oreck’s arrows flew—green chroniton trails
  cutting precise arcs. They struck three Needles simultaneously. Crystal shrieked.
  Violet light stuttered. Halvar charged—a silent avalanche of muscle and fury. His
  blade sliced through Reptilian spines before they turned. Shieldbearers surged forward,
  locking overlapping barriers as Igigi scattered in confusion. Mika’s lance became
  a conductor’s baton, directing Legionnaires to isolate each spire. Luminaire’s song
  surged through Geralt, pure and furious. He plunged his gauntlet into the corrupted
  Nexus pool. Cold fire raced up his arm—Anunnaki rot fighting Earth’s heartbeat.
  Black tendrils lashed, tearing at his soul. *"Pour it back!"* Luminaire cried. Geralt
  roared, pouring five hundred Legion souls’ harmonic will through the gauntlet. Gold
  light erupted, incinerating the darkness. The Needles shattered like glass. For
  a heartbeat, the Garden breathed free. Luminaire sighed: *"Anchor... held..."* But
  reptilian horns blared in the distance. The hunt was on.'
