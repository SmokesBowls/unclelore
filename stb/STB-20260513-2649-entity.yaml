raw_quote: Morning arrived like a blade between the ribs—sudden, efficient, leaving
  no time to mourn. They packed in silence. Geralt's canteen sloshed when he lifted
  it, half-empty from the night's ration. He set it down to adjust his gauntlet. When
  he picked it up again, the metal seared his palm with frost, moisture beading along
  the brim. Full. Kyh's silver-threaded shadow pulsed once in alarm. Kulla sniffed
  the air. "Time's cracked here," the golem observed, as casually as commenting on
  bad mortar.
