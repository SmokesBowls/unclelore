raw_quote: Suddenly, the oppressive rock walls fell away. Mika staggered, blinking
  against harsh, unfiltered light. The cool, metallic stench of the wreckage vanished,
  replaced by dry, sterile heat. She stood on a barren plateau under a bruised sky,
  surrounded by jagged ridges of crimson rock that clawed at the horizon like broken
  teeth. Wind, hot and abrasive, scoured the dust, carrying the faint, metallic tang
  of distant ozone. Silence roared here, louder than the fissure’s whispers. Where
  was the tower? Where was her army? Panic flared – she’d wandered far beyond safety,
  lured deeper than she realized. This desolate expanse felt alien, wrong. Yet… a
  faint tremor in the air, a low hum vibrating through the soles of her boots, pulsed
  from somewhere ahead, beyond the nearest ridge. Power. Ancient power. Echo Tower.
  And Geralt? Her gaze swept the desolation, heart hammering against her ribs. Nothing
  moved but dust devils swirling in the distance.
