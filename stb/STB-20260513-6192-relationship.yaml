raw_quote: The weaver leaves a third object in the corridor—not cloth, not food, but
  a small piece of fired clay she found in the workshop rubble, a fragment of an old
  First Shore tile with a partial glaze pattern still visible. She doesn’t know why
  she leaves it. It’s not useful. It’s old. It belongs to the stone, and she returns
  it.
