raw_quote: The lightning struck. The pulse entered a system already saturated with
  forced coherence, and the addition of the lightning—the one constant that had never
  failed, the 47-minute metronome that had always been separate from the network's
  internal rhythms—was like a stone dropped into an overfilled vessel. The surge ebbed.
  The alignment fractured, not gradually but immediately, the forced lock shattering
  into its component pieces. The fragments separated. The doubled tones returned.
  The corridor's heat dropped back to its steady one degree above ambient. The singer's
  voice returned to her. The Igigi's hum split back into two frequencies. The old
  woman's throat closed, and the name retreated into her chest, whole and silent and
  unspoken.
