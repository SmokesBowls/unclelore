raw_quote: The syllable did not complete. It would not complete for a long time. The
  name was too heavy. The thread was too frayed. The occupation was still watching,
  still measuring, still certain that the Igigi were broken. But the syllable had
  been spoken. The stone had carried it. The warmth had received it, and in the chamber
  at the center of the sealed zone, the stone remembered the name.
