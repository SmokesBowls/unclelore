raw_quote: On the fifth day, Torren's son waded the eastern channel again. This time,
  he carried a stone. Not a small stone. A slab of marsh granite, rough-hewn, the
  size of a Nephoretti dwelling. He had pulled it from the submerged terrace, the
  old boundary his father had helped lay, and he carried it now toward the eastern
  wall. He did not know why. The warmth was thicker near the wall. The stone felt
  lighter in his hands than it should. He placed the slab at the base of the wall,
  beside the place where Ember had pressed her palm, and he stood there for a long
  moment, his massive shoulders blocking the dim amber light, his breath slow and
  steady.
