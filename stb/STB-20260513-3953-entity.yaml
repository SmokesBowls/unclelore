raw_quote: But the song was never perfect. The grove giants’ voices were too deep
  for some words, too slow for others. And the Nephoretti – all but Sera – could only
  catch fragments of meaning when the giants sang among themselves. It was enough
  to know danger from peace, enough to coordinate the watches, enough to share the
  work of building. But the deep conversations, the songs that told of the highlands
  and the war, the melodies that carried the history of their kind – those remained
  just beyond reach.
