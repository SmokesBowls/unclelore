raw_quote: Vale met his gaze. He did not look away. He did not explain. "Not entirely,"
  he said. That was all. The Igigi held his eyes for a moment. Then he nodded—a small,
  slow dip of the head. Not understanding. Acceptance. He looked back at the horizon.
  His face was calm. "Alright," he said. Quiet. Almost to himself.
