raw_quote: Tran's feet tore furrows through the dirt as he lunged, scythe raised.
  The fire in his chest surged into his arms, making his grip ache, the wooden shaft
  hot enough to sear his palms. The reptilian's head swiveled toward him—a predator
  recognizing another predator—and in that flash of recognition, Tran swung too soon.
