raw_quote: Vale stood at the edge of what had been the eastern wall, his feet on stone
  that had been carved by the flood and reshaped by hands that had learned to build
  with water instead of against it. The island that had been the Ma'at ’s summit rose
  a mile to the south, its terraces now green with the first planting since the flood.
  The needle stood behind him, its pulse steady, its light a beacon that reached farther
  than it ever had.
