raw_quote: But perhaps more significant than these obvious displays of power were
  the smaller, subtler ways their abilities manifested. Tran found that his presence
  alone seemed to strengthen the resolve of those around him, as if the fire in his
  blood could kindle similar flames in others. Keen discovered that her expanded awareness
  allowed her to anticipate problems before they became critical, to guide the column
  around dangers that would have otherwise caused delays or casualties. And Viên's
  compassionate nature seemed to radiate calm and hope, helping people find the emotional
  resources they needed to keep moving forward despite the magnitude of what they
  had lost.
