raw_quote: She had walked the path three more times since her first crossing. Each
  time, she went further. The first return, she had touched the wall. The second,
  she had walked its eastern length, mapping the breaches, noting where the occupation
  had repaired the stone with cold mortar and where the old First Shore masonry still
  held. The third, she had climbed the fallen vrill-glass canopy at the southeastern
  corner and looked into the city.
