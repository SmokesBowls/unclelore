raw_quote: The massive reptilian warrior emerged slowly, his movements unnervingly
  silent despite his bulk. The faint green arrows pulsing softly on his armored greaves
  illuminated the grime-streaked floor beneath him. His scaled face, usually fierce
  and expressive, held a profound stillness. Recognition flared in his deep-set eyes
  – amber irises now flecked with unsettling pinpricks of chroniton blue. He inclined
  his horned head, the gesture heavy with ancient loyalty… and something else. A stillness
  that hadn’t been there before. "Commander," Oreck rumbled, his voice a low vibration
  that resonated deep in Geralt’s bones. It was his voice, yet layered with echoes,
  like stones grinding deep in the earth. The faint arrows on his greaves flickered,
  pointing unerringly towards Geralt, then Mika.
