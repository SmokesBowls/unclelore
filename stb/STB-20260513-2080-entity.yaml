raw_quote: It was not a valley of green or life. It was a colossal, circular sinkhole,
  ten miles across, its walls sheer and dark. At its very center, rising like the
  infected spine of the planet itself, was the Hub Needle. It was not like the others.
  It was thicker, darker, layered like some grotesque crystal growth. Pulsing, sickly
  green light—the pure, undiluted Vrill-drain of a continent—throbbed within its core,
  illuminating the valley in nightmarish, periodic waves. They could feel the hum
  from where they stood, a subsonic vibration that made their teeth ache and their
  guts clench.
