raw_quote: '"I came south because the resonance was pulling me. Because something
  in this land recognized me. Because the guardian—the sentinel—stirred when I approached.
  I did not know what I would find. I still do not know. But I know this: I am not
  here to conquer. Not to command. Not to rebuild what was lost. I am here to connect.
  To offer what I am—a constant, a reference, a still point that the world can rest
  against without being bound to. And to ask if you will let me build the next point.
  The one that will link this place to the network we are weaving. Not to control.
  To remember. To let the land feel itself as part of something larger."'
