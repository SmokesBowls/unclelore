raw_quote: 'Halvar froze. His ax hovered mid-swing. Through the neural link, Geralt
  tasted copper and salt—the sergeant’s memory-flash: Mars, sand choking his brother’s
  lungs. The vines hissed: "Too slow. Always too slow." Halvar roared—not in battle-fury,
  but anguish. Shadows deepened. Vril-light bent. The Garden remembered pain, and
  now it weaponized regret. Victory required more than blades. It demanded belief
  in unraveling minds.'
