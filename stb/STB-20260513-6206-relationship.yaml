raw_quote: She pressed her forehead to the chimney stone. The fragment in her own
  chest—the full name, both halves, held silent for longer than anyone—was quiet.
  It had always been quiet. She had learned to hold it decades ago, and the holding
  had become part of her, and the cost had been paid so long ago that she no longer
  remembered what it had taken from her. But she recognized the strain in the others.
  She remembered what it felt like to hold something too heavy for too long and not
  know if the holding would break you.
