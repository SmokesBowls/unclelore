raw_quote: The occupation had not retreated. It had reclassified. The reclassification
  was a strategic error. The anomaly was not contained. The anomaly had never been
  the chamber. The anomaly was the warmth, and the warmth was already moving, and
  the path through the drowned channels was growing warmer by the day, and the stones
  at the base of the eastern wall were accumulating, and the survivors were leaning
  east, and the Igigi were humming a half-second late, and the Nephoretti were sharpening
  their tones toward the old song, and the center was holding, and the center was
  not stationary.
