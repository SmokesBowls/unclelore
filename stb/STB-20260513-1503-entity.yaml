raw_quote: '"Not lost," Kaelen countered sharply. "Filed elsewhere. Your act created
  temporal eddies—safe pockets where they coalesce. Stable points. But finding them…"
  She trailed off, gesturing towards the shifting Nexus basin. The chroniton streams
  churned violently, reacting to the vortex''s collapse. New fracture points shimmered
  into existence like wounds opening. "Requires navigating a destabilized Nexus. Requires
  mastery you haven''t yet claimed." Geralt forced air into his burning lungs. The
  dragon armor hummed faintly, a low thrum of defiance against the despair. Zaron
  wasn''t done. Neither was he. He pushed himself upright, ignoring the agony in his
  side. "Then I master it." His voice was raw, but steady. "Where do I start?" Kaelen
  pointed towards a newly formed fracture pulsing sickly violet near the petrified
  forest shard. "There. A chroniton cascade. Stabilize it before it collapses further.
  Anchor yourself *first*. Your signature is frayed." Geralt nodded, the applicator
  spitting static as he locked onto the violet pulse. One fracture at a time. One
  anchor point. Until he could chart the eddies. Until he could find them all. He
  leapt towards the violet light. The hunt had changed, but it wasn''t over.'
