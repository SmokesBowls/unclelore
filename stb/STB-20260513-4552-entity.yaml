raw_quote: The Igigi watched Vale's face. Something passed between them—not understanding,
  but acknowledgment. Then the Igigi shook his head, a small motion. "But that ain't
  a short story, my boy." He picked up the leafbowl, took a long drink, and set it
  down. "That part can wait." He leaned back against the boulder. "Get some rest."
