raw_quote: Geralt pushed off the wall. Mika’s face flashed in his mind – fierce, loyal,
  gone in the Harbinger’s light. The Five, his squad, erased. *Not erased,* he thought,
  the applicator and armor humming in unison with the stabilized nodes. *Filed. Trapped.*
  Kaelen was right. Rushing meant death. This brutal training *was* the path back.
  He wasn’t just learning to fix time; he was learning to dive into its darkest corners
  and pull his people out. He limped towards the ice tunnel, the Chronohounds’ metallic
  shrieks vibrating the ice around him. Hands-on. Necessary. For Mika. For the Five.
  For the 250. He plunged into the cold dark after Kaelen. The retrieval began with
  survival.
