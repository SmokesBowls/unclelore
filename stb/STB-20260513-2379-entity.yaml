raw_quote: Vek’tar stared, his expression shifting through shock, recognition, and
  a deep, weary horror. “You,” he breathed. “The Anchor. The debt-walker. I’ve seen
  you. In the folds. Always at the center of the unraveling.” He phased fully out
  of the cliff, dropping twenty feet to land in a crouch before them, wincing as his
  injured leg took the weight. He never took his eyes off Geralt. “Luminaire sent
  you. She wants the broken scout to navigate the dying jumps. Of course she does.”
