raw_quote: For two cycles, it worked. The stillness scattered. The pauses shrank.
  The network's rhythms, still fragile, still learning, were disrupted by the randomization
  of the occupation's timing. The child felt the difference in the stone—the warmth
  was still there, but it was harder to find, masked by the erratic vibration of patrols
  that no longer followed predictable routes. The mason's leg ached more sharply.
  The Igigi's compliance delay wavered for the first time in weeks.
