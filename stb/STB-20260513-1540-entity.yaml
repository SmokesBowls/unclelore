raw_quote: Oreck matched her stride, his lenses whirring softly. He saw the fierce
  hope blazing in her eyes, the desperate certainty that Geralt was *here*, trapped
  within these obsidian walls. "Mika," he said, his voice low and urgent, cutting
  through the tramp of boots. "Listen. What you saw in the bleed... Geralt wasn't
  *here*. He wasn't bleeding *into* this Tower." He gestured sharply at the dark entrance
  swallowing them. "This isn't the source. This isn't the passage *to* him." His lenses
  locked onto hers. "This is the Echo Tower. Where Zypher took Geralts five loyal
  followers after finding their body's at the crash site. We came *here*, Mika, hoping
  Geralt had somehow came here too, after his crash. But after what you witnessed...
  him straining against the temporal currents, pouring himself out *there*..." Oreck
  paused, the hum of the Tower vibratingthrough their boots. "I don't want you to
  get your hopes up. He might be anywhere. Or any*when*. But not necessarily *here*.".
  "I don't want you to get your hopes up.
