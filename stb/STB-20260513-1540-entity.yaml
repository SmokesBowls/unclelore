raw_quote: 'Five days later, the scent of charred alloy and spilled coolant hit them
  long before the wreck came into view. The *Void Dancer*''s carcass sprawled across
  a desolate valley, a twisted monument of warped durasteel ribs and shattered engine
  cores. Scavenger clans swarmed it like carrion beetles – Ironjaw Bruisers hauling
  plating, Dustsniffers disassembling conduits. Amid the chaos, a distinct group worked
  with unnerving precision near the ship’s ruptured command spire. They wore patchwork
  enviro-suits fused with scavenged Anunnaki tech: glowing gauntlets, multi-lensed
  visors, humming power-packs grafted onto their backs. Their leader, a lean woman
  with stark white hair escaping her helmet seal, gestured sharply at a partially
  dislodged shield generator.'
