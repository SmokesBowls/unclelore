raw_quote: Kaelen remained standing beside the silent Star Needle, her gaze fixed
  on the spot where the vortex had vanished. "Time isn't clay, Geralt. It's fractured
  crystal. You don't mold it; you brace its flaws." She turned, her galactic eyes
  pinning him. "The cost was *you*. Your will, focused through that tripartite dissonance,
  fueled the alteration. Your applicator screams warnings because temporal manipulation
  violates its Queen-programmed parameters. Your armor roared approval because defiance
  *is* its nature." She gestured sharply towards the wreckage-strewn canyon. "Now,
  apply the lesson. Not to echoes. To *now*. Feel the instability *here*, the lingering
  chroniton bleed from your premature activation. Stabilize *this* moment before it
  attracts scavengers... or worse."
