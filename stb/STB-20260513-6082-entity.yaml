raw_quote: She bent to lift another handful of silt. The motion was automatic. The
  compliance collar around her throat was cold. It had always been cold. It had been
  cold since the day Zephyr's thread was severed, since the Igigi were broken, since
  the occupation recalibrated their resonance into something useful. The collar did
  not permit speech. Speech was not necessary. The Igigi had not spoken in six thousand
  years. The collar did not prevent speech. Speech was simply not done.
