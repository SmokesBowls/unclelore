raw_quote: 'The Luminaire pulsed beneath the tangled roots—not a beacon, but a predator.
  Its core glowed hungrily behind knotted metal, half-submerged in opaque teal liquid.
  Voices layered—Geralt heard Mika’s clipped orders, Oreck’s tactical silence, and
  his own thoughts looping back as distorted commands: *Leave them. Ascend.* The cavern
  groaned. Chroniton crystals embedded in the ceiling wept glowing droplets that hissed
  where they struck the water. Legionnaire Bren clutched his helmet as his own reflection
  screamed silently up at him—a hollow-eyed prisoner bound in chains he’d forged.
  "The roots… they’re shifting!" Lyra yelled, voice frayed. The Luminaire’s casing
  trembled, metal vines uncoiling like awakened serpents. One lashed out, wrapping
  Torren’s ankle, dragging him toward the luminous pool. Halvar lunged, shock-lance
  spitting futile sparks against the resonant shield. Geralt’s gauntlet vibrated—Zaron’s
  roar reduced to static.'
