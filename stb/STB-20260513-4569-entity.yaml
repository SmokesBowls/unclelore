raw_quote: A sound. Low. Not loud—but wrong. Not wind. Not shifting rock. Vale was
  already on his feet. The ground ahead of them shifted—subtle at first. Then again.
  A heavy, uneven displacement, like weight settling where nothing had been a moment
  before. The Igigi stood slower—but his eyes locked forward immediately. Something
  moved across the ridge line. Tall. But not like the others.
