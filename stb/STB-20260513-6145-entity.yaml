raw_quote: The warmth in the stone deepened by a fraction. The groove beneath Vale's
  palm, in the sealed chamber half a city away, deepened by a fraction. The subsonic
  hum adjusted its frequency to match the new voice. The fragment had been spoken
  three times now—four, if you counted the soundless shaping of the old woman's lips—and
  it was not yet complete, but it was closer. The gap between the first half and the
  second was narrowing. The name was assembling itself, syllable by syllable, body
  by body, house by house.
