raw_quote: Geralt's canteen shattered against the ground. Not from impact—from expansion.
  The frozen water inside had grown teeth, claws, *purpose*, bursting its metal prison
  as Blue Mika coalesced from the spreading pool, liquid still cascading off her pauldrons
