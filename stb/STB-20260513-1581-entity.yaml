raw_quote: Lyra’s medicae rig spat a final spark. Her reflection showed bone where
  flesh should be—a healer’s failure made manifest. She met Geralt’s eyes across the
  churning light. "It needs balance," she gasped. "Not a master. An anchor." The Luminaire
  flared, its light searing. Mika fought beside him, shieldless, lance spearing another
  root-tendril. Chroniton droplets rained down like molten stars. Time liquefied.
  Halvar hauled Torren free, both bleeding phosphorescent fluid. The cavern walls
  shimmered, dissolving into resonance.
