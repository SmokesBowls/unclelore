raw_quote: A structure in the space between them, supported by stone, by warmth, by
  every node that had carried the load to this point. The Igigi in the channel stopped
  mid-motion, her body catching a tone she had not made. The older singer in the grove
  lost the need for counter-resonance, her silence becoming complete rather than constructed.
  The old woman’s chest tightened as the full weight of what she had held for decades
  shifted—not leaving her, but no longer contained solely within her.
