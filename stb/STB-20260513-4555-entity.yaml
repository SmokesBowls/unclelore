raw_quote: They had been walking for an hour when the Igigi spoke. The sea was visible
  to the south, a line of grey‑blue under a pale sky. He glanced toward it, then back
  at the path. "You ever been out there, my boy?" Vale followed his gaze. "Out in
  the water?" "Deep water." Vale shook his head. "Only after the flood. Never stayed."
  The Igigi nodded slowly. "Yeah… sounds about right." He said nothing else. They
  kept walking.
